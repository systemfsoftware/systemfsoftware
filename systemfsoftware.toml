# OMP plugin practice configuration
# Skills that MUST NOT be delegated to subagent dispatches (task / Agent).
# Adding or removing a skill is a config edit, never a code edit.
no_delegate_skills = [
  "lfg",
  "ce-babysit-pr",
  "ce-brainstorm",
  "ce-code-review",
  "ce-commit",
  "ce-commit-push-pr",
  "ce-compound",
  "ce-compound-refresh",
  "ce-debug",
  "ce-doc-review",
  "ce-explain",
  "ce-ideate",
  "ce-optimize",
  "ce-plan",
  "ce-pov",
  "ce-proof",
  "ce-resolve-pr-feedback",
  "ce-riffrec-feedback-analysis",
  "ce-simplify-code",
  "ce-strategy",
  "ce-test-browser",
  "ce-work",
  "ce-worktree",
]

# @-ref target file names the omp host already renders as context files, so the
# claude-compat plugin must not inject a second copy. Absent, it defaults to
# ["AGENTS.md"]; set it to [] to disable suppression entirely.
#
# WARNING: every value in this file must be an array of strings. A scalar such
# as no_inject_refs = "AGENTS.md" fails the whole-file decode and silently
# voids no_delegate_skills above along with it.
# no_inject_refs = ["AGENTS.md"]
