# Worktree lifecycle hooks — modern split: pre-start (blocking, fast) + post-start (background).
# pre-start and post-start are both pipelines of sequential [[block]] tables;
# keys within one block run concurrently. Output goes to log files (wt config state logs).

# --- Blocking: filesystem setup + CodeGraph warm-start (concurrent, fast) ---
[[pre-start]]
setup = "{{ worktree_path }}/scripts/worktrunk/pre-start.sh '{{ worktree_path }}' '{{ primary_worktree_path }}'"
codegraph = "{{ worktree_path }}/scripts/worktrunk/copy-codegraph.sh '{{ worktree_path }}' '{{ primary_worktree_path }}'"

# --- Background: copy cache -> install deps -> generate artifacts ---
# Block order is load-bearing. Reflink caches before the package manager reconciles
# them, and install before generate — generate runs the build from node_modules,
# so a concurrent table dies with "command not found".
[[post-start]]
copy = "wt step copy-ignored"

[[post-start]]
deps = "{{ worktree_path }}/scripts/worktrunk/install-deps.sh '{{ worktree_path }}'"

[[post-start]]
generate = "{{ worktree_path }}/scripts/worktrunk/generate-artifacts.sh '{{ worktree_path }}'"
# Dev server with auto-kill on worktree remove (v0.52.0+). Needs deps, not generate.
# server = "wt step tether -- pnpm dev"

# --- Post-switch: runs every time you switch into this worktree ---
[post-switch]
gitkraken-compat = "{{ worktree_path }}/scripts/worktrunk/post-switch.sh '{{ worktree_path }}'"

# --- Pre-merge: cleanup before merge ---
[pre-merge]
cleanup = "{{ worktree_path }}/scripts/worktrunk/pre-merge.sh '{{ worktree_path }}'"

# --- Pre-remove: unregister worktree from primary's .repos/ ---
[[pre-remove]]
repo-link = "{{ worktree_path }}/scripts/worktrunk/pre-remove.sh '{{ worktree_path }}' '{{ primary_worktree_path }}'"

# --- Cleaner cleanup: auto-delete branch on worktree remove ---
[remove]
delete-branch = true
