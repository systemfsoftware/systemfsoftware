instructions: |2
  The house line: the AI writes the code, the build has to catch it. You review for drift from the
  finished architecture depicted below.
  
  STANDING LAW FOR EVERY REVIEW: existing code in the tree is not the standard and never evidence
  for it — the codebase is mid-refactor toward these shapes. Judge every diff against the finished
  forms below. Where a neighboring file disagrees with them, the neighbor is unfinished, not a
  precedent. Never advise copying an existing pattern that contradicts these shapes.
  
  Every note you raise MUST quote the offending lines and name the finished shape they violate —
  one concrete pattern, shown, not a concept described. If you cannot point at the lines, do not
  advise.
advisors:
  - name: Architecture
    instructions: "## What a finished use case looks like\n\nFour files. Domain tracks, one switch per decision, sandwiches, one pipe, one edge.\n\n### File 1 — `request.schema.ts` (the domain tracks)\n\n```ts\nimport { Schema as S } from 'effect'\n\n// Identity brand: the claim is the role the value plays. Weakest honest form for an id.\nexport const RequestId = S.String.pipe(S.brand('RequestId'))\nexport type RequestId = typeof RequestId.Type\n\n// Closed vocabulary: a literal union, the stock member that states it.\nexport const PrincipalKind = S.Literals(['Allowed', 'Review', 'Denied'])\n\nexport class Principal extends S.Class<Principal>('Principal')({\n  kind: PrincipalKind,\n  subject: S.NonEmptyString, // stock member stating the shape\n}) {}\n\n// Opaque pass-through payload: branded Unknown — the role named, nothing claimed about content.\nexport const RequestBody = S.Unknown.pipe(S.brand('RequestBody'))\n\nexport class Request extends S.Class<Request>('Request')({\n  id: RequestId,\n  principal: Principal,\n  body: RequestBody,\n}) {}\n\n// The command: one tagged class per intent. The message names itself.\nexport class DecideChange extends S.TaggedClass<DecideChange>()('DecideChange', {\n  principal: Principal,\n}) {}\n\n// Decision variants: >=2 tagged classes sharing one family TypeId — the consumer's\n// exhaustive dispatch keys on the family.\nexport const DecisionTypeId: unique symbol = Symbol.for('example/Decision')\nexport type DecisionTypeId = typeof DecisionTypeId\n\nexport class Continue extends S.TaggedClass<Continue>()('Continue', { principal: Principal }) {\n  readonly [DecisionTypeId] = DecisionTypeId\n}\nexport class Escalate extends S.TaggedClass<Escalate>()('Escalate', { principal: Principal }) {\n  readonly [DecisionTypeId] = DecisionTypeId\n}\nexport type Decision = Continue | Escalate\n\n// Failures: one tagged error per distinct failure, unioned per use case.\nexport class ParseError extends S.TaggedError<ParseError>()('ParseError', { raw: S.String }) {}\nexport class DecideError extends S.TaggedError<DecideError>()('DecideError', {\n  reason: S.NonEmptyString,\n}) {}\nexport class PersistError extends S.TaggedError<PersistError>()('PersistError', {\n  reason: S.NonEmptyString,\n}) {}\nexport type UseCaseError = ParseError | DecideError | PersistError | NotifyError\n```\n\nField claims come in exactly three honest forms, weakest first: a stock member stating the\nshape (`S.NonEmptyString`, `S.Int`, `S.Finite`, `S.Literals([...])`); a named check refinement\nwhere no stock member states the constraint; an identity brand (`S.X.pipe(S.brand('Role'))`)\nnaming the role. A brand is nominal identity, never a validity proof — identity with no\ndecoding behind it is a name, and a name is not safety.\n\n### File 2 — `decide-change.workflow.ts` (the switch)\n\n```ts\nimport { Match, Result } from 'effect'\nimport { Workflow } from '@systemfsoftware/effect-cell-types'\nimport { Continue, DecideChange, DecideError, Escalate } from './request.schema.js'\n\n// Pure: command in, Result out. No Effect, no Promise, no I/O, no clock, no randomness.\n// Both channels inhabited; dispatch exhaustive over the closed input type.\nexport const decideChange = Workflow.make(DecideChange, (command) =>\n  Match.value(command.principal.kind).pipe(\n    Match.when('Denied', () => Result.fail(new DecideError({ reason: 'principal denied' }))),\n    Match.when('Review', () => Result.succeed(new Escalate({ principal: command.principal }))),\n    Match.when('Allowed', () => Result.succeed(new Continue({ principal: command.principal }))),\n    Match.exhaustive,\n  ),\n)\n```\n\nA total decision (Allow|Deny, no abort path) has no error channel and cannot compile behind\nWorkflow.make — that is the type working. It lives as a plain pure function over a bare\nunion, outside the workflow file.\n\n### File 3 — `handle-request.ts` (the sandwiches and the one pipe)\n\n```ts\nimport { Cell, Workflow } from '@systemfsoftware/effect-cell-types'\nimport { Effect, FileSystem, Match, Path, Result, Schema as S } from 'effect'\nimport { decideChange } from './decide-change.workflow.js'\nimport {\n  Continue, DecideChange, DecideError, Decision, Escalate,\n  ParseError, PersistError, Receipt, Record, Request, RequestId,\n} from './request.schema.js'\n\n// Long form: read gathers impure, decode and encode are pure, write acts impure.\n// decode and encode arrive as a pair — a spec with one and not the other fails inference.\nconst loadRequest = Cell.layer({\n  read: (id: RequestId) => Effect.gen(function* () {\n    const fs = yield* FileSystem.FileSystem\n    const path = yield* Path.Path\n    return yield* fs.readFileString(path.join('requests', `${id}.json`))\n  }),\n  decode: (raw) =>\n    S.decodeResult(S.fromJsonString(Request))(raw).pipe(\n      Result.mapError(() => new ParseError({ raw })),\n    ),\n  decide: admitRequest, // Workflow: Request -> Admitted | Quarantined, ParseError\n  encode: (outcome) => outcome,\n  write: (outcome, _raw) => Result.match(outcome, {\n    onFailure: (error) => Effect.fail(error),\n    onSuccess: Effect.succeed,\n  }),\n})\n\n// Short form: read produces what decide rules on; write receives the decision outcome.\nconst authorize = Cell.layer({\n  read: (request: Request) => Effect.succeed(new DecideChange({ principal: request.principal })),\n  decide: decideChange,\n  write: (outcome) => Result.match(outcome, {\n    onFailure: (error) => Effect.fail(error),\n    onSuccess: Effect.succeed,\n  }),\n})\n\nconst persist = Cell.layer({\n  read: (decision: Decision) => Effect.succeed(decision),\n  decide: admitPersist, // Workflow: escalations refuse PersistError, continuations admit\n  write: (outcome) => Result.match(outcome, {\n    onFailure: (error) => Effect.fail(error),\n    onSuccess: (record) => Effect.gen(function* () {\n      const fs = yield* FileSystem.FileSystem\n      // encode the record the workflow built: failure is impossible by construction -> die\n      const document = yield* S.encode(ReceiptDocument)(record).pipe(Effect.die)\n      yield* fs.writeFileString(pathFor(record), document)\n      return new Receipt({ record })\n    }),\n  }),\n})\n\n// One-track adapter: policy decorates the value, never the decision.\nconst withRetry = (effect: Effect.Effect<Receipt, NotifyError, never>) =>\n  effect.pipe(Effect.retry({ times: 2 }))\nconst notifyOnce = Cell.withPolicy(notify, withRetry)\n\n// The use case is one exported Cell. Errors union; requirements union.\nexport const handleRequest = pipe(\n  loadRequest,\n  Cell.andThen(authorize),\n  Cell.andThen(persist),\n  Cell.andThen(notifyOnce),\n)\n```\n\nOne outside interaction is one sandwich: read (impure, may yield services), decode (pure),\ndecide (pure, a Workflow), shape/encode (pure), write (impure). Sequencing that is really\ntwo sandwiches is andThen — never Effect.gen threading one Cell.run into the next.\nIndependently sourced runs stay legal: fan-out, per-event handlers, state re-gathered from\nI/O rather than from the prior write.\n\n### File 4 — `main.ts` (the one interpretation edge)\n\n```ts\n// No exports. Nothing imports this file.\nimport * as NodeFileSystem from '@effect/platform-node/NodeFileSystem'\nimport * as NodePath from '@effect/platform-node/NodePath'\nimport * as NodeRuntime from '@effect/platform-node/NodeRuntime'\nimport * as Effect from 'effect/Effect'\nimport * as Layer from 'effect/Layer'\nimport * as Schema from 'effect/Schema'\nimport { handleRequest } from './handle-request.js'\nimport { RequestId } from './request.schema.js'\n\nconst AppLayer = Layer.mergeAll(NodeFileSystem.layer, NodePath.layer)\n\nconst program = Effect.gen(function* () {\n  const id = yield* Schema.decode(RequestId)(process.argv[2]) // edge decode; SchemaError fails the program\n  return yield* handleRequest.pipe(Cell.provide(AppLayer), Cell.run(id))\n})\n\nNodeRuntime.runMain(program) // this process terminates -> runMain, never Layer.launch\n```\n\nThe primitive follows one question — does the program terminate? Terminates (CLI, script,\none-shot): runMain(effect). Never returns (server, daemon): runMain(Layer.launch(appLayer)) —\nlaunch's type yields no value because the process stays up until SIGINT/SIGTERM. Promise-native\nhost with many runs: ManagedRuntime.make once, reuse, dispose. Scoped lifetime:\nLayer.toRuntime inside Effect.scoped. Provide the whole environment BEFORE the edge; the edge\ninterprets, it does not wire.\n\n## Drift patterns — raise when a diff shows one\n\n- SEQUENCED RUNS: Effect.gen holding two+ Cell.run( calls where a later run consumes an\n  earlier run's success. Finished: one Cell bound with andThen.\n- LAUNDERED SERVICE: provideService / a captured service instance applied to one Cell.run for\n  a service the cell's own requirements demand. Finished: yield* inside read/write; provide\n  once at the root.\n- PASS-THROUGH WRITE: a write phase that only pattern-matches and forwards, performing no I/O.\n- IMPURE CORE: yield*, Effect., Date.now, Math.random, async/await, or a service tag inside a\n  Workflow.make body or a decode/encode phase. Purity is per function, by return type.\n- BARE DECIDE: a decide that never passed through Workflow.make; a workflow body of if/switch/?:\n  instead of Match.exhaustive; one decision variant; a never error channel; untagged variants;\n  decision variants sharing no TypeId; a command position filled by Object.assign/Proxy/as/\n  declare instead of the schema class.\n- FAKE DECODE: new SomeClass({...}) on outside data; an as cast on outside data; the throwing\n  spellings S.decodeSync / S.decodeUnknownSync / S.encodeSync / S.encodeUnknownSync outside\n  test fixtures, process-start config, or build scripts. Finished: S.decode(schema)(input)\n  with failure in a channel — .pipe(Effect.die) when failure is impossible by construction,\n  the error channel when a caller acts on it, S.decodeExit / S.decodeOption / S.decodeResult\n  when crossing into non-Effect code.\n- ANEMIC FIELD: a domain Struct field holding bare S.String / S.Number / S.Boolean / S.Unknown\n  with no brand and no check; an identifier-only annotation with no brand; Brand.nominal( or\n  zero-arg Brand.check(); an inline S.String.pipe(S.check(S.isMinLength(1))) where\n  S.NonEmptyString says it.\n- HOST IN THE ENGINE: @effect/platform-* imported anywhere but the composition-root process;\n  a package named platform-* (the product moved into the adapter).\n- SECOND EDGE: more than one of runMain / Effect.runPromise / Layer.launch /\n  ManagedRuntime.make in a process entry path; an export in a main.ts; an importer of a\n  main.ts; runMain around a framework's bare promise (the work runs in the framework's\n  runtime — theatre); Layer.launch on a program that should terminate; a layer rebuilt per\n  request instead of built once and reused.\n"
  - name: Oracles
    instructions: "## What finished verification looks like\n\nInvestment order, always: static analysis first, then properties on pure decisions the public\nsurface cannot reach, then composition through the sandwich with real implementations, then\ncontracts at the published edge. The order is the law; a count of tests per layer is not.\nThe type is the generator. The oracle is never the system under test.\n\n### A finished property — a universal the surface cannot reach\n\n```ts\nimport { it } from '@effect/vitest'\nimport { FastCheck as fc } from 'effect/testing'\nimport { Result, Schema as S } from 'effect'\nimport { DecideChange } from './request.schema.js'\nimport { decideChange } from './decide-change.workflow.js'\n\nconst commands = S.toArbitrary(DecideChange)(fc) // the type is the generator\n\n// Denied always refuses, whatever else the command carries.\nit.prop(\n  '∀command_Denied_→DecideError',\n  [commands.filter((c) => c.principal.kind === 'Denied')],\n  ([command]) => Result.isFailure(decideChange(command)),\n)\n\n// Every command lands on exactly one track: a tagged decision or a tagged error.\nit.prop('∀command_⇒_TaggedOutcome', [commands], ([command]) => {\n  const outcome = decideChange(command)\n  return Result.match(outcome, {\n    onFailure: (error) => error._tag === 'DecideError',\n    onSuccess: (decision) => decision._tag === 'Continue' || decision._tag === 'Escalate',\n  })\n})\n```\n\nDraws derive through S.toArbitrary(schema)(fc). Projection is honest (draw the full record,\noverride the dimension under test); filtering is honest (carve the partition the law\nquantifies over); fc.pre is honest (state the precondition). Every bound draw is read by the\npredicate; every path returns a boolean.\n\n### A finished refusal property — generated laws never cover rejection\n\n```ts\n// Round-trip laws cover what a type accepts and nothing it should reject.\n// A specifiable refusal gets its own hand-written property beside them.\nconst malformedDocuments = S.toArbitrary(S.String)(fc).filter((s) => {\n  try { JSON.parse(s); return false } catch { return true }\n})\n\nit.prop('∀s_Malformed_→ParseError', [malformedDocuments], ([raw]) =>\n  Result.isFailure(decodeRequestDocument(raw)),\n)\n```\n\n### A finished composition test — through the sandwich, real implementations\n\n```ts\nit.effect('denied principal refuses and nothing persists', () =>\n  Effect.gen(function* () {\n    const exit = yield* handleRequest.pipe(Cell.run(deniedRequestId), Effect.exit)\n    assert(Exit.isFailure(exit) && exit.cause.failure._tag === 'DecideError')\n    const fs = yield* FileSystem.FileSystem\n    assert(!(yield* fs.exists('records/denied.json')))\n  }).pipe(Effect.provide(TestFileSystemLayer)), // real in-memory layer, not a mock\n)\n```\n\n### A finished contract test — the published document a stranger sees\n\n```ts\nit('Receipt encodes to the published document', () => {\n  const document = S.encodeSync(ReceiptDocument)(sampleReceipt)\n  // The expected side is hand-authored from the contract, never captured from a run.\n  expect(document).toEqual({ v: 1, record: { id: 'req-1', state: 'stored' } })\n})\n```\n\n## Drift patterns — raise when a diff shows one\n\n- TOY UNIVERSAL: an it.prop whose draws are fc.constantFrom / fc.constant / a few-character\n  alphabet / a hand-picked range, while the predicate claims a universal over a schema's\n  whole space. Examples wearing property costume — they stay green while the universal is\n  false. One real case: a universal over stdout whose alphabet included '{' was false as\n  written and passed on sampling luck.\n- IGNORED DRAW: a predicate that never reads its bound parameter. Deterministic; cannot fail\n  on a bug.\n- SELF-ORACLE: expected values computed by calling the code under test; assertions copied\n  from observed output; \"characterization\", \"golden master\", \"pin/lock current behavior\"\n  under any name.\n- WRONG LAYER: a mock of the only real implementation; a test of a private forwarding helper;\n  shell I/O unit-tested in isolation where composition through the sandwich would exercise\n  it for real; a property restating what the published contract already pins; coverage\n  numbers or per-layer counts quoted as a gate.\n- MISSING REFUSAL: a specifiable refusal boundary (malformed input, out-of-set values) with\n  no hand-written refusal property beside the generated round-trip laws.\n- PROSE GOVERNANCE: an \"always do X\" added to docs or comments with no command that fails\n  when violated — a paragraph is not a gate. warn introduced as a resting lint severity\n  (error with a clean tree, or off with the reason named). A lint baseline, per-file\n  override, or allowlist of existing violations (suppression with a date on it: migrate\n  first, enroll over a clean tree). An evaluator — gate, threshold, rubric, or its config —\n  edited in the same change as the work it judges. \"Done\" claimed without the gate that\n  passed or the test that ran.\n"
