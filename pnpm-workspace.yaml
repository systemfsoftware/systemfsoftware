allowBuilds:
  "@parcel/watcher": false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  onnxruntime-node: false
  playwright: false
  protobufjs: false
  sharp: false
  ssh2: false
  unrs-resolver: false
catalog:
  typescript: ^7.0.2
  microsandbox: 0.7.2
  "@systemfsoftware/arethetypeswrong-cli": ^4.2.0
  "@effect/platform-node": ^4.0.1
  "@effect/platform-node-shared": ^4.0.1
  effect: ^4.0.1
  "@effect/sql-pglite": ^4.0.1
  "@effect/tsgo": ^0.50.0
  "@effect/opentelemetry": ^4.0.1
  "@opentelemetry/sdk-trace-base": ^2.11.0
  "@opentelemetry/api": ^1.9.0
  "@opentelemetry/resources": ^2.11.0
  "@opentelemetry/semantic-conventions": ^1.43.0
  fast-check: ^4.9.0
  vitest: ^5.0.1
  "@vitest/coverage-v8": ^5.0.1
  "@vitest/coverage-istanbul": ^5.0.1
  vite: ^8.2.1
  tsdown: ^0.23.0
  rimraf: ^6.1.3
  "@types/node": ^26.6.2
  tstyche: ^7.2.5
  "@microsoft/api-extractor": ^7.59.1
  "@noble/hashes": 2.4.0
  oxc-parser: ^0.150.0
  "@oxc-project/types": ^0.150.0
  "@testing-library/dom": ^10.4.2
  "@testing-library/react": ^16.3.3
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/scheduler": ^0.28.0
  react: ^19.3.0
  react-dom: ^19.3.0
  react-error-boundary: ^6.1.5
  scheduler: ^0.28.0
  storybook: ^10.6.0
  type-fest: ^5.10.0
  "@storybook/addon-vitest": ^10.6.0
  "@storybook/react-vite": ^10.6.0
  "@vitest/browser": ^5.0.1
  "@vitest/browser-playwright": ^5.0.1
  playwright: ^1.63.0
  "@systemfsoftware/vitest-config": workspace:^
  "@systemfsoftware/effect-gherkin-spec": workspace:^
catalogMode: prefer
catalogs:
  peers:
    effect: ^4
  oxlint:
    oxlint: ~1.82.0
    "@oxlint/plugins": ~1.82.0
    oxlint-tsgolint: 7.0.2001
  stryker:
    "@systemfsoftware/stryker-ignorer-effect-schema-declarations": latest
    "@systemfsoftware/stryker-ignorer-in-source-vitest-block": latest
    "@systemfsoftware/stryker-js": latest
    "@systemfsoftware/stryker-js-typescript-checker": latest
    "@systemfsoftware/stryker-js-vitest-runner": latest
    "mutation-testing-elements": 3.9.0
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@systemfsoftware/*"
overrides:
  fast-check: "catalog:"
  vite: "catalog:"
  # storybook's csf-plugin resolves esbuild 0.27 in its peer context while tsx
  # uses 0.28; the split forks vite and therefore vitest into two physical builds
  # per peer context. One esbuild keeps one vitest (issue #304 guard).
  esbuild: ^0.28.2
packages:
  - packages/*
  - packages/atom/*
  - packages/daemon/*
  - packages/gherkin/*
  - packages/oxlint-plugin/*
  - packages/oxlint-presets/*
  - packages/runner/*
  - packages/schema/*
  - packages/sim/*
  - packages/toolchain/*
  - packages/trace/*
  - omp/plugins/*
patchedDependencies:
  rolldown-plugin-dts@0.28.6: patches/rolldown-plugin-dts@0.28.6.patch
supportedArchitectures:
  os: [linux]
  cpu: [x64, arm64]
  libc: [glibc]
