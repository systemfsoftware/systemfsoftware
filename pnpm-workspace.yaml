allowBuilds:
  "@parcel/watcher": false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  onnxruntime-node: false
  playwright: false
  protobufjs: false
  sharp: false
  ssh2: false
  unrs-resolver: false
catalog:
  typescript: ^7
  "@effect/platform-node": ^4.0.0-rc.112
  "@effect/platform-node-shared": ^4.0.0-rc.112
  effect: ^4.0.0-rc.112
  "@effect/vitest": 4.0.0-rc.112
  fast-check: ^4
  vitest: ^4
  "@vitest/snapshot": ^4
  "@vitest/coverage-v8": ^4
  "@vitest/coverage-istanbul": ^4
  vite-tsconfig-paths: ^6.1.1
  vite: ^8
  tsdown: ^0.22.14
  rimraf: ^6.1.3
  "@types/node": ^24
  tstyche: ^7.1.0
  testcontainers: ^12.1.0
  "@microsoft/api-extractor": ^7.58.7
  oxc-parser: ^0.140.0
  "@oxc-project/types": ^0.140.0
  "@oh-my-pi/pi-coding-agent": ^17.0.5
  "@std/toml": jsr:^1.0.11
  "@std/jsonc": jsr:^1.0.2
  "@std/path": jsr:^1.0.0
  "@std/fs": jsr:^1.0.6
  "@testing-library/dom": ^10.4.1
  "@testing-library/jest-dom": ^7.0.0
  "@testing-library/react": ^16.3.2
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@types/scheduler": ^0.26.0
  jsdom: ^29.1.1
  react: ^19.2.8
  react-dom: ^19.2.8
  react-error-boundary: ^6.1.2
  scheduler: ^0.27.0
  storybook: ^10.5.0
  type-fest: ^5.8.0
  "@storybook/addon-vitest": ^10.5.0
  "@storybook/react-vite": ^10.5.0
  "@vitest/browser": ^4
  "@vitest/browser-playwright": ^4
  playwright: ^1
catalogMode: prefer
catalogs:
  # Peer ranges, deliberately separate from the exact pins above.
  # `catalog:` expands at publish to the catalog's literal value, so a peer
  # declared `catalog:` against an exact pin ships an exact peer and forces
  # every consumer on a different rc to duplicate the package.
  peers:
    effect: ^4.0.0-rc.112
    "@effect/vitest": ^4.0.0-rc.112
  oxlint:
    oxlint: ^1.81.0
    "@oxlint/plugins": ^1.81.0
    oxlint-tsgolint: 7.0.2001
  stryker:
    semver: ^7.7.0
    "@systemfsoftware/stryker-js-cli": ^4.0.1
    "@systemfsoftware/stryker-js-typescript-checker": ^3.0.1
    "@systemfsoftware/stryker-js-vitest-runner": ^2.0.1
    "@systemfsoftware/stryker-plugins": ^1.0.1
    "@systemfsoftware/stryker-test-contribution": ^1.0.1
    "mutation-testing-elements": 3.7.3
    "mutation-testing-metrics": 3.7.3
    "mutation-testing-report-schema": 3.7.3
  attw:
    # @systemfsoftware/arethetypeswrong runs the JS compiler bridge (typescript@6).
    # typescript@7 is the native Go compiler with no JS API; see
    # docs/solutions/tooling-decisions/arethetypeswrong-core-requires-js-typescript-api.md
    typescript: ^6.0.3
    # The published CLI. Consumers that must not close a workspace cycle resolve
    # through this catalog instead of `workspace:^`; see
    # docs/solutions/tooling-decisions/registry-consumption-of-self-hosted-forks.md
    "@systemfsoftware/arethetypeswrong-cli": ^1.1.1
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@systemfsoftware/*"
overrides:
  fast-check: ^4
  vite: ^8
  # storybook's csf-plugin resolves esbuild 0.27 in its peer context while tsx
  # uses 0.28; the split forks vite and therefore vitest into two physical builds
  # per peer context. One esbuild keeps one vitest (issue #304 guard).
  esbuild: ^0.28.2
packages:
  - packages/atom/
  - packages/atom/effect-atom/
  - packages/atom/effect-atom-react/
  - packages/oxlint-plugin/
  - packages/stryker-js/
  - packages/arethetypeswrong/
  - packages/toolchain/
  - packages/effect-gherkin-spec/
  - packages/storybook-gherkin/
  - packages/effect-schema-bounded-union/
  - packages/effect-schema-discovery/
  - packages/effect-schema-extensions/
  - packages/effect-schema-law/
  - packages/effect-schema-vite/
  - packages/effect-cell-types/
  - packages/effect-daemon-spec/
  - packages/effect-memfs/
  - packages/hex-schema/
  - packages/npm-package/
  - packages/rx-effect/
  - omp/packages/omp-runtime/
  - omp/packages/harness-toml/
  - packages/oxlint-plugin/import-origin/
  - packages/oxlint-plugin/make-boundary/
  - packages/oxlint-plugin/oxlint-plugin/
  - packages/oxlint-plugin/oxlint-plugin-recommended/
  - packages/oxlint-plugin/oxlint-plugin-cell-vocabulary/
  - packages/oxlint-plugin/oxlint-plugin-effect-dmmf/
  - packages/oxlint-plugin/oxlint-plugin-effect-entrypoint/
  - packages/oxlint-plugin/oxlint-plugin-effect-native/
  - packages/oxlint-plugin/oxlint-plugin-effect-schema/
  - packages/oxlint-plugin/oxlint-plugin-effect-workflow/
  - packages/oxlint-plugin/oxlint-plugin-property-testing/
  - packages/oxlint-plugin/oxlint-plugin-structure/
  - packages/oxlint-plugin/oxlint-plugin-tag-discipline/
  - packages/oxlint-plugin/oxlint-plugin-test-hygiene/
  - packages/oxlint-plugin/oxlint-plugin-test-placement/
  - packages/oxlint-plugin/oxlint-config/
  - packages/oxlint-plugin/all/
  - packages/stryker-js/stryker-js/
  - packages/stryker-js/stryker-js-cli/
  - packages/stryker-js/stryker-js-engine/
  - packages/stryker-js/stryker-js-html-reporter/
  - packages/stryker-js/stryker-js-instrumenter/
  - packages/stryker-js/stryker-js-typescript-checker/
  - packages/stryker-js/stryker-js-vitest-runner/
  - packages/stryker-js/stryker-plugins/
  - packages/stryker-js/stryker-test-contribution/
  - packages/arethetypeswrong/arethetypeswrong/
  - packages/arethetypeswrong/arethetypeswrong-cli/
  - packages/arethetypeswrong/arethetypeswrong-recipes/
  - packages/toolchain/tsconfig/
  - packages/toolchain/tsdown-config/
  - packages/toolchain/vitest-config/
  - omp/plugins/*
config:
  confirm-modules-purge: false
