allowBuilds:
  "@parcel/watcher": false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  onnxruntime-node: false
  playwright: false
  protobufjs: false
  sharp: false
  ssh2: false
  unrs-resolver: false
catalog:
  typescript: ^7.0.2
  microsandbox: 0.7.8
  "@systemfsoftware/arethetypeswrong-cli": ^4.2.0
  "@effect/platform-node": ^4.0.5
  "@effect/platform-node-shared": ^4.0.5
  effect: ^4.0.5
  "@effect/sql-pglite": ^4.0.5
  "@effect/tsgo": ^0.51.1
  "@effect/opentelemetry": ^4.0.5
  "@opentelemetry/sdk-trace-base": ^2.12.0
  "@opentelemetry/api": ^1.9.0
  "@opentelemetry/resources": ^2.12.0
  "@opentelemetry/semantic-conventions": ^1.43.0
  fast-check: ^4.10.2
  vitest: ^5.0.5
  "@vitest/coverage-v8": ^5.0.5
  vite: ^8.3.4
  tsdown: ^0.23.0
  rimraf: ^6.1.3
  "@types/node": ^26.6.5
  tstyche: ^7.2.5
  "@microsoft/api-extractor": ^7.59.4
  oxc-parser: ^0.153.0
  "@oxc-project/types": ^0.153.0
  "@systemfsoftware/vitest-config": workspace:^
  "@pnpm/logger": ^1100.0.0
  "@pnpm/workspace.projects-reader": ^1101.1.4
  "@pnpm/workspace.root-finder": ^1100.1.3
  "@pnpm/workspace.workspace-manifest-reader": ^1100.2.2
catalogMode: prefer
catalogs:
  peers:
    effect: ^4
  oxlint:
    oxlint: ~1.87.0
    "@oxlint/plugins": ~1.87.0
    oxlint-tsgolint: 7.0.2003
  stryker:
    "@systemfsoftware/stryker-ignorer-effect-schema-declarations": latest
    "@systemfsoftware/stryker-ignorer-in-source-vitest-block": latest
    "@systemfsoftware/stryker-js": latest
    "@systemfsoftware/stryker-js-typescript-checker": latest
    "@systemfsoftware/stryker-js-vitest-runner": latest
    "mutation-testing-elements": 3.9.0
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@systemfsoftware/*"
overrides:
  fast-check: "catalog:"
  vite: "catalog:"
  # storybook's csf-plugin resolves esbuild 0.27 in its peer context while tsx
  # uses 0.28; the split forks vite and therefore vitest into two physical builds
  # per peer context. One esbuild keeps one vitest (issue #304 guard).
  esbuild: ^0.28.2
packages:
  - packages/*
  - packages/daemon/*
  - packages/gherkin/*
  - packages/oxlint-plugin/*
  - packages/oxlint-presets/*
  - packages/runner/*
  - packages/schema/*
  - packages/sim/*
  - packages/toolchain/*
  - packages/trace/*
  - omp/plugins/*
patchedDependencies:
  rolldown-plugin-dts@0.28.6: patches/rolldown-plugin-dts@0.28.6.patch
supportedArchitectures:
  os: [linux]
  cpu: [x64, arm64]
  libc: [glibc]
