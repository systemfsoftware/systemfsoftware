allowBuilds:
  "@parcel/watcher": false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  onnxruntime-node: false
  playwright: false
  protobufjs: false
  sharp: false
  ssh2: false
  unrs-resolver: false
  workerd: false
catalog:
  typescript: ^7.0.2
  microsandbox: 0.8.2
  "@systemfsoftware/arethetypeswrong-cli": ^4.2.0
  "@alchemy.run/cloudflare": 2.0.0-beta.87
  "@alchemy.run/test": 2.0.0-beta.87
  alchemy: 2.0.0-beta.87
  "@effect/platform-node": ^4.1.4
  "@effect/platform-bun": ^4.1.4
  "@effect/platform-node-shared": ^4.1.4
  effect: ^4.1.4
  "@effect/sql-pglite": ^4.1.4
  "@effect/tsgo": ^0.70.0
  "@effect/opentelemetry": ^4.1.4
  "@opentelemetry/sdk-trace-base": ^2.12.0
  "@opentelemetry/api": ^1.10.0
  "@opentelemetry/resources": ^3.1.1
  "@opentelemetry/semantic-conventions": ^1.45.0
  fast-check: ^4.11.0
  "@noble/hashes": ^2.4.0
  vitest: ^5.1.0
  "@vitest/coverage-v8": ^5.1.0
  "@vitest/coverage-istanbul": ^5.1.0
  vite: ^8.3.8
  tsdown: ^0.23.7
  rimraf: ^6.1.4
  "@types/node": ^26.6.6
  tstyche: ^7.2.5
  "@microsoft/api-extractor": ^7.60.1
  oxc-parser: ^0.160.0
  "@oxc-project/types": ^0.160.0
  "@testing-library/dom": ^10.4.2
  "@testing-library/react": ^16.3.3
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/scheduler": ^0.28.0
  react: ^19.3.1
  react-dom: ^19.3.1
  react-error-boundary: ^6.1.6
  scheduler: ^0.28.0
  storybook: ^10.6.7
  type-fest: ^5.10.0
  "@storybook/addon-vitest": ^10.6.7
  "@storybook/react-vite": ^10.6.7
  "@vitest/browser": ^5.1.0
  "@vitest/browser-playwright": ^5.1.0
  playwright: ^1.65.1
  "@systemfsoftware/vitest-config": workspace:^
  "@pnpm/logger": ^1100.0.0
  "@pnpm/workspace.projects-reader": ^1101.1.9
  "@pnpm/workspace.root-finder": ^1100.1.8
  "@pnpm/workspace.workspace-manifest-reader": ^1100.3.4
catalogMode: prefer
catalogs:
  peers:
    effect: ^4.1.4
  oxlint:
    oxlint: ~1.93.0
    "@oxlint/plugins": ~1.93.0
    oxlint-tsgolint: 7.0.2008
  stryker:
    "mutation-testing-elements": 3.9.0
  typescript-api:
    typescript: ~7.0.2
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@systemfsoftware/*"
  - effect
  - "@effect/*"
overrides:
  fast-check: "catalog:"
  vite: "catalog:"
  # storybook's csf-plugin resolves esbuild 0.27 in its peer context while tsx
  # uses 0.28; the split forks vite and therefore vitest into two physical builds
  # per peer context. One esbuild keeps one vitest (issue #304 guard).
  esbuild: ^0.28.2
packages:
  - packages/*
  - packages/gherkin/*
  - packages/oxlint-plugin/*
  - packages/oxlint-presets/*
  - packages/runner/*
  - packages/schema/*
  - packages/sim/*
  - packages/toolchain/*
  - packages/trace/*
  - omp/plugins/*
  - tooling/*
supportedArchitectures:
  os: [linux]
  cpu: [x64, arm64]
  libc: [glibc]
