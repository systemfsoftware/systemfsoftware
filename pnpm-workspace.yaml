allowBuilds:
  "@parcel/watcher": false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  onnxruntime-node: false
  playwright: false
  protobufjs: false
  sharp: false
  ssh2: false
  unrs-resolver: false
catalog:
  typescript: ^7
  "@effect/platform-node": ^4.0.0-rc.111
  "@effect/platform-node-shared": ^4.0.0-rc.111
  effect: 4.0.0-rc.111
  "@effect/vitest": 4.0.0-rc.111
  fast-check: ^4
  vitest: ^4.1.10
  "@vitest/coverage-v8": ^4
  vite-tsconfig-paths: ^6.1.1
  vite: ^8
  tsdown: ^0.22.14
  rimraf: ^6.1.3
  "@types/node": ^26
  tstyche: ^7.1.0
  testcontainers: ^12.1.0
  "@microsoft/api-extractor": ^7.58.7
  oxc-parser: ^0.140.0
  "@oxc-project/types": ^0.140.0
  "@oh-my-pi/pi-coding-agent": ^17.0.5
  "@std/toml": jsr:^1.0.11
  "@std/jsonc": jsr:^1.0.2
  "@std/path": jsr:^1.0.0
  "@testing-library/dom": ^10.4.1
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.2
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@types/scheduler": ^0.26.0
  jsdom: ^30.0.1
  react: ^19.2.8
  react-dom: ^19.2.8
  react-error-boundary: ^6.1.2
  scheduler: ^0.27.0
  storybook: ^10.5.0
  type-fest: ^5.8.0
  "@storybook/addon-vitest": ^10.5.0
  "@storybook/react-vite": ^10.5.0
  "@vitest/browser": ^4
  "@vitest/browser-playwright": ^4
  playwright: ^1
catalogMode: prefer
catalogs:
  # Peer ranges, deliberately separate from the exact pins above.
  # `catalog:` expands at publish to the catalog's literal value, so a peer
  # declared `catalog:` against an exact pin ships an exact peer and forces
  # every consumer on a different rc to duplicate the package.
  peers:
    effect: ^4.0.0-rc.111
    "@effect/vitest": ^4.0.0-rc.111
  oxlint:
    oxlint: ^1.77.0
    "@oxlint/plugins": ^1.77.0
    oxlint-tsgolint: ">=7.0.2001"
  stryker:
    "@stryker-mutator/api": ^9.6.1
    "@stryker-mutator/util": ^9.6.1
    "@stryker-mutator/instrumenter": ^9.6.1
    semver: ^7.7.0
    tslib: ~2.8.0
  attw:
    # arethetypeswrong core runs the JS compiler bridge (typescript@6).
    # typescript@7 is the native Go compiler with no JS API; see
    # docs/solutions/tooling-decisions/arethetypeswrong-core-requires-js-typescript-api.md
    typescript: ^6.0.3
    # The published CLI. Consumers that must not close a workspace cycle resolve
    # through this catalog instead of `workspace:^`; see
    # docs/solutions/tooling-decisions/registry-consumption-of-self-hosted-forks.md
    "@systemfsoftware/arethetypeswrong-cli": ^1.1.1
minimumReleaseAge: 1440
overrides:
  fast-check: ^4
  vite: ^8
packages:
  - packages/core/effect/*
  - packages/core/effect/atom/*
  - packages/core/effect/cell/*
  - packages/core/effect/schema/*
  - packages/core/effect/filesystem/*
  - packages/core/effect/rx/*
  - packages/core/hex/*
  - packages/testing/specs/gherkin/*
  - packages/testing/mutation/stryker-js/*
  - packages/testing/mutation/plugins/*
  - packages/testing/type-testing/arethetypeswrong/*
  - packages/lint/oxlint/*
  - packages/lint/oxlint/plugins/meta/*
  - packages/lint/oxlint/plugins/testing/*
  - packages/lint/oxlint/plugins/cells/*
  - packages/lint/oxlint/plugins/effect/*
  - packages/toolchain/*
  - omp/packages/*
  - omp/plugins/*
config:
  confirm-modules-purge: false
