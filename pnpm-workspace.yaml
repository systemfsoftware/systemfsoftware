    "@stryker-mutator/api": ^9.6.1
    "@stryker-mutator/util": ^9.6.1
    "@stryker-mutator/vitest-runner": ^9.6.1
    "@stryker-mutator/instrumenter": ^9.6.1
    semver: ^7.7.0
    tslib: ~2.8.0
minimumReleaseAge: 1440
overrides:
  vite: ^7
packages:
  - packages/*
  - packages/oxlint-plugins/*
  - packages/stryker-js/*
