  <text x="403.813" y="122.50000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">OrderRejected</text>
</g>
<g class="edge-label" data-from="dec" data-to="e0_OutOfStock" data-label="OutOfStock">
  <rect x="359.94200000000006" y="172.25" width="69.92200000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="394.9030000000001" y="187.4" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">OutOfStock</text>
</g>
<g class="node" data-id="cmd" data-label="PlaceOrder" data-shape="rectangle">
  <rect x="40" y="104.9" width="111.604" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="95.80199999999999" y="123.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">PlaceOrder</text>
</g>
