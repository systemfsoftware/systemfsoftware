  <polygon points="257.77299999999997,65.18100000000001 315.94199999999995,123.35000000000001 257.77299999999997,181.519 199.60399999999998,123.35000000000001" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="257.77299999999997" y="123.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">decision</text>
</g>
<g class="node" data-id="v0_OrderPlaced" data-label="OrderPlaced" data-shape="rectangle">
  <rect x="482.77400000000006" y="40" width="119.01400000000001" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="542.2810000000001" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">OrderPlaced</text>
</g>
<g class="node" data-id="v1_OrderRejected" data-label="OrderRejected" data-shape="rectangle">
  <rect x="482.77400000000006" y="104.9" width="129.388" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="547.4680000000001" y="123.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">OrderRejected</text>
</g>
<g class="node" data-id="e0_OutOfStock" data-label="OutOfStock" data-shape="rectangle">
  <rect x="482.77400000000006" y="169.8" width="107.158" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="536.3530000000001" y="188.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">OutOfStock</text>
</g>
</svg>