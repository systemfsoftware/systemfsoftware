<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 726.586 196.338" width="726.586" height="196.338" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="cmd" data-to="dec" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="206.438,98.169 254.438,98.169" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="dec" data-to="v0_CursorClamped" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="CursorClamped" points="351.3863333333333,78.77933333333333 406.77599999999995,78.77933333333333 406.77599999999995,65.719 541.766,65.719" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="dec" data-to="v1_CursorKept" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="CursorKept" points="351.3863333333333,117.55866666666665 406.77599999999995,117.55866666666665 406.77599999999995,130.619 541.766,130.61899999999997" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="dec" data-to="v0_CursorClamped" data-label="CursorClamped">
  <rect x="414.77599999999995" y="49.71899999999999" width="92.49400000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="461.02299999999997" y="64.86899999999999" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">CursorClamped</text>
</g>
<g class="edge-label" data-from="dec" data-to="v1_CursorKept" data-label="CursorKept">
  <rect x="414.77599999999995" y="114.619" width="73.486" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="451.51899999999995" y="129.769" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">CursorKept</text>
</g>
<g class="node" data-id="cmd" data-label="PlanTruncateCursor" data-shape="rectangle">
  <rect x="40" y="79.719" width="166.438" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="123.219" y="98.169" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">PlanTruncateCursor</text>
</g>
<g class="node" data-id="dec" data-label="decision" data-shape="diamond">
  <polygon points="312.60699999999997,40 370.77599999999995,98.169 312.60699999999997,156.338 254.438,98.169" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="312.60699999999997" y="98.169" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">decision</text>
</g>
<g class="node" data-id="v0_CursorClamped" data-label="CursorClamped" data-shape="rectangle">
  <rect x="541.766" y="47.268999999999984" width="135.31599999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="609.424" y="65.719" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">CursorClamped</text>
</g>
<g class="node" data-id="v1_CursorKept" data-label="CursorKept" data-shape="rectangle">
  <rect x="541.766" y="112.16899999999998" width="111.604" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="597.568" y="130.61899999999997" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">CursorKept</text>
</g>
</svg>