<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 739.0419999999999 196.338" width="739.0419999999999" height="196.338" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="cmd" data-to="dec" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="210.88399999999996,98.169 258.88399999999996,98.169" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="dec" data-to="v0_AnyRelationHeld" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="AnyRelationHeld" points="355.8323333333333,78.77933333333333 411.222,78.77933333333333 411.222,65.719 556.31,65.719" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="dec" data-to="v1_NoRelationHeld" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="NoRelationHeld" points="355.8323333333333,117.55866666666665 411.222,117.55866666666665 411.222,130.619 556.31,130.61899999999997" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="dec" data-to="v0_AnyRelationHeld" data-label="AnyRelationHeld">
  <rect x="419.222" y="49.71899999999999" width="96.05800000000002" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="467.251" y="64.86899999999999" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">AnyRelationHeld</text>
</g>
<g class="edge-label" data-from="dec" data-to="v1_NoRelationHeld" data-label="NoRelationHeld">
  <rect x="419.222" y="114.619" width="90.11800000000002" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="464.281" y="129.769" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">NoRelationHeld</text>
</g>
<g class="node" data-id="cmd" data-label="CombineAnyRelations" data-shape="rectangle">
  <rect x="40" y="79.719" width="170.88399999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="125.44199999999998" y="98.169" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">CombineAnyRelations</text>
</g>
<g class="node" data-id="dec" data-label="decision" data-shape="diamond">
  <polygon points="317.05299999999994,40 375.2219999999999,98.169 317.05299999999994,156.338 258.88399999999996,98.169" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="317.05299999999994" y="98.169" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">decision</text>
</g>
