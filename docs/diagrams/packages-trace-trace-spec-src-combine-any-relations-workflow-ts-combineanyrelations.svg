  <text x="626.1909999999999" y="65.719" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">AnyRelationHeld</text>
</g>
<g class="node" data-id="v1_NoRelationHeld" data-label="NoRelationHeld" data-shape="rectangle">
  <rect x="556.31" y="112.16899999999998" width="132.352" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="622.486" y="130.61899999999997" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">NoRelationHeld</text>
</g>
</svg>