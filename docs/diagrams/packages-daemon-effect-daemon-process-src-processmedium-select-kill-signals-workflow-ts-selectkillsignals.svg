<polyline class="edge" data-from="dec" data-to="v0_BrutalKill" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="BrutalKill" points="316.4975,94.2655 381.58200000000005,94.2655 381.58200000000005,58.45 499.94000000000005,58.45" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
