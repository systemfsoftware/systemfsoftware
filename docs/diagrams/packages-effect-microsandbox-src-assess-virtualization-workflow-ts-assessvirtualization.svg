</g>
<g class="node" data-id="v1_VirtualizationRefused" data-label="VirtualizationRefused" data-shape="rectangle">
  <rect x="573.548" y="112.16899999999998" width="167.92" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="657.508" y="130.61899999999997" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">VirtualizationRefused</text>
</g>
</svg>