  <rect x="40" y="79.719" width="164.95600000000002" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="122.47800000000001" y="98.169" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">AssessVirtualization</text>
</g>
