<g class="edge-label" data-from="dec" data-to="v0_ActOnMember" data-label="ActOnMember">
  <rect x="378.467" y="49.71899999999999" width="84.77200000000002" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="420.853" y="64.86899999999999" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">ActOnMember</text>
</g>
