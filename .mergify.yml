# Mergify: the policy lives in systemfsoftware/.github (.mergify.yml). This file only names this repo's CI checks.
#
# Layering: a PR queues on the static check only (lint + typecheck + dist, ~one lane). The queue
# draft runs the gate, which off main is the fast lanes plus the tests the change affects, and the
# conflict gate. The heavy suites run on main after the merge (.github/workflows/ci.yml).
extends: .github

queue_rules:
    # Checked on the PR itself before it enters the queue.
  - name: subtree
    merge_method: merge
    queue_conditions:
      # Recognised from the commits themselves: both anchored git-subtree trailer
      # lines must be present (ruling 9, SYS-1246). Same checks as default.
      - "commits[*].commit_message ~= (?m)^git-subtree-dir: \\S+$"
      - "commits[*].commit_message ~= (?m)^git-subtree-split: [0-9a-f]{40}$"
      - check-success = build · lint · typecheck · test / static checks (pnpm check:static)
      - check-success = not a plan-only pull request
      - or:
          - check-success = commitlint / lint PR commits
          - check-skipped = commitlint / lint PR commits
      - or:
          - check-success = changeset · shared tooling / a publishable-package change needs an intent
          - check-skipped = changeset · shared tooling / a publishable-package change needs an intent
    # Checked on Mergify's queue draft PR (mergify/merge-queue/*), i.e. CI on the PR rebased with main and any batch.
    merge_conditions:
      - check-success = build · lint · typecheck · test / the gate (pnpm check:ci)
      - check-success = abort on mid-run merge conflict

  - name: default
    # Checked on the PR itself before it enters the queue.
    queue_conditions:
      # Ruling 9 (SYS-1246): subtree PRs merge via the subtree queue above; a subtree
      # claim without trailers matches no queue and cannot merge at all.
      - "-commits[*].commit_message ~= (?m)^git-subtree-dir: \\S+$"
      - "-title ~= (?i)\\b(add|pull|update|sync|vendor|refresh|import)\\b[^.]*\\bsubtrees?\\b|\\bsubtrees?\\b[^.]*(\\badd\\b|\\bpull\\b|\\bupdate\\b|\\bsync\\b|\\bvendor\\b|\\brefresh\\b|\\bimport\\b)"
      # Vendored subtree prefixes in this repo: hand edits without trailers cannot merge.
      - not:
          or:
            - "added-files ~= ^(repos/alchemy|repos/constitution|repos/effect|repos/ttsc|repos/typia|repos/worktrunk-scripts)/"
            - "modified-files ~= ^(repos/alchemy|repos/constitution|repos/effect|repos/ttsc|repos/typia|repos/worktrunk-scripts)/"
      - check-success = build · lint · typecheck · test / static checks (pnpm check:static)
      - check-success = not a plan-only pull request
      - or:
          - check-success = commitlint / lint PR commits
          - check-skipped = commitlint / lint PR commits
      - or:
          - check-success = changeset · shared tooling / a publishable-package change needs an intent
          - check-skipped = changeset · shared tooling / a publishable-package change needs an intent
    # Checked on Mergify's queue draft PR (mergify/merge-queue/*), i.e. CI on the PR rebased with main and any batch.
    merge_conditions:
      - check-success = build · lint · typecheck · test / the gate (pnpm check:ci)
      - check-success = abort on mid-run merge conflict
