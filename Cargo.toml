[workspace]
members = ["apps/*", "crates/*"]
resolver = "2"
default-members = ["apps/gritlint"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/systemfsoftware/systemfsoftware"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
include_dir = "0.7"
proptest = "1"
regex = "1"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "std"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
cognitive_complexity = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
string_slice = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
missing_errors_doc = "allow"
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
