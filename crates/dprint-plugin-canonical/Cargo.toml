[package]
name = "dprint-plugin-canonical"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
# Pinned to what dprint-plugin-typescript 0.96 builds against: the two crates
# exchange `ConfigurationDiagnostic` values, so a version skew here is a type
# error rather than a runtime surprise.
dprint-core = { version = "0.67", features = ["wasm"] }
dprint-plugin-typescript = "0.96"
oxc_allocator = "0.144"
oxc_ast = "0.144"
oxc_ast_visit = "0.144"
oxc_parser = "0.144"
oxc_span = "0.144"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
