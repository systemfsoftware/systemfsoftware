[package]
name = "gritlint_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Engine adapter, rule loading, scanning and reporting for gritlint."

[dependencies]
globset = { workspace = true }
grit-util = { git = "https://github.com/biomejs/gritql", rev = "4ca283484ab9bd11ca3cbc9e14b5ad2db5d61a37", default-features = false }
ignore = { workspace = true }
marzano-core = { git = "https://github.com/biomejs/gritql", rev = "4ca283484ab9bd11ca3cbc9e14b5ad2db5d61a37", default-features = false, features = ["grit-parser", "language-parsers", "non_wasm"] }
marzano-language = { git = "https://github.com/biomejs/gritql", rev = "4ca283484ab9bd11ca3cbc9e14b5ad2db5d61a37", default-features = false, features = ["builtin-parser"] }
marzano-util = { git = "https://github.com/biomejs/gritql", rev = "4ca283484ab9bd11ca3cbc9e14b5ad2db5d61a37", default-features = false }
regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
