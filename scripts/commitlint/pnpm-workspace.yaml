packages:
  - .
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@systemfsoftware/*"
allowBuilds:
  "@parcel/watcher": false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  onnxruntime-node: false
  playwright: false
  protobufjs: false
  sharp: false
  ssh2: false
  unrs-resolver: false
supportedArchitectures:
  os: [linux]
  cpu: [x64, arm64]
  libc: [glibc]
