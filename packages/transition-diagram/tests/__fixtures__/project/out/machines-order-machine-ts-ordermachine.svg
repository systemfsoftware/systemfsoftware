<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 301.048 575.3" width="301.048" height="575.3" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="_start" data-to="idle" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="145.597,68 145.597,116" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="cancelled" data-to="_end" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="89.874,459.3 89.874,507.3" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="idle" data-to="reserved" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="SUBMIT [hasStock]" points="145.597,152.9 145.597,269.20000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="paid" data-to="_end2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="201.32,459.3 201.32000000000002,507.3" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="reserved" data-to="cancelled" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="CANCEL" points="129.21933333333334,306.1 129.21933333333334,342.1 89.874,342.1 89.874,422.40000000000003" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="reserved" data-to="paid" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="PAY [isPaid]" points="161.97466666666668,306.1 161.97466666666668,342.1 201.32000000000002,342.1 201.32,422.40000000000003" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="idle" data-to="reserved" data-label="SUBMIT [hasStock]">
  <rect x="90.09700000000001" y="195.9" width="110.31400000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="145.25400000000002" y="211.05" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">SUBMIT [hasStock]</text>
</g>
<g class="edge-label" data-from="reserved" data-to="cancelled" data-label="CANCEL">
  <rect x="59.373999999999995" y="349.1" width="60.418000000000006" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="89.583" y="364.25" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">CANCEL</text>
</g>
<g class="edge-label" data-from="reserved" data-to="paid" data-label="PAY [isPaid]">
  <rect x="162.82" y="349.1" width="76.456" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="201.048" y="364.25" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">PAY [isPaid]</text>
</g>
<g class="node" data-id="_start" data-label="" data-shape="state-start">
  <circle cx="145.597" cy="54" r="12" fill="var(--_text)" stroke="none" />
</g>
<g class="node" data-id="idle" data-label="idle" data-shape="rounded">
  <rect x="114.24800000000002" y="116" width="62.69799999999999" height="36.900000000000006" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="145.597" y="134.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">idle</text>
</g>
<g class="node" data-id="cancelled" data-label="cancelled" data-shape="rounded">
  <rect x="40" y="422.40000000000003" width="99.748" height="36.900000000000006" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="89.874" y="440.85" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">cancelled</text>
</g>
<g class="node" data-id="_end" data-label="" data-shape="state-end">
  <circle cx="89.874" cy="521.3" r="12" fill="none" stroke="var(--_text)" stroke-width="1.5" />
  <circle cx="89.874" cy="521.3" r="8" fill="var(--_text)" stroke="none" />
</g>
<g class="node" data-id="reserved" data-label="reserved" data-shape="rounded">
  <rect x="96.46400000000003" y="269.20000000000005" width="98.26599999999999" height="36.900000000000006" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="145.59700000000004" y="287.65000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">reserved</text>
</g>
<g class="node" data-id="paid" data-label="paid" data-shape="rounded">
  <rect x="167.748" y="422.40000000000003" width="67.14399999999999" height="36.900000000000006" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="201.32" y="440.85" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">paid</text>
</g>
<g class="node" data-id="_end2" data-label="" data-shape="state-end">
  <circle cx="201.32000000000002" cy="521.3" r="12" fill="none" stroke="var(--_text)" stroke-width="1.5" />
  <circle cx="201.32000000000002" cy="521.3" r="8" fill="var(--_text)" stroke="none" />
</g>
</svg>