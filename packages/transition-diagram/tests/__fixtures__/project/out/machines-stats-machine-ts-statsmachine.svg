<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 322.808 422.1" width="322.808" height="422.1" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="_start" data-to="reading" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="156.3415,68 156.3415,116" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="inspected" data-to="_end" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="89.874,306.1 89.874,354.1" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="reading" data-to="inspected" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="xstate.done.actor" points="141.69283333333334,152.9 141.69283333333334,188.9 89.874,188.9 89.874,269.20000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="reading" data-to="unreadable" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="xstate.error.actor" points="170.99016666666668,152.9 170.99016666666668,188.9 222.809,188.9 222.809,269.20000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="unreadable" data-to="_end2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="222.809,306.1 222.809,354.1" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="reading" data-to="inspected" data-label="xstate.done.actor">
  <rect x="39.873999999999995" y="195.9" width="99.62200000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="89.685" y="211.05" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">xstate.done.actor</text>
</g>
<g class="edge-label" data-from="reading" data-to="unreadable" data-label="xstate.error.actor">
  <rect x="171.809" y="195.9" width="101.99800000000003" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="222.80800000000002" y="211.05" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">xstate.error.actor</text>
</g>
<g class="node" data-id="_start" data-label="" data-shape="state-start">
  <circle cx="156.3415" cy="54" r="12" fill="var(--_text)" stroke="none" />
</g>
<g class="node" data-id="reading" data-label="reading" data-shape="rounded">
  <rect x="112.39550000000001" y="116" width="87.892" height="36.900000000000006" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="156.3415" y="134.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">reading</text>
</g>
<g class="node" data-id="inspected" data-label="inspected" data-shape="rounded">
  <rect x="40" y="269.20000000000005" width="99.748" height="36.900000000000006" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="89.874" y="287.65000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">inspected</text>
</g>
<g class="node" data-id="_end" data-label="" data-shape="state-end">
  <circle cx="89.874" cy="368.1" r="12" fill="none" stroke="var(--_text)" stroke-width="1.5" />
  <circle cx="89.874" cy="368.1" r="8" fill="var(--_text)" stroke="none" />
</g>
<g class="node" data-id="unreadable" data-label="unreadable" data-shape="rounded">
  <rect x="167.748" y="269.20000000000005" width="110.122" height="36.900000000000006" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="222.809" y="287.65000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">unreadable</text>
</g>
<g class="node" data-id="_end2" data-label="" data-shape="state-end">
  <circle cx="222.809" cy="368.1" r="12" fill="none" stroke="var(--_text)" stroke-width="1.5" />
  <circle cx="222.809" cy="368.1" r="8" fill="var(--_text)" stroke="none" />
</g>
</svg>