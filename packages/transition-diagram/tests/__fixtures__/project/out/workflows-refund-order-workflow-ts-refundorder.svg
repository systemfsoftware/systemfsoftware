  <rect x="501.476" y="104.9" width="129.388" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="566.17" y="123.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">RefundQueued</text>
</g>
<g class="node" data-id="e0_RefundRejected" data-label="RefundRejected" data-shape="rectangle">
  <rect x="501.476" y="169.8" width="135.31599999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
