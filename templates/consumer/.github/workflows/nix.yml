name: Nix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: nix-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  nix:
    name: nix
    permissions:
      contents: read
    uses: systemfsoftware/systemfsoftware/.github/workflows/reusable-nix.yml@02bf9653b1ca2b0a2951baf2743bb3f70d19fc77 # main
