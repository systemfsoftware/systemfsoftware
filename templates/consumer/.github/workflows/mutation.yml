name: Mutation

on:
  push:
    branches: [main]

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  mutation:
    name: mutation
    permissions:
      contents: read
      actions: write
