name: Commitlint

on:
  pull_request:
    branches: [main]

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: commitlint
    permissions:
      contents: read
    uses: systemfsoftware/systemfsoftware/.github/workflows/reusable-commitlint.yml@02bf9653b1ca2b0a2951baf2743bb3f70d19fc77 # main
