name: Commitlint

on:
  pull_request:
    branches: [main]

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: commitlint
    permissions:
      contents: read
    uses: systemfsoftware/systemfsoftware/.github/workflows/reusable-commitlint.yml@9d797f4c56f657af6d9782bd018f6a3c10acb984 # main
