name: Setup Node runtime
description: Install Node.js, enable Corepack

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - name: Enable Corepack
      shell: bash
      run: corepack enable
