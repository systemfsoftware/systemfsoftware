name: Install workspace dependencies
description: Set up Node + pnpm + Corepack, then run frozen-lockfile install

inputs:
  frozen-lockfile:
    description: Pass --frozen-lockfile to pnpm install
    required: false
    default: "true"
  working-directory:
    description: The pnpm workspace root, relative to the repository root
    required: false
    default: .

runs:
  using: composite
  steps:
    - uses: $/.github/actions/setup-node-runtime
      with:
        working-directory: ${{ inputs.working-directory }}
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FROZEN: ${{ inputs.frozen-lockfile }}
      run: |
        if [ "$FROZEN" = "true" ]; then
          corepack pnpm install --frozen-lockfile
        else
          corepack pnpm install
        fi
