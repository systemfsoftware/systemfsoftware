name: systemfsoftware checks lane
description: systemfsoftware's steps for each phase of reusable-checks.yml
inputs:
  lane:
    description: plan, static, rust, gritlint, test, test-after, timings or gate
    required: true
  job:
    description: The test job from the plan, as JSON
    required: false
    default: "{}"
  profile:
    description: Conformance profile, `local` or `per-change`
    required: false
    default: per-change
runs:
  using: composite
  steps:
    - uses: denoland/setup-deno@v2
      if: inputs.lane == 'plan' || inputs.lane == 'timings'
    - if: inputs.lane == 'plan'
      shell: bash
      run: corepack enable
    - name: The planner plans a foreign workspace
      if: inputs.lane == 'plan'
      shell: bash
      run: deno test --config=scripts/deno.jsonc --lock=scripts/deno.lock --frozen --allow-read --allow-write --allow-env --allow-run scripts/tools/test-timings.test.ts

    - name: Static lane environment
      if: inputs.lane == 'static'
      shell: bash
      run: printf 'CI=true\nOXLINT_FORMAT=github\nTSGO_FORMAT=github-actions\nTURBO_LOG_ORDER=stream\n' >> "$GITHUB_ENV"
    - uses: ./.github/actions/install-deps
      if: inputs.lane == 'static'
    - uses: cachix/install-nix-action@v31
      if: inputs.lane == 'static'
    - name: dprint from the flake
      if: inputs.lane == 'static'
      shell: bash
      run: echo "$(nix build --no-link --print-out-paths .#dprint)/bin" >> "$GITHUB_PATH"
    - uses: denoland/setup-deno@v2
      if: inputs.lane == 'static'
    - name: Turbo cache
      if: inputs.lane == 'static'
      uses: actions/cache@v6
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-checks-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-checks-
          turbo-${{ runner.os }}-
    - name: Fetch the declared upstream family refs
      if: inputs.lane == 'static'
      shell: bash
      run: |
        command -v jq >/dev/null || { echo "jq is required to read upstream-family.json source refs" >&2; exit 1; }
        refs="$(git ls-files | grep -E '(^|/)upstream-family.json$' | grep -v '^repos/' | xargs -r -n1 jq -r '.source.ref' | sort -u)"
        while IFS= read -r ref; do
          if [ -n "$ref" ]; then
            git fetch --no-tags --depth=1 origin "$ref"
          fi
        done <<< "$refs"

    - name: Rust lane environment
      if: inputs.lane == 'rust'
      shell: bash
      run: printf 'CARGO_NET_GIT_FETCH_WITH_CLI=true\nCARGO_INCREMENTAL=0\n' >> "$GITHUB_ENV"
    - uses: cachix/install-nix-action@v31
      if: inputs.lane == 'rust' || inputs.lane == 'gritlint'
    - name: Cargo cache
      id: cargo-cache
      if: inputs.lane == 'rust'
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'flake.lock') }}
        restore-keys: cargo-${{ runner.os }}-
    - name: Rust gate
      if: inputs.lane == 'rust'
      shell: bash
      run: nix develop --command sh scripts/tools/gate-rust.sh
    # Only main saves: a pull request's cache is visible to that pull request alone, and each
    # ~1.5 GB copy pushed main's out of the repository's 10 GB cache budget.
    - name: Save the cargo cache
      if: inputs.lane == 'rust' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

    # The sandboxed binary's store path hashes every input of its build, so a hit is exact.
    - name: Sandboxed gritlint store path
      id: closure
      if: inputs.lane == 'gritlint'
      shell: bash
      run: |
        out="$(nix eval --raw .#gritlint.outPath)"
        echo "out=$out" >> "$GITHUB_OUTPUT"
        echo "key=gritlint-closure-${out#/nix/store/}" >> "$GITHUB_OUTPUT"
    - name: gritlint closure cache
      id: closure-cache
      if: inputs.lane == 'gritlint'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/gritlint-closure
        key: ${{ steps.closure.outputs.key }}
    - name: Load the cached closure
      if: inputs.lane == 'gritlint' && steps.closure-cache.outputs.cache-hit == 'true'
      shell: bash
      env:
        OUT: ${{ steps.closure.outputs.out }}
      run: nix copy --no-check-sigs --from "file://$RUNNER_TEMP/gritlint-closure" "$OUT"
    - name: Build the sandboxed gritlint and export its closure
      if: inputs.lane == 'gritlint' && steps.closure-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        OUT: ${{ steps.closure.outputs.out }}
      run: |
        built="$(nix build --no-link --print-out-paths .#gritlint)"
        test "$built" = "$OUT" || { echo "built $built, evaluated $OUT" >&2; exit 1; }
        nix copy --to "file://$RUNNER_TEMP/gritlint-closure?compression=zstd" "$OUT"
    - name: Save the closure cache
      if: inputs.lane == 'gritlint' && steps.closure-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/gritlint-closure
        key: ${{ steps.closure.outputs.key }}
    - name: Let bwrap create user namespaces (ubuntu-24.04 AppArmor refuses them by default)
      if: inputs.lane == 'gritlint'
      shell: bash
      run: |
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
    - name: Sandboxed check fails on a planted violation and passes once fixed
      if: inputs.lane == 'gritlint'
      shell: bash
      env:
        OUT: ${{ steps.closure.outputs.out }}
      run: |
        bin="$OUT/bin/gritlint"
        fixture="$RUNNER_TEMP/gritlint-fixture"
        mkdir -p "$fixture/packages/app"
        cd "$fixture"
        printf '{"packs": {"typecheck-build-mode": {}}}\n' > gritlint.json
        printf '{"files": [], "references": [{"path": "./tsconfig.app.json"}]}\n' > packages/app/tsconfig.json
        printf '{"name": "app", "scripts": {"typecheck": "tsc --noEmit"}}\n' > packages/app/package.json
        status=0
        "$bin" check || status=$?
        test "$status" -eq 1 || { echo "a planted violation must exit 1, got $status" >&2; exit 1; }
        printf '{"name": "app", "scripts": {"typecheck": "tsc -b"}}\n' > packages/app/package.json
        "$bin" check
    - name: This repository's conventions
      if: inputs.lane == 'gritlint'
      shell: bash
      run: ./bin/gritlint check

    - name: Test lane environment
      if: inputs.lane == 'test'
      shell: bash
      run: printf 'CI=true\n' >> "$GITHUB_ENV"
    - name: Select the pr lane
      if: inputs.lane == 'test' && inputs.profile == 'local'
      shell: bash
      run: printf 'CONFORMANCE_PROFILE=local\nVITEST_LANE=pr\n' >> "$GITHUB_ENV"
    - uses: ./.github/actions/install-deps
      if: inputs.lane == 'test'
    - uses: ./.github/actions/grant-kvm
      if: inputs.lane == 'test'
    - uses: cachix/install-nix-action@v31
      if: inputs.lane == 'test'
    - uses: denoland/setup-deno@v2
      if: inputs.lane == 'test'
    - name: Turbo cache
      if: inputs.lane == 'test'
      uses: actions/cache@v6
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-test-${{ fromJSON(inputs.job).id }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-test-${{ fromJSON(inputs.job).id }}-
          turbo-${{ runner.os }}-checks-
          turbo-${{ runner.os }}-
    - name: Cache Playwright browsers
      if: inputs.lane == 'test' && fromJSON(inputs.job).browser
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-
    - name: Install Playwright chromium
      if: inputs.lane == 'test' && fromJSON(inputs.job).browser
      shell: bash
      run: corepack pnpm --filter @systemfsoftware/effect-atom-react exec playwright install chromium
    - name: Build
      if: inputs.lane == 'test'
      shell: bash
      env:
        FILTERS: ${{ fromJSON(inputs.job).filters }}
      run: corepack pnpm exec turbo run build --output-logs=errors-only --log-order=stream $FILTERS
