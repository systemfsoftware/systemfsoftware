name: systemfsoftware tools
description: >-
  Check out systemfsoftware's scripts/ at the calling reusable workflow's own commit and put its Deno tools on PATH as
  `test-timings`, `mutation-job` and `classify-diff`
inputs:
  repository:
    description: The reusable workflow's repository; pass `job.workflow_repository`
    required: true
  ref:
    description: The reusable workflow's commit; pass `job.workflow_sha`
    required: true
runs:
  using: composite
  steps:
    - name: The workflow's repository and commit are known
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        REF: ${{ inputs.ref }}
      run: |
        if [ -z "$REPOSITORY" ] || [ -z "$REF" ]; then
          mkdir -p "$RUNNER_TEMP/sfs-logs"
          [ -s "$RUNNER_TEMP/sfs-reason" ] || echo tools-ref-missing > "$RUNNER_TEMP/sfs-reason"
          echo "::error title=tools-ref-missing::sfs-tools needs the reusable workflow's repository and commit (got repository='$REPOSITORY' ref='$REF'); pass job.workflow_repository and job.workflow_sha"
          exit 1
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        path: .sfs-tools
        sparse-checkout: scripts
        persist-credentials: false
    - uses: denoland/setup-deno@v2
    - name: Tools on PATH
      shell: bash
      run: |
        scripts="$GITHUB_WORKSPACE/.sfs-tools/scripts"
        bin="$RUNNER_TEMP/sfs-tools/bin"
        mkdir -p "$bin"
        tool() {
          printf '#!/usr/bin/env bash\nexec deno run --config=%s/deno.jsonc --lock=%s/deno.lock --frozen %s %s/tools/%s "$@"\n' \
            "$scripts" "$scripts" "$2" "$scripts" "$3" > "$bin/$1"
          chmod +x "$bin/$1"
        }
        tool test-timings '--allow-read --allow-write --allow-env --allow-run=pnpm' test-timings.ts
        tool mutation-job '--allow-read --allow-write --allow-env --allow-run=timeout' mutation-job.ts
        tool classify-diff '--allow-read --allow-env --allow-run=git' classify-diff.ts
        echo "$bin" >> "$GITHUB_PATH"
