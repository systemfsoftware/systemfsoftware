version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "automerge"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase
    open-pull-requests-limit: 20
    exclude-paths:
      - "repos/**"

    groups:
      oxlint-minor-patch:
        patterns:
          - "oxlint"
          - "@oxlint/*"
        update-types: ["minor", "patch"]

      oxlint-major:
        patterns:
          - "oxlint"
          - "@oxlint/*"
        update-types: ["major"]

      effect-minor-patch:
        patterns:
          - "@effect/*"
          - "effect"
        update-types: ["minor", "patch"]

      effect-major:
        patterns:
          - "@effect/*"
          - "effect"
        update-types: ["major"]

      turborepo-minor-patch:
        patterns:
          - "turbo"
        update-types: ["minor", "patch"]

      testing-minor-patch:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@stryker-mutator/*"
          - "stryker"
          - "mocha"
        update-types: ["minor", "patch"]

      testing-major:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@stryker-mutator/*"
          - "stryker"
          - "mocha"
        update-types: ["major"]

      commitlint-minor-patch:
        patterns:
          - "@commitlint/*"
        update-types: ["minor", "patch"]

      typescript-minor-patch:
        patterns:
          - "typescript"
        update-types: ["minor", "patch"]

      other-minor-patch:
        patterns: ["*"]
        exclude-patterns:
          - "oxlint"
          - "@oxlint/*"
          - "@effect/*"
          - "effect"
          - "turbo"
          - "vitest"
          - "@vitest/*"
          - "@stryker-mutator/*"
          - "stryker"
          - "mocha"
          - "@commitlint/*"
          - "typescript"
        update-types: ["minor", "patch"]

      major-updates:
        patterns: ["*"]
        exclude-patterns:
          - "oxlint"
          - "@oxlint/*"
          - "@effect/*"
          - "effect"
          - "turbo"
          - "vitest"
          - "@vitest/*"
          - "@stryker-mutator/*"
          - "stryker"
          - "mocha"
          - "@commitlint/*"
          - "typescript"
        update-types: ["major"]
