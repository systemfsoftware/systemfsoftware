# The org's one Dependabot configuration (public-repo standard, item 5). Only the ecosystems and the extra
# major-version ignores differ by repository. The 3-day cooldown matches pnpm's minimumReleaseAge; vendored
# subtrees under repos/ are never updated in place; @systemfsoftware/* moves with the flake input.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    exclude-paths:
      - "repos/**"
    labels:
      - "automerge"
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    exclude-paths:
      - "repos/**"
    versioning-strategy: "increase"
    open-pull-requests-limit: 20
    ignore:
      - dependency-name: "@systemfsoftware/*"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      oxlint-minor-patch:
        patterns:
          - "oxlint"
          - "@oxlint/*"
        update-types: ["minor", "patch"]
      oxlint-major:
        patterns:
          - "oxlint"
          - "@oxlint/*"
        update-types: ["major"]
      effect-minor-patch:
        patterns:
          - "@effect/*"
          - "effect"
        update-types: ["minor", "patch"]
      effect-major:
        patterns:
          - "@effect/*"
          - "effect"
        update-types: ["major"]
      turborepo-minor-patch:
        patterns:
          - "turbo"
        update-types: ["minor", "patch"]
      testing-minor-patch:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types: ["minor", "patch"]
      testing-major:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types: ["major"]
      commitlint-minor-patch:
        patterns:
          - "@commitlint/*"
        update-types: ["minor", "patch"]
      typescript-minor-patch:
        patterns:
          - "typescript"
        update-types: ["minor", "patch"]
      types-node-minor-patch:
        patterns:
          - "@types/node"
        update-types: ["minor", "patch"]
      other-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "oxlint"
          - "@oxlint/*"
          - "@effect/*"
          - "effect"
          - "@commitlint/*"
          - "typescript"
          - "@types/node"
        update-types: ["minor", "patch"]
      major-updates:
        patterns:
          - "*"
        exclude-patterns:
          - "oxlint"
          - "@oxlint/*"
          - "@commitlint/*"
          - "typescript"
          - "@types/node"
        update-types: ["major"]

  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    exclude-paths:
      - "repos/**"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Vendored subtrees are updated by subtree pulls only. A security update ignores `exclude-paths`, so the vendored
  # lockfiles also get an ecosystem entry that ignores every dependency.
  - package-ecosystem: "npm"
    directories:
      - "/repos/alchemy"
      - "/repos/effect"
      - "/repos/ttsc"
      - "/repos/typia"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
