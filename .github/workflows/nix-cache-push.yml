name: Nix cache push

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NIX_CACHE_URL: https://nix.systemfsoftware.com
  NIX_CACHE_PUBLIC_KEY: nix-cache-1:wXA8I4DayNW9q6enUyQA/P/nT38pGSTLt374t3gsn7M=
  PUSH_SET: >-
    conformance-spec
    differential-spec
    effect-cell-types
    effect-gherkin-spec
    effect-schema-discovery
    effect-schema-law
    effect-schema-recursion-budget
    effect-schema-vite
    effect-sim-kernel
    effect-spec-runtime
    oxlint-config-cell-architecture
    oxlint-config-dmmf
    oxlint-config-recommended
    oxlint-config-rule-authoring
    oxlint-plugin-cell-architecture
    oxlint-plugin-dmmf-workflow
    oxlint-plugin-effect-platform
    oxlint-plugin-effect-schema
    oxlint-plugin-test-discipline
    stryker-config
    tsconfig
    tsdown-config
    vitest
    vitest-config
    dprint
    workspace-tarballs
    test-timings
    bun
    gritlint
    comment-checker
    comment-checker-unwrapped
    pnpm-store
    mitmCache

jobs:
  push:
    name: push · ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: nix-cache-push
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.NIX_CACHE_URL }}
            extra-trusted-public-keys = ${{ env.NIX_CACHE_PUBLIC_KEY }}
            fallback = true

      - name: The signing key is the cache's key
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          : "${NIX_CACHE_SIGNING_KEY:?NIX_CACHE_SIGNING_KEY is not set}"
          umask 077
          printf '%s' "$NIX_CACHE_SIGNING_KEY" > "$RUNNER_TEMP/signing-key"
          derived=$(nix --extra-experimental-features nix-command key convert-secret-to-public < "$RUNNER_TEMP/signing-key")
          if [ "$derived" != "$NIX_CACHE_PUBLIC_KEY" ]; then
            echo "::error title=nix-cache-key::NIX_CACHE_SIGNING_KEY does not derive the cache's public key; nothing was pushed"
            exit 1
          fi

      - name: Build the push set
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          read -ra attrs <<< "$PUSH_SET"
          : > "$RUNNER_TEMP/out-paths"
          : > "$RUNNER_TEMP/build-failures"
          for attr in "${attrs[@]}"; do
            if out=$(nix build --no-link --print-out-paths -L ".#packages.${SYSTEM}.${attr}"); then
              printf '%s\n' "$out" >> "$RUNNER_TEMP/out-paths"
            else
              echo "packages.${SYSTEM}.${attr}" >> "$RUNNER_TEMP/build-failures"
              echo "::error title=nix-build-failed::packages.${SYSTEM}.${attr} did not build"
            fi
          done

      - name: Push the closures
        env:
          NIX_CACHE_PUSH_TOKEN: ${{ secrets.NIX_CACHE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          : "${NIX_CACHE_PUSH_TOKEN:?NIX_CACHE_PUSH_TOKEN is not set}"
          store="${NIX_CACHE_URL/\/\//\/\/nix-cache:${NIX_CACHE_PUSH_TOKEN}@}?secret-key=${RUNNER_TEMP}/signing-key&want-mass-query=true&compression=zstd"
          mapfile -t outs < "$RUNNER_TEMP/out-paths"
          if [ "${#outs[@]}" -eq 0 ]; then
            echo "::error title=nix-cache-push::no package built, so nothing was pushed"
            exit 1
          fi
          failed=0
          if ! nix copy --to "$store" "${outs[@]}" 2> "$RUNNER_TEMP/copy.err"; then
            # One path can stop the bulk copy: a compressed NAR over the Worker's
            # 100 MB request cap is refused with 413, and every path that refers
            # to it is refused after it. Push path by path, references first, so
            # each refused path is reported by name.
            echo "::warning title=nix-cache-push::the bulk copy failed; pushing path by path"
            closure=$(nix-store --query --requisites "${outs[@]}")
            while read -r path; do
              if ! nix copy --no-recursive --to "$store" "$path" 2> "$RUNNER_TEMP/copy.err"; then
                failed=1
                if grep -q 'HTTP error 413' "$RUNNER_TEMP/copy.err"; then
                  reason="HTTP 413, the compressed NAR is over the cache's 100 MB request cap"
                else
                  reason=$(sed -n -e 's|://[^/@]*@|://|g' -e '/error: ./{s/^[[:space:]]*//;p;q}' "$RUNNER_TEMP/copy.err" | cut -c1-300)
                  reason=${reason:-nix copy failed}
                fi
                echo "::error title=nix-cache-push::${path} was not pushed: ${reason}"
                echo "- \`${path}\`: ${reason}" >> "$GITHUB_STEP_SUMMARY"
              fi
            done <<< "$closure"
          fi
          if [ -s "$RUNNER_TEMP/build-failures" ]; then
            failed=1
            {
              echo "These packages did not build, so they were not pushed:"
              sed 's/^/- /' "$RUNNER_TEMP/build-failures"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$failed"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing-key" "$RUNNER_TEMP/copy.err"
