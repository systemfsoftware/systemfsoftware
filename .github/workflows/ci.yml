name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conflicts:
    name: no merge conflicts
    uses: ./.github/workflows/conflict-check.yml
    with:
      base_ref: ${{ github.event.pull_request.base.ref }}
      head_sha: ${{ github.event.pull_request.head.sha }}
  abort-on-conflict:
    name: abort on mid-run merge conflict
    needs: conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 46
    permissions:
      contents: read
      actions: write
    steps:
      # A plan ships in the same PR as the code it plans. This job is already a required check.
      - name: Not a plan-only pull request
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
          if [ -n "$files" ] && ! grep -qvE '(^|/)docs/plans/|-plan\.md$' <<< "$files"; then
            printf '::error title=plan-only PR::This PR changes only plan documents. A plan ships in the same PR as the code it plans (owner, 2026-10-28).\n'
            exit 1
          fi
      - name: Watch for the PR turning dirty
        if: github.event.pull_request.head.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          while true; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .mergeable_state)
            if [ "$state" = "dirty" ]; then
              printf '::error title=merge conflicts::This branch conflicted with the base while the run was in progress. Cancelling the run.\n'
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/cancel" >/dev/null 2>&1 || true
              exit 1
            fi
            active=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
              --jq '[.jobs[] | select(.status != "completed")] | length')
            if [ "$active" -le 1 ]; then
              echo "no other jobs running; watcher done"
              exit 0
            fi
            sleep 60
          done
  checks:
    name: build · lint · typecheck · test
    needs: conflicts
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-checks.yml
    with:
      profile: ${{ github.event_name == 'pull_request' && 'local' || 'per-change' }}
      record: test-timings-${{ github.event_name == 'pull_request' && 'local' || 'per-change' }}
      timings: deno run --config=scripts/deno.jsonc --lock=scripts/deno.lock --allow-read --allow-write --allow-env --allow-run=pnpm scripts/tools/test-timings.ts
      node-options: --max-old-space-size=4096
      pnpm: corepack pnpm
      test-flags: --output-logs=new-only --log-order=stream --log-prefix=none
      gate-name: the gate (pnpm check:ci)
      lanes: >-
        [{"id": "static", "name": "static checks (pnpm check:static)", "timeout-minutes": 45, "fetch-depth": 2, "node-options": "--max-old-space-size=4096", "run": "corepack pnpm check:static",
          "docs-run": "./bin/dprint check"},
        {"id": "gritlint", "name": "gritlint · sandboxed journey, pnpm lint:conventions", "timeout-minutes": 30},
        {"id": "layers", "name": "package layers (pnpm gate:layers)", "timeout-minutes": 15, "run": "corepack pnpm gate:layers"}]
  scope:
    name: classify · docs-only or full
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.diff.outputs.scope }}
    steps:
      - id: diff
        uses: $/.github/actions/classify-diff
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
  smoke:
    name: smoke · effect-microsandbox journeys (real microVM)
    needs: [conflicts, scope]
    if: needs.scope.outputs.scope != 'docs-only'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/install-deps
      - uses: ./.github/actions/grant-kvm
      - name: Smoke journeys
        run: |
          corepack pnpm --filter @systemfsoftware/effect-microsandbox smoke 2>&1 | tee /tmp/effect-microsandbox-smoke.log
          grep -q 'all journeys green' /tmp/effect-microsandbox-smoke.log
