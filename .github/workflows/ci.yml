name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
# Every commit on main gets its own run and verdict: grouping main by SHA keeps a newer push from cancelling it. On any
# other ref a newer push cancels the superseded run.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  conflicts:
    name: no merge conflicts
    uses: ./.github/workflows/conflict-check.yml
    with:
      base_ref: ${{ github.event.pull_request.base.ref }}
      head_sha: ${{ github.event.pull_request.head.sha }}
  plan-only:
    # A plan ships in the same PR as the code it plans (owner, 2026-10-28). Required at queue time in .mergify.yml.
    name: not a plan-only pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Not a plan-only pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
          if [ -n "$files" ] && ! grep -qvE '(^|/)docs/plans/|-plan\.md$' <<< "$files"; then
            printf '::error title=plan-only PR::This PR changes only plan documents. A plan ships in the same PR as the code it plans (owner, 2026-10-28).\n'
            exit 1
          fi
  abort-on-conflict:
    name: abort on mid-run merge conflict
    needs: conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 46
    permissions:
      contents: read
      actions: write
    steps:
      - name: Watch for the PR turning dirty
        if: github.event.pull_request.head.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          while true; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .mergeable_state)
            if [ "$state" = "dirty" ]; then
              printf '::error title=merge conflicts::This branch conflicted with the base while the run was in progress. Cancelling the run.\n'
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/cancel" >/dev/null 2>&1 || true
              exit 1
            fi
            active=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
              --jq '[.jobs[] | select(.status != "completed")] | length')
            if [ "$active" -le 1 ]; then
              echo "no other jobs running; watcher done"
              exit 0
            fi
            sleep 60
          done
  checks:
    name: build · lint · typecheck · test
    # Fast checks before the merge, heavy suites after it (owner, 2026-10-29: "They need to be fast with the heavier
    # checks on main"). A pull request and a merge-queue draft run the static, gritlint and layers lanes and the
    # `affected` lane (.github/ci/pr-tests.ts), and their plan schedules no packed test job
    # (.github/ci/no-tests-before-merge.ts). Main runs every package's whole suite in the packed test jobs.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-checks.yml
    with:
      profile: ${{ github.ref == 'refs/heads/main' && 'per-change' || 'local' }}
      record: test-timings-${{ github.ref == 'refs/heads/main' && 'per-change' || 'local' }}
      timings: >-
        ${{ github.ref == 'refs/heads/main'
        && 'deno run --config=scripts/deno.jsonc --lock=scripts/deno.lock --allow-read --allow-write --allow-env --allow-run=pnpm scripts/tools/test-timings.ts'
        || 'deno run --config=scripts/deno.jsonc --lock=scripts/deno.lock --allow-env --allow-write .github/ci/no-tests-before-merge.ts' }}
      node-options: --max-old-space-size=4096
      pnpm: corepack pnpm
      test-flags: --output-logs=new-only --log-order=stream --log-prefix=none
      gate-name: the gate (pnpm check:ci)
      lanes: >-
        ${{ github.ref == 'refs/heads/main'
        && '[{"id": "static", "name": "static checks (pnpm check:static)", "timeout-minutes": 45, "fetch-depth": 2, "node-options": "--max-old-space-size=4096", "run": "corepack pnpm check:static", "docs-run": "./bin/dprint check"}, {"id": "gritlint", "name": "gritlint · sandboxed journey, pnpm lint:conventions", "timeout-minutes": 30}, {"id": "layers", "name": "package layers (pnpm gate:layers)", "timeout-minutes": 15, "run": "corepack pnpm gate:layers"}]'
        || '[{"id": "static", "name": "static checks (pnpm check:static)", "timeout-minutes": 45, "fetch-depth": 2, "node-options": "--max-old-space-size=4096", "run": "corepack pnpm check:static", "docs-run": "./bin/dprint check"}, {"id": "gritlint", "name": "gritlint · sandboxed journey, pnpm lint:conventions", "timeout-minutes": 30}, {"id": "layers", "name": "package layers (pnpm gate:layers)", "timeout-minutes": 15, "run": "corepack pnpm gate:layers"}, {"id": "affected", "name": "affected tests (turbo --affected, vitest --changed)", "timeout-minutes": 30, "fetch-depth": 2, "node-options": "--max-old-space-size=4096"}]' }}
