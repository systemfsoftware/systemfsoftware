name: Registry gate

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  gate:
    name: registry gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      outcome: ${{ steps.gate.outputs.outcome }}
    env:
      HUSKY: "0"
    steps:
      - name: Refuse fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "The registry gate runs on same-repository pull requests and on workflow_dispatch only."
          echo "Fork pull requests get no OIDC token and no credential."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-deps
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - id: gate
        name: Publish, mint, install, record, delete
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOPPLER_IDENTITY_ID: ${{ vars.DOPPLER_IDENTITY_ID }}
        run: bun --conditions=@systemfsoftware/source tooling/registry-gate/bin/registry-gate.ts
