name: Registry gate

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  gate:
    name: registry gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      outcome: ${{ steps.gate.outputs.outcome }}
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-deps
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - id: gate
        name: Publish, mint, install, record, delete
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: bun --conditions=@systemfsoftware/source tooling/registry-gate/bin/registry-gate.ts
