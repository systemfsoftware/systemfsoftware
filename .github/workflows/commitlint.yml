name: Commitlint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conflicts:
    name: no merge conflicts
    uses: ./.github/workflows/conflict-check.yml
    with:
      base_ref: ${{ github.event.pull_request.base.ref }}
      head_sha: ${{ github.event.pull_request.head.sha }}
  commitlint:
    needs: conflicts
    # Dependabot PRs are machine-generated update commits (deterministic
    # subjects, often long); linting them produces unstoppable red checks that
    # stall the automerge flow. The conflict check above still guards them.
    if: github.actor != 'dependabot[bot]'
    name: lint PR commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-deps
      - run: corepack pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
