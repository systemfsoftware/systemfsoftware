name: Commitlint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conflicts:
    name: no merge conflicts
    uses: ./.github/workflows/conflict-check.yml
    with:
      base_ref: ${{ github.event.pull_request.base.ref }}
      head_sha: ${{ github.event.pull_request.head.sha }}

  commitlint:
    name: commitlint
    needs: conflicts
    uses: ./.github/workflows/reusable-commitlint.yml
