name: Commitlint (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: The pnpm workspace root that holds the commitlint config and `@commitlint/cli`, relative to the repository root
        required: false
        type: string
        default: .
      runs-on:
        description: JSON label list for the job
        required: false
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      sfs-fetch-token:
        description: GitHub token Nix fetches `github:` flake inputs with in the dev-shell step, for inputs in private repositories; unset keeps the job's GITHUB_TOKEN
        required: false

permissions:
  contents: read

jobs:
  commitlint:
    name: lint PR commits
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # The job lays a consumer's `.deps/` through `nix develop` before it installs; on a cold runner a large dev
    # shell's substitution alone outlasts five minutes (npm-package#8 and effect-microvm#9 were cancelled mid-download).
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: ${{ inputs.working-directory != '.' && format('/{0}/', inputs.working-directory) || '' }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: devshell
        uses: $/.github/actions/consumer-devshell
        with:
          working-directory: ${{ inputs.working-directory }}
          sfs-fetch-token: ${{ secrets.sfs-fetch-token }}
      - id: install
        uses: $/.github/actions/install-deps
        with:
          working-directory: ${{ inputs.working-directory }}
      - id: commitlint
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/sfs-logs"
          set -o pipefail
          corepack pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose 2>&1 | tee "$RUNNER_TEMP/sfs-logs/commitlint.log"
      - if: failure()
        uses: $/.github/actions/failure-summary
        with:
          job: commitlint
          reasons: |
            devshell devshell-failed
            install install-failed
            commitlint commit-message-invalid
          steps: ${{ toJSON(steps) }}
          reproduce: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
          working-directory: ${{ inputs.working-directory }}
