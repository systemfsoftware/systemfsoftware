name: Commitlint (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: >-
          The checkout directory that holds the consumer's commitlint config, relative to the repository root. The CLI
          and the packages the config may extend come from the pinned toolchain, not from this directory
        required: false
        type: string
        default: .
      runs-on:
        description: JSON label list for the job
        required: false
        type: string
        default: '["ubuntu-latest"]'
      backstop-minutes:
        description: >-
          The one stuck-job backstop, applied to this workflow's job. It is not a budget: budgets are measured and
          reported by the `wall-clock` step, never enforced. Keep it at 60 or above
        required: false
        type: number
        default: 60

jobs:
  commitlint:
    name: lint PR commits
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.backstop-minutes }}
    permissions:
      contents: read
    steps:
      - id: record
        uses: $/.github/actions/job-record
        with:
          phase: start
          reusable: commitlint
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: ${{ inputs.working-directory != '.' && format('/{0}/', inputs.working-directory) || '' }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: commitlint
        uses: $/.github/actions/commitlint
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          working-directory: ${{ inputs.working-directory }}
          from: ${{ github.event.pull_request.base.sha }}
          to: ${{ github.event.pull_request.head.sha }}
      - if: failure()
        uses: $/.github/actions/failure-summary
        with:
          job: commitlint
          reasons: |
            commitlint commit-message-invalid
          steps: ${{ toJSON(steps) }}
          reproduce: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
          working-directory: ${{ inputs.working-directory }}
      - if: always()
        uses: $/.github/actions/job-record
        with:
          phase: finish
          call: ${{ steps.record.outputs.call }}
          job: commitlint
          name: lint PR commits
          status: ${{ job.status }}
      - if: always()
        run: wall-clock --records "$RUNNER_TEMP/sfs-job-records" --attempt "$GITHUB_RUN_ATTEMPT" --event "$GITHUB_EVENT_NAME" --scope full
