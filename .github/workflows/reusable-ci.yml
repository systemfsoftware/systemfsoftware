name: CI (reusable)

# One job per pull request. A pull request runs the repository's fast command; a Mergify queue
# draft (head ref `mergify/merge-queue/*`) and a push to main run its full command. The squash-message lint and the
# changeset-intent check are steps of the same job, so a pull request pays the runner and Nix setup once. A pull
# request that changes only documentation starts no Nix and still lints its squash message. A newer push to a pull request cancels its older run; main
# and the queue drafts never cancel.
on:
  workflow_call:
    inputs:
      install:
        description: Command that installs the workspace, run inside the dev shell
        required: false
        type: string
        default: pnpm install --frozen-lockfile
      fast:
        description: Command a pull request runs, inside the dev shell
        required: true
        type: string
      full:
        description: Command a Mergify queue draft and a push to main run, inside the dev shell
        required: true
        type: string
      commitlint:
        description: Lint the squash message in this job; the repository must carry `@commitlint/cli` and its config
        required: true
        type: boolean
      changeset:
        description: Require a change intent for every publishable-package change, checked with a pinned release of the change-intent tool
        required: true
        type: boolean
      shell:
        description: Flake reference whose dev shell runs the commands
        required: false
        type: string
        default: .
      timeout-minutes:
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  check:
    name: check
    # The repository's own visibility picks the runner and no caller can choose: a public repository always runs on a
    # GitHub-hosted runner, because a fork pull request would run its code on a self-hosted one; a private repository
    # runs on the self-hosted CI runners, which already carry Nix.
    runs-on: ${{ github.event.repository.private && ((github.event_name == 'pull_request' && startsWith(github.head_ref, 'mergify/merge-queue/')) && fromJSON('["self-hosted", "merge-queue", "large"]') || (github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "main-ci", "large"]')) || fromJSON('["self-hosted", "systemfsoftware-runner", "medium"]')) || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/') }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A blobless clone only on a hosted runner: the filter persists on a self-hosted runner (actions/checkout#2601).
          filter: ${{ !github.event.repository.private && 'blob:none' || '' }}
          persist-credentials: false
      - id: scope
        name: Classify the change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/') }}
        run: |
          docs=false
          if [ "$PULL_REQUEST" = true ] && ! git diff --name-only "$BASE" "$HEAD" | grep -qvE '(^docs/|\.md$)'; then
            docs=true
          fi
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
      # A documentation-only pull request still lints its squash message, which lands on main whatever the diff is, with
      # the repository's own commitlint config and without Nix: only the root package's dependencies are installed.
      - if: steps.scope.outputs.docs == 'true' && inputs.commitlint && github.actor != 'dependabot[bot]'
        uses: pnpm/action-setup@v6
      - if: steps.scope.outputs.docs == 'true' && inputs.commitlint && github.actor != 'dependabot[bot]'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: steps.scope.outputs.docs == 'true' && inputs.commitlint && github.actor != 'dependabot[bot]'
        name: Lint the squash message
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pnpm install --frozen-lockfile --filter . --ignore-scripts
          pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose
      - if: steps.scope.outputs.docs != 'true' && !github.event.repository.private
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix.systemfsoftware.com
            extra-trusted-public-keys = nix-cache-1:wXA8I4DayNW9q6enUyQA/P/nT38pGSTLt374t3gsn7M=
      - if: steps.scope.outputs.docs != 'true'
        name: Install, lint the squash message, check the change intent, then run the checks
        env:
          SHELL_REF: ${{ inputs.shell }}
          INSTALL: ${{ inputs.install }}
          COMMAND: ${{ (github.event_name != 'pull_request' || startsWith(github.head_ref, 'mergify/merge-queue/')) && inputs.full || inputs.fast }}
          LINT_COMMITS: ${{ inputs.commitlint && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/') && github.actor != 'dependabot[bot]' }}
          CHECK_INTENT: ${{ inputs.changeset && github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The change-intent tool is one pinned release for every repository, not whatever each dev shell carries.
          if [ "$CHECK_INTENT" = true ]; then
            nix run "github:systemfsoftware/pnpm-release-management/ae663466c157a8e5b612c78091e17ddd32a030e0#changeset-management" -- check "$BASE"
          fi
          nix develop "$SHELL_REF" --command bash -euo pipefail -c '
            eval "$INSTALL"
            if [ "$LINT_COMMITS" = true ]; then
              pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose
            fi
            eval "$COMMAND"
          '
