name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: release · shared tooling
    uses: systemfsoftware/pnpm-release-management/.github/workflows/release.yml@prm/toolchain
    with:
      tools-ref: prm/toolchain
    permissions:
      contents: write
      pull-requests: write
