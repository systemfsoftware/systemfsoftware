name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: release · shared tooling
    uses: systemfsoftware/pnpm-release-management/.github/workflows/release.yml@ae663466c157a8e5b612c78091e17ddd32a030e0
    with:
      ci-workflow: ci.yml
    permissions:
      contents: write
      pull-requests: write
      actions: write
