name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: release · shared tooling
    uses: systemfsoftware/pnpm-release-management/.github/workflows/release.yml@1e897828d917341fb7dd444c7bbd6cfa0998caa9
    with:
      ci-workflow: ci.yml
      npm-publish: true
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
