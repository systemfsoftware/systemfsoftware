name: Release

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    if: github.event_name == 'push'
    name: version · open release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-deps
      - name: Consume pending change intents
        run: corepack pnpm version -r
      - name: Open or update the Release PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: changeset-release/main
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -z "$(git status --porcelain)" ]; then
            echo "no pending change intents — nothing to release"
            if [ -n "$existing" ]; then
              gh pr close "$existing" --delete-branch --comment "No pending change intents remain."
            fi
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --force-create "$BRANCH"
          git add -A
          git commit -m 'chore(release): version packages'
          git push --force origin "$BRANCH"

          cat > /tmp/release-pr-body.md <<'BODY'
          Consumes pending `.changeset/` intents via `pnpm version -r`.

          Merging runs the gate, then builds, publishes (OIDC + provenance),
          and tags the changed packages.

          Review every consumed `none` intent before merging — a `none` on a
          behavior-visible change is a silent non-release.

          Packages not registered as npm trusted publishers fail at publish
          with an OIDC auth error; register them at https://www.npmjs.com.
          BODY

          gh label create release \
            --color 0E8A16 \
            --description 'Automated version-packages release PR' \
            --force

          if [ -n "$existing" ]; then
            gh pr edit "$existing" \
              --title 'chore(release): version packages' \
              --body-file /tmp/release-pr-body.md \
              --add-label release
          else
            gh pr create \
              --base "$BASE" \
              --head "$BRANCH" \
              --title 'chore(release): version packages' \
              --body-file /tmp/release-pr-body.md \
              --label release
          fi

  gate:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'changeset-release/main'
      && github.event.pull_request.user.login == 'github-actions[bot]'
    name: the gate (pnpm check:ci)
    uses: ./.github/workflows/reusable-checks.yml

  publish:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'changeset-release/main'
      && github.event.pull_request.user.login == 'github-actions[bot]'
    permissions:
      contents: write
      id-token: write
    name: publish · oidc · tag
    needs: [gate]
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-deps
      - uses: denoland/setup-deno@v2
      - name: Build
        # Necessary: every package publishes files: ["dist"] against a gitignored
        # dist/ and none carries a prepack hook, so the build is an explicit step.
        run: corepack pnpm build
      - name: Publish via OIDC trusted publishing
        # Necessary: --no-git-checks disables pnpm's clean-tree and commit-is-HEAD
        # checks because the version-bump commit from the Release PR need not be
        # HEAD-of-remote at publish time. Do not copy this flag elsewhere.
        # Unregistered packages fail loudly with an OIDC auth error.
        run: corepack pnpm publish -r --provenance --access public --no-git-checks
      - name: Tag released versions
        run: deno run --allow-run=git,pnpm --allow-read scripts/tag-released-packages.mjs
