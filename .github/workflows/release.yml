name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    name: plan · derive phase
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      phase: ${{ steps.plan.outputs.phase }}
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/install-deps
      - uses: denoland/setup-deno@v2
      - id: plan
        name: Decide release phase from repository state
        run: ./scripts/tools/plan-release.mjs >> "$GITHUB_OUTPUT"

  version:
    if: needs.plan.outputs.phase == 'version'
    needs: [plan]
    name: version · open release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-deps
      - uses: denoland/setup-deno@v2
      - name: Consume pending change intents
        run: corepack pnpm version -r
      - name: Capture release set
        run: ./scripts/tools/tag-released-packages.mjs --dry-run --json --output /tmp/captured.json && cat /tmp/captured.json
      - name: Assert release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/tools/create-github-releases.mjs --assert --captured /tmp/captured.json
      - name: Open or update the Release PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: changeset-release/main
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -z "$(git status --porcelain)" ]; then
            echo "no pending change intents — nothing to release"
            if [ -n "$existing" ]; then
              gh pr close "$existing" --delete-branch --comment "No pending change intents remain."
            fi
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --force-create "$BRANCH"
          git add -A
          git commit -m 'chore(release): version packages'
          git push --force origin "$BRANCH"

          cat > /tmp/release-pr-body.md <<'BODY'
          Consumes pending `.changeset/` intents via `pnpm version -r`.

          Merging runs the gate, then builds, publishes (OIDC + provenance),
          and tags the changed packages.

          Review every consumed `none` intent before merging — a `none` on a
          behavior-visible change is a silent non-release.

          Packages not registered as npm trusted publishers fail at publish
          with an OIDC auth error; register them at https://www.npmjs.com.
          BODY

          gh label create release \
            --color 0E8A16 \
            --description 'Automated version-packages release PR' \
            --force

          if [ -n "$existing" ]; then
            gh pr edit "$existing" \
              --title 'chore(release): version packages' \
              --body-file /tmp/release-pr-body.md \
              --add-label release
          else
            gh pr create \
              --base "$BASE" \
              --head "$BRANCH" \
              --title 'chore(release): version packages' \
              --body-file /tmp/release-pr-body.md \
              --label release
          fi

          echo "dispatching CI for branch $BRANCH at $(git rev-parse HEAD)"
          gh workflow run ci.yml --ref "$BRANCH"

  gate:
    if: needs.plan.outputs.phase == 'publish'
    needs: [plan]
    name: the gate (pnpm check:ci)
    uses: ./.github/workflows/reusable-checks.yml

  publish:
    if: needs.plan.outputs.phase == 'publish'
    permissions:
      contents: write
      id-token: write
    name: publish · oidc · tag
    needs: [plan, gate]
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-deps
      - name: Compute publish filters
        # Necessary: npm trusted publishing cannot debut a package, so one
        # never-published package aborts the whole recursive publish and the
        # packages that could ship do not. These exclusions keep it out. The
        # debut itself still fails the job, at the last step.
        run: |
          bash scripts/tools/check-npm-publish.sh --emit-filters /tmp/publish-filters.txt
          cat /tmp/publish-filters.txt
      - uses: denoland/setup-deno@v2
      - name: Build
        # Necessary: every package publishes files: ["dist"] against a gitignored
        # dist/ and none carries a prepack hook, so the build is an explicit step.
        run: corepack pnpm build
      - name: Capture release set
        run: ./scripts/tools/tag-released-packages.mjs --dry-run --json --output /tmp/captured.json && cat /tmp/captured.json
      - name: Assert release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/tools/create-github-releases.mjs --assert --captured /tmp/captured.json
      - name: Publish via OIDC trusted publishing
        # Necessary: --no-git-checks disables pnpm's clean-tree and commit-is-HEAD
        # checks because the version-bump commit from the Release PR need not be
        # HEAD-of-remote at publish time. Do not copy this flag elsewhere.
        # Unregistered packages fail loudly with an OIDC auth error.
        run: corepack pnpm publish -r --provenance --access public --no-git-checks $(cat /tmp/publish-filters.txt)
      - name: Tag released versions
        run: ./scripts/tools/tag-released-packages.mjs --captured /tmp/captured.json
      - name: GitHub Releases from authored changelogs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/tools/create-github-releases.mjs --captured /tmp/captured.json
      - name: Assert every package now exists on npm
        # The job's verdict, deliberately last. A package npm has never seen
        # cannot be debuted by OIDC — a maintainer bootstraps it and registers
        # the trusted publisher — so this ends the run red while naming it. It
        # runs after tag and release so the packages that could ship already
        # did, and the next push to main retries only what is still owed.
        run: bash scripts/tools/check-npm-publish.sh --preflight
