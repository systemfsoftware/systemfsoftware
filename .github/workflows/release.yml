name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: release · version · tag · GitHub releases
    uses: systemfsoftware/pnpm-release-management/.github/workflows/release.yml@54629f2889039eb2e53ccf0179aaf8c7ef0c46a3
    with:
      ci-workflow: ci.yml
    permissions:
      contents: write
      pull-requests: write
      actions: write
