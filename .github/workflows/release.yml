name: Release

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    if: github.event_name == 'push'
    name: version · open release PR
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-deps
      - name: Consume pending change intents
        run: corepack pnpm version -r
      - name: Open or update the Release PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: changeset-release/main
          title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          labels: release
          body: |
            Consumes pending `.changeset/` intents via `pnpm version -r`.

            Merging runs the gate, then builds, publishes (OIDC + provenance),
            and tags the changed packages.

            Review every consumed `none` intent before merging — a `none` on a
            behavior-visible change is a silent non-release.

            Packages not registered as npm trusted publishers fail at publish
            with an OIDC auth error; register them at https://www.npmjs.com.

  gate:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'changeset-release/main'
      && github.event.pull_request.user.login == 'github-actions[bot]'
    name: the gate (pnpm check:ci)
    uses: ./.github/workflows/reusable-checks.yml

  publish:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'changeset-release/main'
      && github.event.pull_request.user.login == 'github-actions[bot]'
    permissions:
      contents: write
      id-token: write
    name: publish · oidc · tag
    needs: [gate]
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-deps
      - name: Preflight — every package must already exist on npm
        # Necessary: npm trusted publishing cannot debut a package (npm-trust
        # prerequisite "Package must exist"). Without this, `pnpm publish -r`
        # attempts each never-published package, aborts on an OIDC auth error,
        # and leaves a partial publish behind.
        run: bash scripts/check-npm-publish.sh --preflight
      - uses: denoland/setup-deno@v2
      - name: Build
        # Necessary: every package publishes files: ["dist"] against a gitignored
        # dist/ and none carries a prepack hook, so the build is an explicit step.
        run: corepack pnpm build
      - name: Publish via OIDC trusted publishing
        # Necessary: --no-git-checks disables pnpm's clean-tree and commit-is-HEAD
        # checks because the version-bump commit from the Release PR need not be
        # HEAD-of-remote at publish time. Do not copy this flag elsewhere.
        # Unregistered packages fail loudly with an OIDC auth error.
        run: corepack pnpm publish -r --provenance --access public --no-git-checks
      - name: Tag released versions
        run: deno run --allow-run=git,pnpm --allow-read scripts/tag-released-packages.mjs
