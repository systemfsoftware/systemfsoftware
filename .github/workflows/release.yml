name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: release · shared tooling
    uses: systemfsoftware/pnpm-release-management/.github/workflows/release.yml@88bb354291fc055b4e67604fbdd3d2bc09d6bfd4
    with:
      ci-workflow: ci.yml
      npm-publish: true
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
