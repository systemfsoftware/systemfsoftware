name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: release · shared tooling
    uses: systemfsoftware/pnpm-release-management/.github/workflows/release.yml@e3db874d8cc182b05981321136c4c91d63aff5f3
    with:
      ci-workflow: ci.yml
    permissions:
      contents: write
      pull-requests: write
      actions: write
