name: storybook-gherkin browser suite

on:
  push:
    branches: [main]
    paths:
      - "packages/storybook-gherkin/**"
      - ".github/workflows/storybook-gherkin-browser.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/storybook-gherkin/**"
      - ".github/workflows/storybook-gherkin-browser.yml"
  workflow_dispatch:

concurrency:
  group: sbg-browser-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-suite:
    name: browser suite (@systemfsoftware/storybook-gherkin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/install-deps
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright chromium
        run: corepack pnpm --filter @systemfsoftware/storybook-gherkin exec playwright install chromium
      - name: Cache Storybook/Vite build artifacts
        uses: actions/cache@v6
        with:
          path: |
            packages/storybook-gherkin/node_modules/.cache
            packages/storybook-gherkin/node_modules/.vite
          key: sbg-vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/storybook-gherkin/**') }}
          restore-keys: |
            sbg-vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Browser suite
        run: corepack pnpm --filter @systemfsoftware/storybook-gherkin test:browser
