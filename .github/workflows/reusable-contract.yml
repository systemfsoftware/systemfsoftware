name: Contract checks (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    name: contract · integration tests (test:contract)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/install-deps
      - uses: denoland/setup-deno@v2
      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-contract-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-contract-
            turbo-${{ runner.os }}-checks-
            turbo-${{ runner.os }}-
      - name: Grant KVM access via udev rule
        run: |
          echo 'KERNEL=="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
      - name: Gate — contract / integration tests
        run: corepack pnpm check:contract
