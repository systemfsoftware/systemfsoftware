name: Consumer fixture

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/reusable-*.yml
      - .github/workflows/conflict-check.yml
      - .github/workflows/consumer-fixture.yml
      - .github/actions/**
      - .github/consumer-fixture/**
      - scripts/tools/**
      - scripts/deno.*
      - scripts/commitlint/**
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/reusable-checks.yml
    with:
      working-directory: .github/consumer-fixture
      record: fixture-test-timings
  checks-took-built-in-lanes:
    name: checks · built-in lanes ran
    needs: checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: The fixture has no hook, so every phase took the built-in lanes, and the test lane ran answer
        env:
          RESULT: ${{ needs.checks.result }}
          SOURCE: ${{ needs.checks.outputs.lane-source }}
          JOBS: ${{ needs.checks.outputs.test-jobs }}
        run: |
          echo "checks=$RESULT lane-source=$SOURCE test-jobs=$JOBS"
          [ "$RESULT" = success ] && [ "$SOURCE" = built-in ] &&
            jq -e 'any(.[]; .packages | index("answer"))' <<< "$JOBS"
  checks-docs-only:
    name: checks · docs-only
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-checks.yml
    with:
      working-directory: .github/consumer-fixture
      record: fixture-test-timings
      docs-globs: "**"
      lanes: >-
        [{"id": "docs", "name": "docs · the tarball packages installed",
          "docs-run": "jq -e '.name == \"@systemfsoftware/stryker-js\"' node_modules/@systemfsoftware/stryker-js/package.json"}]
  checks-docs-only-installed-tarballs:
    name: checks · docs-only ran the producer and the docs phase
    needs: checks-docs-only
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: The producer and the docs lane both ran and passed
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.checks-docs-only.result }}
        run: |
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("checks · docs-only / ")) | {name, conclusion}]')
          echo "checks=$RESULT jobs=$jobs"
          [ "$RESULT" = success ] && jq -e '
            any(.[]; .name == "checks · docs-only / sfs-deps · tarballs the lockfile names" and .conclusion == "success") and
            any(.[]; .name == "checks · docs-only / docs · the tarball packages installed" and .conclusion == "success")' <<< "$jobs"
  mutation-refuses-pull-request:
    name: mutation · refuses a pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - id: guard
        continue-on-error: true
        uses: $/.github/actions/mutation-event-guard
      - name: The guard failed with mutation-on-pull-request
        env:
          OUTCOME: ${{ steps.guard.outcome }}
        run: |
          reason=$(cat "$RUNNER_TEMP/sfs-reason" 2>/dev/null || true)
          echo "outcome=$OUTCOME reason=$reason"
          [ "$OUTCOME" = failure ] && [ "$reason" = mutation-on-pull-request ]
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-commitlint.yml
    with:
      working-directory: .github/consumer-fixture
  nix:
    name: nix
    uses: ./.github/workflows/reusable-nix.yml
    with:
      working-directory: .github/consumer-fixture
  job-records:
    name: job records · one call id per reusable call
    needs: [checks, checks-docs-only, commitlint, nix]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Every call that ran left records under a call id of its own
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].name' | grep '^job-record-' || true)
          printf '%s\n' "$names"
          calls() { grep -oE "^job-record-consumer-fixture-$1-[0-9a-f]{8}-" <<< "$names" | sort -u | wc -l; }
          ran() { jq -r --arg k "$1" 'if .[$k].result == "skipped" then 0 else 1 end' <<< "$NEEDS"; }
          want_checks=$(( $(ran checks) + $(ran checks-docs-only) ))
          echo "checks calls: $(calls checks) of $want_checks, nix: $(calls nix) of $(ran nix), commitlint: $(calls commitlint) of $(ran commitlint)"
          [ "$(calls checks)" -eq "$want_checks" ] && [ "$(calls nix)" -eq "$(ran nix)" ] && [ "$(calls commitlint)" -eq "$(ran commitlint)" ]
  commitlint-refuses-unresolved-config:
    name: commitlint · a config the toolchain cannot load fails with its reason
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: /.github/consumer-fixture/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Plant a config that extends a package outside the pinned toolchain
        working-directory: .github/consumer-fixture
        run: |
          rm -f commitlint.config.*
          printf '{"extends": ["@commitlint/config-angular"]}\n' > .commitlintrc.json
      - id: lint
        continue-on-error: true
        uses: $/.github/actions/commitlint
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          working-directory: .github/consumer-fixture
          from: ${{ github.event.pull_request.base.sha }}
          to: ${{ github.event.pull_request.head.sha }}
      - name: The action failed with commitlint-config-unresolved naming the package
        env:
          OUTCOME: ${{ steps.lint.outcome }}
        run: |
          reason=$(head -n 1 "$RUNNER_TEMP/sfs-reason" 2>/dev/null || true)
          echo "outcome=$OUTCOME reason=$reason"
          [ "$OUTCOME" = failure ] && [ "$reason" = commitlint-config-unresolved ] &&
            grep -q '@commitlint/config-angular' "$RUNNER_TEMP/sfs-logs/commitlint.log"
