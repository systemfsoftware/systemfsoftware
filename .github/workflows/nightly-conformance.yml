name: Nightly conformance

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-conformance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    name: nightly conformance · CONFORMANCE_PROFILE=nightly
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HUSKY: "0"
      NODE_OPTIONS: "--max-old-space-size=4096"
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: denoland/setup-deno@v2
      - uses: ./.github/actions/install-deps
      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-nightly-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-nightly-
            turbo-${{ runner.os }}-
      - name: Build once
        run: corepack pnpm build
      - name: Nightly conformance tests
        env:
          CONFORMANCE_PROFILE: nightly
        run: corepack pnpm test
