name: Mutation (reusable)
on:
  workflow_call:
    inputs:
      working-directory:
        description: The pnpm workspace root, relative to the repository root. A non-root value checks out only that directory
        required: false
        type: string
        default: .
      target-seconds:
        description: Wall seconds each planned shard or batch is sized to; the plan reports a shard predicted over it and never stops one
        required: false
        type: number
        default: 600
      seed-costs:
        description: >-
          Path, relative to the workspace root, of measured costs ({projects: {<dir>: {seconds, mutants}}}) that price a project
          with no incremental record; a project it does not name is priced at its slowest rate, and a missing file at one
          second per mutant
        required: false
        type: string
        default: .github/mutation-seed-costs.json
      runs-on:
        description: JSON label list for every job
        required: false
        type: string
        default: '["ubuntu-latest"]'
      sfs-deps-installable:
        description: Flake installable, evaluated in `working-directory`, whose output is the `.tgz` files pnpm-lock.yaml names under `file:.sfs-deps/`. Built at most once per call and cached under the recorded integrities; unused when the lockfile names no such tarball
        required: false
        type: string
        default: .#sfs-deps
      sha:
        description: A commit on the default branch to test instead of the run's own; the guard refuses any other
        required: false
        type: string
        default: ""
      packages:
        description: JSON array of package names to plan instead of every package; the plan refuses any but a non-empty array of packages with a mutation task
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  TARGET_SECONDS: ${{ inputs.target-seconds }}
  SHARD_OVERHEAD_SECONDS: 120
  TEST_RUNNERS: 2
  STRYKER_CONCURRENCY: 4
  # A schedule event carries no repository payload; it always runs on the default branch.
  DEFAULT_BRANCH: ${{ github.event_name == 'schedule' && github.ref_name || github.event.repository.default_branch }}
  MUTATION_SHA: ${{ inputs.sha || github.sha }}

jobs:
  guard:
    name: mutation · event guard
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    steps:
      - &start
        id: start
        working-directory: ${{ runner.temp }}
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: guard
        uses: $/.github/actions/mutation-event-guard
      - id: history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false
      - &tools
        id: tools
        uses: $/.github/actions/sfs-tools
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - id: main
        name: Refuse a run off the default branch, or a sha its tip does not hold
        env:
          SHA: ${{ inputs.sha }}
        run: mutation-night guard --ref "$GITHUB_REF_NAME" --default "$DEFAULT_BRANCH" "--sha=$SHA"
      - if: failure() || cancelled()
        uses: $/.github/actions/failure-summary
        with:
          job: guard
          reasons: |
            guard mutation-on-pull-request
            tools tools-ref-missing
          steps: ${{ toJSON(steps) }}
          reproduce: "git fetch origin && deno run --config=scripts/deno.jsonc --lock=scripts/deno.lock --frozen --allow-read --allow-write --allow-env --allow-run=git scripts/tools/mutation-night.ts guard --ref ${{ github.ref_name }} --default ${{ env.DEFAULT_BRANCH }} --sha=${{ inputs.sha }}"
      - &wall
        if: always()
        working-directory: ${{ runner.temp }}
        env:
          STARTED: ${{ steps.start.outputs.at }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "wall time: $(( $(date +%s) - ${STARTED:-$(date +%s)} )) s (job $JOB_STATUS)" >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: plan · one stryker plan per project turbo selects
    needs: [guard, sfs-deps]
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      shards: ${{ steps.shape.outputs.shards }}
      merges: ${{ steps.shape.outputs.merges }}
      batches: ${{ steps.shape.outputs.batches }}
      planned: ${{ steps.shape.outputs.planned }}
    steps:
      - *start
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MUTATION_SHA }}
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: ${{ inputs.working-directory != '.' && format('/{0}/', inputs.working-directory) || '' }}
          sparse-checkout-cone-mode: false
      - *tools
      - &sfsdeps
        id: sfs-deps
        uses: $/.github/actions/sfs-deps-restore
        with:
          key: ${{ needs.sfs-deps.outputs.key }}
          working-directory: ${{ inputs.working-directory }}
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - &install
        id: install
        uses: $/.github/actions/install-deps
        with:
          working-directory: ${{ inputs.working-directory }}
      # Closed-list exemption (turbo-task-graph, Stryker's own incremental record): turbo selects the projects, and
      # Stryker's record decides which of a selected project's mutants re-run; no turbo task reads or writes it.
      - &restore
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ inputs.working-directory }}/.stryker-incremental
          key: stryker-incremental-${{ inputs.working-directory }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ inputs.working-directory }}-
      - &place
        id: place
        name: Place incremental files
        run: if [ -d .stryker-incremental ]; then cp -a .stryker-incremental/. .; fi
      - id: admit
        name: Refuse every package that would mutate more than its workflow files
        run: |
          mkdir -p "$RUNNER_TEMP/sfs-logs"
          set -o pipefail
          mutation-admit 2>&1 | tee "$RUNNER_TEMP/sfs-logs/admit.log"

      # turbo decides which projects this run covers: on a schedule, the `mutation` tasks affected since the last
      # green night, whose `mutation` inputs include the lane's own workflows, tools and seed costs, so a change to
      # the lane selects every project; on a dispatch, the packages its `packages` input names, else every package.
      - id: select
        name: Select the projects turbo marks affected
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -o pipefail
          export LC_ALL=C
          turbo() { corepack pnpm exec turbo query "$1" < /dev/null; }
          turbo 'query { packages { items { name path tasks { items { name } } } } }' \
            | jq -r '.data.packages.items[] | select(any(.tasks.items[]; .name == "mutation")) | [.path, .name] | @tsv' \
            | sort > mutation-enrolled.tsv
          base=
          if [ -n "$PACKAGES" ]; then
            mutation-night packages --enrolled mutation-enrolled.tsv "--packages=$PACKAGES" > mutation-selected.tsv
            echo "the dispatch's packages: $(wc -l < mutation-selected.tsv) of $(wc -l < mutation-enrolled.tsv) projects" | tee -a "$GITHUB_STEP_SUMMARY"
            cut -f1 mutation-selected.tsv
            exit 0
          fi
          if [ "$EVENT" = schedule ]; then
            # Closed-list exemption (turbo-task-graph, finding the base commit): turbo compares two commits but does
            # not know which one last passed, so the base is the commit of the newest scheduled night whose record
            # says green.
            file=${WORKFLOW_REF%@*}
            file=${file##*/}
            base=$(mutation-night base --repo "$GITHUB_REPOSITORY" --workflow "$file" --branch "$DEFAULT_BRANCH" --before "$GITHUB_RUN_ID")
            if [ -n "$base" ] && ! git merge-base --is-ancestor -- "$base" HEAD 2> /dev/null; then
              echo "::warning::the last green night's commit $base is not in this run's history, so every project is selected."
              base=
            fi
          fi
          if [ -n "$base" ]; then
            query="query { affectedTasks(base: \"$base\", head: \"$MUTATION_SHA\", tasks: [\"mutation\"]) { items { name package { name path } reason { __typename } } } }"
            turbo "$query" | tee "$RUNNER_TEMP/turbo-affected.json" \
              | jq -r '.data.affectedTasks.items[] | select(.name == "mutation") | [.package.path, .package.name] | @tsv' \
              | sort -u | join -t $'\t' - mutation-enrolled.tsv -o 1.1,1.2 > mutation-selected.tsv
            echo "turbo affectedTasks for mutation, $base..$MUTATION_SHA: $(wc -l < mutation-selected.tsv) of $(wc -l < mutation-enrolled.tsv) projects" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            cp mutation-enrolled.tsv mutation-selected.tsv
            echo "every project with a mutation task: $(wc -l < mutation-selected.tsv) (event $EVENT, no green night found)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          cut -f1 mutation-selected.tsv

      # Closed-list exemption (turbo-task-graph, sharding by measured duration): turbo picked the projects; this step
      # only sizes each one's shards from measured seconds per mutant (seed costs or its incremental record).
      - id: plan
        name: Plan every selected project
        env:
          SEED: ${{ inputs.seed-costs }}
        run: |
          set -o pipefail
          touch mutation-projects.jsonl
          if [ -f "$SEED" ]; then
            slowest=$(jq '[.projects[] | select(.mutants > 0 and .seconds > 0) | .seconds / .mutants] | max // 1' "$SEED")
          else
            slowest=1
            echo '{"projects": {}}' > "$RUNNER_TEMP/no-seed.json"
            SEED="$RUNNER_TEMP/no-seed.json"
          fi
          while IFS=$'\t' read -r label name; do
              slug=$(printf '%s' "${label#packages/}" | tr '/' '-')
              plan="mutation-plan-$slug.json"
              records=()
              for f in "$label/reports/stryker-incremental.json" "$label"/reports/stryker-incremental-*.json; do
                if [ -f "$f" ]; then records+=("$f"); fi
              done
              cmax=0
              dry=null
              read -r rate source < <(jq -r --arg label "$label" --argjson slowest "$slowest" '
                .projects[$label] as $p
                | if $p == null then "\($slowest) slowest seconds per mutant in the seed (no measurement of this project)"
                  elif ($p.mutants > 0 and $p.seconds > 0 | not) then "\($slowest) slowest seconds per mutant in the seed (this project's entry, \($p.seconds)s over \($p.mutants) mutants, gives no rate)"
                  else "\($p.seconds / $p.mutants) seconds per mutant in the seed (\($p.seconds)s over \($p.mutants) mutants)" end' "$SEED")
              per=$(jq -n --argjson r "$rate" --argjson o "$SHARD_OVERHEAD_SECONDS" --argjson t "$TARGET_SECONDS" \
                '($t - $o) / $r | floor')
              if [ "$per" -lt 1 ]; then
                echo "::warning::$label: one mutant costs ${rate}s (cost source: $source), over the ${TARGET_SECONDS}s target, so each shard holds one mutant and runs over it."
                per=1
              fi
              # Without a record the planner prices every mutant at one second, so the target is the
              # number of mutants a shard can hold; the records are moved aside so they price nothing.
              hidden="$RUNNER_TEMP/hidden-records/$slug"
              mkdir -p "$hidden"
              for f in "${records[@]}"; do mv "$f" "$hidden/"; done
              corepack pnpm exec stryker plan --projects "$label" --target-seconds "$per" --out "$plan" < /dev/null
              for f in "${records[@]}"; do mv "$hidden/$(basename "$f")" "$f"; done

              if [ "${#records[@]}" -gt 0 ]; then
                read -r pricing measured planned < <(record-pricing --plan "$plan" "${records[@]}")
                if [ "$pricing" = seed ]; then
                  source="$source; the record measured $measured of $planned planned mutants"
                else
                  rate=null
                  source="incremental record(s) ${records[*]}, measuring all $planned planned mutants"
                  read -r cmax cmax_id < <(jq -rs '[.[] | (.costs // {}) | to_entries[]
                    | {id: .key, ms: (.value.actualMs // .value.predictedMs // 0)}]
                    | (max_by(.ms) // {id: "", ms: 0}) | "\(.ms / 1000 | ceil) \(.id)"' "${records[@]}")
                  dry=$(jq -s '[.[] | .dryRunCoverage | select(. != null)
                    | ((.timeOverheadMs // 0) + ([.tests[]?.timeSpentMs // 0] | add // 0)) / 1000] | max' "${records[@]}")
                  target=$(( (TARGET_SECONDS - SHARD_OVERHEAD_SECONDS) * TEST_RUNNERS - cmax ))
                  if [ "$target" -lt 1 ]; then
                    echo "::warning::$label: mutant $cmax_id costs ${cmax}s of test time, over the ${TARGET_SECONDS}s target, so its shard runs over it. Next: split the file that mutant lives in, or make the slowest test covering it faster."
                    target=$cmax
                  fi
                  corepack pnpm exec stryker plan --projects "$label" --target-seconds "$target" --out "$plan" < /dev/null

                  # One shard also runs the dry run; when the recorded dry run would push it past
                  # the target, split it so the shards reuse coverage instead.
                  split=$(jq --argjson o "$SHARD_OVERHEAD_SECONDS" --argjson r "$TEST_RUNNERS" --argjson cmax "$cmax" \
                    --argjson dry "$dry" --argjson t "$TARGET_SECONDS" '
                    ([.shards[].predictedSeconds] | add // 0) as $total
                    | if (.shards | length) == 1 and $dry != null and $o + $dry + ($total + $cmax) / $r > $t
                      then [($total / 2 | ceil), 1] | max else 0 end' "$plan")
                  if [ "$split" -gt 0 ]; then
                    corepack pnpm exec stryker plan --projects "$label" --target-seconds "$split" --out "$plan" < /dev/null
                  fi
                fi
              fi

              mutants=$(jq '[.shards[].projects[].mutants[]] | length' "$plan")
              if [ "$mutants" -eq 0 ]; then
                echo "::error::$label: planned 0 mutants, new or remembered, so mutation has nothing to gate. Next: check the project's stryker config mutate globs, or drop its mutation script."
                exit 1
              fi
              # The plan lists remembered mutants beside new ones; count which ids the restored
              # record already holds, so a run's summary shows how much it reused.
              remembered=0
              if [ "${#records[@]}" -gt 0 ]; then
                remembered=$(jq -s --slurpfile p "$plan" '
                  ([.[] | .files[]?.mutants[]?.id] | map({key: ., value: true}) | from_entries) as $known
                  | [$p[0].shards[].projects[].mutants[] | select($known[.])] | length' "${records[@]}")
              fi

              # Wall seconds of each shard: overhead plus its mutants at the seeded rate, or
              # its recorded test time over the runners; a lone shard also runs the dry run.
              row=$(jq -c --argjson o "$SHARD_OVERHEAD_SECONDS" --argjson r "$TEST_RUNNERS" --argjson cmax "$cmax" \
                --argjson dry "$dry" --argjson rate "$rate" --arg slug "$slug" --arg label "$label" --arg name "$name" \
                --arg source "$source" --argjson mutants "$mutants" --argjson remembered "$remembered" '
                (.shards | length) as $n
                | [.shards[] | if $rate != null
                    then $o + ([.projects[].mutants[]] | length) * $rate
                    else $o + (if $n == 1 then $dry // 0 else 0 end) + (.predictedSeconds + $cmax) / $r end
                    | ceil] as $costs
                | {slug: $slug, label: $label, name: $name, mutants: $mutants, remembered: $remembered,
                   fresh: ($mutants - $remembered), predicted: ([.shards[].predictedSeconds] | add // 0 | ceil), n: $n,
                   estimate: ($costs | max), total: ($costs | add), source: $source}' "$plan")
              echo "$row" | jq -r '"\(.label): \(.mutants) mutants (\(.fresh) new, \(.remembered) in the record, \(.predicted)s to test) in \(.n) shard(s), max shard \(.estimate)s (\(.source))"'
              if [ "$(echo "$row" | jq --argjson t "$TARGET_SECONDS" '.estimate > $t')" = true ]; then
                echo "::warning::$label: a planned shard costs $(echo "$row" | jq .estimate)s, over the ${TARGET_SECONDS}s target (cost source: $source); it runs anyway, under the 60-minute job timeout. Next: fix the cost at its cause, the slow mutant or test."
              fi
              echo "$row" >> mutation-projects.jsonl
            done < mutation-selected.tsv
          {
            echo "Shards are sized to ${TARGET_SECONDS} s each; a shard predicted over it is reported here and runs anyway."
            echo
            echo '| Project | Mutants | New | Ids the record holds | Planned test seconds | Shards | Costliest shard (s) | Priced by |'
            echo '| --- | --- | --- | --- | --- | --- | --- | --- |'
            jq -r '"| \(.label) | \(.mutants) | \(.fresh) | \(.remembered) | \(.predicted) | \(.n) | \(.estimate) | \(.source) |"' mutation-projects.jsonl
          } >> "$GITHUB_STEP_SUMMARY"

      # Closed-list exemption (turbo-task-graph, packing by measured duration): one-shard projects are packed
      # first-fit into batch jobs by their measured cost; which projects run was decided by turbo above.
      - name: Shape jobs from the plans
        id: shape
        run: |
          touch mutation-projects.jsonl
          dups=$(jq -sr 'group_by(.slug) | map(select(length > 1) | "\(.[0].slug): \(map(.label) | join(", "))") | .[]' mutation-projects.jsonl)
          if [ -n "$dups" ]; then
            echo "::error::two projects share a mutation slug, so their artifacts would collide: $dups. Next: rename one project directory."
            exit 1
          fi
          reserved=$(jq -r 'select(.slug | startswith("batch-")) | .label' mutation-projects.jsonl)
          if [ -n "$reserved" ]; then
            echo "::error::a project slug starting with batch- would collide with the batch jobs' artifact names: $reserved. Next: rename the project directory."
            exit 1
          fi
          shaped=$(jq -sc --argjson b "$TARGET_SECONDS" '
            . as $live
            | ($live | map(select(.n >= 2))) as $sharded
            | {
                shards: [$sharded[] as $p | range(1; $p.n + 1) | {slug: $p.slug, label: $p.label, name: $p.name, k: ., n: $p.n, minutes: ($p.total / 60 | ceil)}],
                merges: [$sharded[] | {slug, label, name, n, minutes: (.total / 60 | ceil)}],
                batches: ($live | map(select(.n == 1)) | sort_by(-.estimate)
                  | reduce .[] as $p ([];
                      (map(.load + $p.estimate <= $b) | index(true)) as $j
                      | if $j == null
                        then . + [{load: $p.estimate, projects: [$p | {slug, label, name, mutants, fresh, remembered, predicted}]}]
                        else .[$j].load += $p.estimate | .[$j].projects += [$p | {slug, label, name, mutants, fresh, remembered, predicted}]
                        end)
                  | to_entries | map({id: (.key + 1), load: .value.load, minutes: (.value.load / 60 | ceil), projects: .value.projects}))
              }' mutation-projects.jsonl)
          echo "$shaped" | jq -r '.batches[] | "batch \(.id): \(.load)s · \([.projects[].label] | join(", "))"'
          echo "planned=$(jq -sc 'map({slug, label, name})' mutation-projects.jsonl)" >> "$GITHUB_OUTPUT"
          for key in shards merges batches; do
            echo "$key=$(echo "$shaped" | jq -c ".$key")" >> "$GITHUB_OUTPUT"
          done
          echo "shard-count=$(echo "$shaped" | jq '.shards | length')" >> "$GITHUB_OUTPUT"
          echo "$shaped" | jq -r '.merges[].slug' | while read -r slug; do
            jq '.shards = [{index: 1, count: 1, predictedSeconds: 0,
                  projects: [{project: .shards[0].projects[0].project, mutants: []}]}]
                | .matrix.include = [{shard: "1/1", predictedSeconds: 0}]' \
              "mutation-plan-$slug.json" > "mutation-coverage-$slug.json"
          done
      - id: matrix
        name: Refuse a shard matrix GitHub cannot create
        env:
          SHARD_COUNT: ${{ steps.shape.outputs.shard-count }}
          # https://docs.github.com/en/actions/reference/limits: a job matrix generates at most 256 jobs per run.
          MATRIX_LIMIT: 256
        run: |
          if [ "$SHARD_COUNT" -gt "$MATRIX_LIMIT" ]; then
            echo "::error::the plans need $SHARD_COUNT shard jobs, over the $MATRIX_LIMIT jobs one GitHub matrix may create, so the shard job would never be created. Next: open this job's plan summary and fix the project whose shard count is out of line with its mutants."
            exit 1
          fi
      - id: upload-plans
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-plans
          path: |
            ${{ inputs.working-directory }}/mutation-plan-*.json
            ${{ inputs.working-directory }}/mutation-coverage-*.json
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true
      - if: failure() || cancelled()
        uses: $/.github/actions/failure-summary
        with:
          job: plan
          reasons: |
            sfs-deps sfs-deps-missing
            install install-failed
            admit plan-failed
            select plan-failed
            plan plan-failed
            shape plan-failed
            matrix mutation-matrix-too-large
          steps: ${{ toJSON(steps) }}
          reproduce: "gh workflow run Mutation -R ${{ github.repository }} --ref ${{ env.DEFAULT_BRANCH }} -f sha=${{ env.MUTATION_SHA }}${{ inputs.packages && format(' -f packages=''{0}''', inputs.packages) || '' }}"
          reproduce-label: reproduce through a dispatch on main
          working-directory: ${{ inputs.working-directory }}
      - *wall

  sfs-deps:
    name: sfs-deps · tarballs the lockfile names
    needs: guard
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      key: ${{ steps.produce.outputs.key }}
    steps:
      - *start
      - &checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MUTATION_SHA }}
          persist-credentials: false
          sparse-checkout: ${{ inputs.working-directory != '.' && format('/{0}/', inputs.working-directory) || '' }}
          sparse-checkout-cone-mode: false
      - id: produce
        uses: $/.github/actions/sfs-deps
        with:
          working-directory: ${{ inputs.working-directory }}
          installable: ${{ inputs.sfs-deps-installable }}
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - if: failure() || cancelled()
        uses: $/.github/actions/failure-summary
        with:
          job: sfs-deps
          reasons: ""
          steps: ${{ toJSON(steps) }}
          reproduce: nix build -L ${{ inputs.sfs-deps-installable }}
          working-directory: ${{ inputs.working-directory }}
      - *wall

  coverage:
    name: coverage · ${{ matrix.project.label }}
    needs: [guard, plan, sfs-deps]
    if: ${{ needs.plan.outputs.merges != '[]' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.merges) }}
    steps:
      - *start
      - *checkout
      - *sfsdeps
      - *install
      - id: build
        name: Build
        env:
          NAME: ${{ matrix.project.name }}
        run: corepack pnpm exec turbo run build --output-logs=errors-only --log-order=stream --filter="$NAME"
      - *restore
      - *place
      - &plans
        id: plans
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-plans
          path: ${{ inputs.working-directory }}
      - id: mutation
        name: Dry run once for every shard
        env:
          SLUG: ${{ matrix.project.slug }}
        run: |
          set -o pipefail
          # The CLI prints a bounded tail of a failed child; the full output and the
          # child's progress stream go to the failure log instead of the step summary.
          log="$RUNNER_TEMP/stryker-$SLUG.log"
          status=0
          corepack pnpm exec stryker run --plan "mutation-coverage-$SLUG.json" --shard 1/1 --out "mutation-coverage/$SLUG" < /dev/null 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            mkdir -p "$RUNNER_TEMP/sfs-logs/$SLUG"
            mv "$log" "$RUNNER_TEMP/sfs-logs/$SLUG/stryker-run.log"
            [ ! -d "mutation-coverage/$SLUG" ] || find "mutation-coverage/$SLUG" -name mutation-stream.jsonl -exec cp --parents {} "$RUNNER_TEMP/sfs-logs/$SLUG/" \; || true
          fi
          exit "$status"
      - id: upload-coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-coverage-${{ matrix.project.slug }}-a${{ github.run_attempt }}
          path: ${{ inputs.working-directory }}/mutation-coverage/${{ matrix.project.slug }}/${{ matrix.project.label }}/stryker-incremental.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - &summary
        if: failure() || cancelled()
        uses: $/.github/actions/failure-summary
        with:
          job: ${{ github.job }}-${{ matrix.project.slug || matrix.shard.slug || format('batch-{0}', matrix.batch.id) }}${{ matrix.shard && format('-{0}of{1}', matrix.shard.k, matrix.shard.n) || '' }}
          reasons: |
            coverage mutation-coverage-failed
            sfs-deps sfs-deps-missing
            install install-failed
            build build-failed
            mutation mutation-failed
            merge mutation-merge-failed
            reuse mutation-prior-unread
            download mutation-merge-failed
            gate mutation-failed
          steps: ${{ toJSON(steps) }}
          reproduce: "gh workflow run Mutation -R ${{ github.repository }} --ref ${{ env.DEFAULT_BRANCH }} -f sha=${{ env.MUTATION_SHA }} -f packages='${{ matrix.batch && format('[\"{0}\"]', join(matrix.batch.projects.*.name, '\",\"')) || format('[\"{0}\"]', matrix.project.name || matrix.shard.name) }}' (cost: about ${{ matrix.batch.minutes || matrix.project.minutes || matrix.shard.minutes }} job-min the plan predicts for these packages)"
          reproduce-label: reproduce through a dispatch on main
          working-directory: ${{ inputs.working-directory }}
      - *wall

  shard:
    name: shard · ${{ matrix.shard.label }} ${{ matrix.shard.k }}/${{ matrix.shard.n }}
    needs: [guard, plan, sfs-deps, coverage]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.shards != '[]' }}
    permissions:
      contents: read
      actions: read
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - *start
      - *checkout
      - *tools
      - &coverage
        id: coverage
        name: Require this project's coverage dry run
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ matrix.shard.label || matrix.project.label }}
          SLUG: ${{ matrix.shard.slug || matrix.project.slug }}
        run: |
          api() {
            if gh api --paginate "$1" --jq "$2" > "$3" 2> "$RUNNER_TEMP/api.err"; then return 0; fi
            status=$(grep -oE 'HTTP [0-9]{3}' "$RUNNER_TEMP/api.err" | tail -n 1 || true)
            echo mutation-api-failed > "$RUNNER_TEMP/sfs-reason"
            echo "::error::$LABEL: GET $1 failed (${status:-no HTTP status}), so this job cannot read the run. Next: re-run the failed jobs."
            exit 1
          }
          api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" \
            '.jobs[] | [.name, .run_attempt, .started_at, .conclusion] | @tsv' "$RUNNER_TEMP/run-jobs.tsv"
          api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            '.artifacts[] | [.name, .expired] | @tsv' "$RUNNER_TEMP/run-artifacts.txt"
          ran=$(job-attempt --job "coverage · $LABEL" < "$RUNNER_TEMP/run-jobs.tsv") || ran=$'0\tmissing'
          conclusion=$(cut -f2 <<< "$ran")
          if [ "$conclusion" != success ]; then
            echo mutation-coverage-failed > "$RUNNER_TEMP/sfs-reason"
            echo "::error::$LABEL: the newest run of its coverage dry run concluded '$conclusion', so no shard of it can run. Next: open the job 'coverage · $LABEL' and fix what its failure log names."
            exit 1
          fi
          job-attempt --job "coverage · $LABEL" --artifact "mutation-coverage-$SLUG" \
            --artifacts "$RUNNER_TEMP/run-artifacts.txt" --reason-file "$RUNNER_TEMP/sfs-reason" \
            < "$RUNNER_TEMP/run-jobs.tsv" > /dev/null
          echo "attempt=$(cut -f1 <<< "$ran")" >> "$GITHUB_OUTPUT"
      - *sfsdeps
      - *install
      - id: build
        name: Build
        env:
          NAME: ${{ matrix.shard.name }}
        run: corepack pnpm exec turbo run build --output-logs=errors-only --log-order=stream --filter="$NAME"
      - *restore
      - *place
      - id: aside
        name: Move the prior record aside for this run's coverage record
        env:
          LABEL: ${{ matrix.shard.label }}
        run: |
          prior="$LABEL/reports/stryker-incremental.json"
          if [ -f "$prior" ]; then mv "$prior" "$LABEL/reports/stryker-incremental-prior.json"; fi
      - *plans
      - id: coverage-record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-coverage-${{ matrix.shard.slug }}-a${{ steps.coverage.outputs.attempt }}
          path: ${{ inputs.working-directory }}/${{ matrix.shard.label }}/reports
      - id: mutation
        name: Run shard
        env:
          SLUG: ${{ matrix.shard.slug }}
          K: ${{ matrix.shard.k }}
          N: ${{ matrix.shard.n }}
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/stryker-$SLUG.log"
          status=0
          corepack pnpm exec stryker run --plan "mutation-plan-$SLUG.json" --shard "$K/$N" --out "mutation-shards/$SLUG/$K" < /dev/null 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            mkdir -p "$RUNNER_TEMP/sfs-logs/$SLUG"
            mv "$log" "$RUNNER_TEMP/sfs-logs/$SLUG/stryker-run.log"
            [ ! -d "mutation-shards/$SLUG/$K" ] || find "mutation-shards/$SLUG/$K" -name mutation-stream.jsonl -exec cp --parents {} "$RUNNER_TEMP/sfs-logs/$SLUG/" \; || true
          fi
          exit "$status"
      - id: reuse
        name: Prove the shard reused the prior record and the coverage dry run
        env:
          SLUG: ${{ matrix.shard.slug }}
          LABEL: ${{ matrix.shard.label }}
          K: ${{ matrix.shard.k }}
          N: ${{ matrix.shard.n }}
        run: |
          reuse=$(run-reuse --plan "mutation-plan-$SLUG.json" --shard "$K" \
            --prior "$LABEL/reports/stryker-incremental-prior.json" \
            --stream "mutation-shards/$SLUG/$K/$LABEL/mutation-stream.jsonl" \
            --record "mutation-shards/$SLUG/$K/$LABEL/stryker-incremental.json" \
            --coverage "$LABEL/reports/stryker-incremental.json" \
            --label "$LABEL $K/$N" --details "$RUNNER_TEMP/run-reuse.md" --reason-file "$RUNNER_TEMP/sfs-reason")
          echo "$LABEL $K/$N: $reuse" >> "$GITHUB_STEP_SUMMARY"
          [ ! -f "$RUNNER_TEMP/run-reuse.md" ] || cat "$RUNNER_TEMP/run-reuse.md" >> "$GITHUB_STEP_SUMMARY"
      - id: upload-shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-shard-${{ matrix.shard.slug }}-${{ matrix.shard.k }}of${{ matrix.shard.n }}-a${{ github.run_attempt }}
          path: ${{ inputs.working-directory }}/mutation-shards/${{ matrix.shard.slug }}/${{ matrix.shard.k }}/
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true
      - *summary
      - *wall

  merge:
    name: merge · gate · ${{ matrix.project.label }}
    needs: [guard, plan, sfs-deps, shard]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.merges != '[]' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.merges) }}
    steps:
      - *start
      - *checkout
      - *tools
      - *coverage
      - *sfsdeps
      - *install
      - *plans
      - id: download
        name: Download each planned shard from the attempt it last ran in
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ matrix.project.slug }}
          LABEL: ${{ matrix.project.label }}
          N: ${{ matrix.project.n }}
        run: |
          set -o pipefail
          jq -r '.shards[].index' "mutation-plan-$SLUG.json" | while read -r k; do
            row=$(job-attempt --job "shard · $LABEL $k/$N" --artifact "mutation-shard-$SLUG-${k}of$N" \
              --artifacts "$RUNNER_TEMP/run-artifacts.txt" --reason-file "$RUNNER_TEMP/sfs-reason" \
              < "$RUNNER_TEMP/run-jobs.tsv")
            attempt=$(cut -f1 <<< "$row") conclusion=$(cut -f2 <<< "$row") artifact=$(cut -f3 <<< "$row")
            if [ "$conclusion" != success ] || [ "$artifact" != "mutation-shard-$SLUG-${k}of$N-a$attempt" ]; then
              echo mutation-shard-failed > "$RUNNER_TEMP/sfs-reason"
              if [ "$conclusion" = success ]; then
                next="that attempt uploaded no shard artifact and gh run rerun --failed will not re-run a successful job, so re-run the whole run: gh run rerun $GITHUB_RUN_ID -R $GITHUB_REPOSITORY (every job again, up to its 60-minute timeout)"
              else
                next="open that shard job, then gh run rerun $GITHUB_RUN_ID -R $GITHUB_REPOSITORY --failed"
              fi
              echo "::error title=mutation-shard-failed::$LABEL: shard $k/$N concluded $conclusion in attempt $attempt, whose artifact is ${artifact:-missing}, so no partial verdicts are merged or gated. Next: $next"
              exit 1
            fi
            gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "mutation-shards/$SLUG/$k"
          done
      - id: merge
        name: Merge
        env:
          SLUG: ${{ matrix.project.slug }}
        run: |
          corepack pnpm exec stryker merge --plan "mutation-plan-$SLUG.json" \
            $(jq -r --arg slug "$SLUG" '.shards[].index | "mutation-shards/\($slug)/\(.)"' "mutation-plan-$SLUG.json") \
            --out reports/mutation
      - id: stage
        name: Stage the merged incremental
        env:
          LABEL: ${{ matrix.project.label }}
        run: |
          mkdir -p "merged/$LABEL/reports"
          cp "reports/mutation/$LABEL/stryker-incremental.json" "merged/$LABEL/reports/stryker-incremental.json"
      - id: upload-merged
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-merged-${{ matrix.project.slug }}
          path: ${{ inputs.working-directory }}/merged/
          retention-days: 1
          overwrite: true
      - id: upload-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ matrix.project.slug }}
          path: ${{ inputs.working-directory }}/reports/mutation/mutation.json
          retention-days: 14
          overwrite: true
      - id: gate
        name: Gate
        env:
          LABEL: ${{ matrix.project.label }}
        run: |
          echo '{"schemaVersion":1,"survivors":[]}' > "$RUNNER_TEMP/accepted-none.json"
          corepack pnpm exec stryker gate --baseline "$RUNNER_TEMP/accepted-none.json" < /dev/null
      - *summary
      - *wall

  batch:
    name: batch ${{ matrix.batch.id }} · ${{ join(matrix.batch.projects.*.label, ', ') }}
    needs: [guard, plan, sfs-deps]
    if: ${{ needs.plan.outputs.batches != '[]' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    steps:
      - *start
      - *checkout
      - *tools
      - *sfsdeps
      - *install
      - id: build
        name: Build
        env:
          PROJECTS: ${{ toJSON(matrix.batch.projects) }}
        run: corepack pnpm exec turbo run build --output-logs=errors-only --log-order=stream $(echo "$PROJECTS" | jq -r '.[] | "--filter=\(.name)"')
      - *restore
      - *place
      - *plans
      - id: mutation
        name: Run, merge and gate each project in turn
        env:
          PROJECTS: ${{ toJSON(matrix.batch.projects) }}
        run: |
          set -o pipefail
          echo '{"schemaVersion":1,"survivors":[]}' > "$RUNNER_TEMP/accepted-none.json"
          failed=
          unreused=
          unreused_reason=
          {
            echo '| Project | Mutants | New | Ids the record holds | Planned test seconds | Reuse | Outcome |'
            echo '| --- | --- | --- | --- | --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r slug LABEL counts; do
            before="$failed$unreused"
            reuse=-
            echo "::group::$LABEL"
            log="$RUNNER_TEMP/stryker-$slug.log"
            if corepack pnpm exec stryker run --plan "mutation-plan-$slug.json" --shard 1/1 --out "mutation-shards/$slug/1" < /dev/null 2>&1 | tee "$log" \
              && corepack pnpm exec stryker merge --plan "mutation-plan-$slug.json" "mutation-shards/$slug/1" --out reports/mutation < /dev/null 2>&1 | tee -a "$log"; then
              mkdir -p "merged/$LABEL/reports" "mutation-reports/$slug"
              cp "reports/mutation/$LABEL/stryker-incremental.json" "merged/$LABEL/reports/stryker-incremental.json"
              cp reports/mutation/mutation.json "mutation-reports/$slug/mutation.json"
              reuse=$(run-reuse --plan "mutation-plan-$slug.json" --shard 1 --prior "$LABEL/reports/stryker-incremental.json" \
                --stream "mutation-shards/$slug/1/$LABEL/mutation-stream.jsonl" \
                --record "mutation-shards/$slug/1/$LABEL/stryker-incremental.json" \
                --label "$LABEL" --details "$RUNNER_TEMP/run-reuse.md" --reason-file "$RUNNER_TEMP/run-reuse-reason") || {
                reuse=$(head -n 1 "$RUNNER_TEMP/run-reuse-reason")
                unreused="$unreused $LABEL"
                unreused_reason=${unreused_reason:-$reuse}
              }
              corepack pnpm exec stryker gate --baseline "$RUNNER_TEMP/accepted-none.json" < /dev/null || failed="$failed $LABEL"
            else
              failed="$failed $LABEL"
              # The CLI prints a bounded tail of a failed child; keep its full output and progress stream.
              mkdir -p "$RUNNER_TEMP/sfs-logs/$slug"
              mv "$log" "$RUNNER_TEMP/sfs-logs/$slug/stryker-run.log"
              [ ! -d "mutation-shards/$slug/1" ] || find "mutation-shards/$slug/1" -name mutation-stream.jsonl -exec cp --parents {} "$RUNNER_TEMP/sfs-logs/$slug/" \; || true
            fi
            echo "::endgroup::"
            outcome=gated; [ "$failed$unreused" = "$before" ] || outcome=failed
            echo "| $LABEL | $counts | $reuse | $outcome |" >> "$GITHUB_STEP_SUMMARY"
          done < <(echo "$PROJECTS" | jq -r '.[] | [.slug, .label, "\(.mutants) | \(.fresh) | \(.remembered) | \(.predicted)"] | @tsv')
          [ ! -f "$RUNNER_TEMP/run-reuse.md" ] || cat "$RUNNER_TEMP/run-reuse.md" >> "$GITHUB_STEP_SUMMARY"
          # The reuse code names the job only when no gate failed.
          if [ -z "$failed" ] && [ -n "$unreused" ]; then
            echo "$unreused_reason" > "$RUNNER_TEMP/sfs-reason"
          fi
          if [ -n "$failed$unreused" ]; then
            echo "::error::mutation failed for:$failed$unreused"
            exit 1
          fi
      - id: upload-merged
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-merged-batch-${{ matrix.batch.id }}
          path: ${{ inputs.working-directory }}/merged/
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true
      - id: upload-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-report-batch-${{ matrix.batch.id }}
          path: ${{ inputs.working-directory }}/mutation-reports/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
      - *summary
      - *wall

  report:
    name: Mutation report
    needs: [guard, plan, merge, batch]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - *start
      - *tools
      - *restore
      - name: Lay this run's merged incrementals over the restored ones
        id: lay
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-merged-*
          path: ${{ inputs.working-directory }}/.stryker-incremental
          merge-multiple: true
      - uses: actions/cache/save@v6
        id: save
        if: ${{ hashFiles(format('{0}/.stryker-incremental/**', inputs.working-directory)) != '' }}
        with:
          path: ${{ inputs.working-directory }}/.stryker-incremental
          key: stryker-incremental-${{ inputs.working-directory }}-${{ github.run_id }}

      # A job killed at its 60-minute timeout concludes `cancelled` and its own steps may never report, so this job
      # names every job of the run that concluded cancelled or timed out.
      - id: jobs
        name: Name the jobs that were cancelled or timed out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100"
          if ! gh api --paginate "$jobs" --jq '.jobs[] | [.name, .run_attempt, .started_at, .conclusion] | @tsv' \
            > "$RUNNER_TEMP/run-jobs.tsv" 2> "$RUNNER_TEMP/api.err"; then
            status=$(grep -oE 'HTTP [0-9]{3}' "$RUNNER_TEMP/api.err" | tail -n 1 || true)
            echo "::error title=mutation-api-failed::GET $jobs failed (${status:-no HTTP status}), so the jobs that did not succeed are not named."
            exit 1
          fi
          awk -F'\t' '$4 == "cancelled" || $4 == "timed_out" {print $1 "\t" $4}' "$RUNNER_TEMP/run-jobs.tsv" \
            | while IFS=$'\t' read -r name conclusion; do
              echo "::error title=mutation-job-${conclusion}::$name concluded $conclusion; a cancelled job either hit its 60-minute timeout or was cancelled by hand. Next: open it, then gh run rerun $GITHUB_RUN_ID -R $GITHUB_REPOSITORY --failed"
              echo "- \`$name\`: $conclusion" >> "$GITHUB_STEP_SUMMARY"
            done

      # Artifacts go only when every job of the run (plan, coverage, shard, merge, batch) concluded success in the
      # attempt it last ran in; any failure keeps them all for a re-run of its failed jobs, and they expire after a
      # day either way.
      - id: cleanup
        name: Delete per-shard artifacts (advisory, a failure only warns)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # Cleanup fails closed: any doubt keeps every artifact, and a failure warns instead of failing the run.
          trap 'echo "::warning title=mutation-api-failed::deleting this run'"'"'s per-shard artifacts failed; the rest expire after a day."' ERR
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100"
          if ! gh api --paginate "$jobs" --jq '.jobs[] | [.name, .run_attempt, .started_at, .conclusion] | @tsv' \
            > "$RUNNER_TEMP/run-jobs-all.tsv" 2> "$RUNNER_TEMP/api.err"; then
            status=$(grep -oE 'HTTP [0-9]{3}' "$RUNNER_TEMP/api.err" | tail -n 1 || true)
            echo "::warning title=mutation-api-failed::GET $jobs failed (${status:-no HTTP status}); keeping every artifact."
            exit 0
          fi
          if ! job-attempt --all-succeeded < "$RUNNER_TEMP/run-jobs-all.tsv"; then
            echo "Keeping every artifact: the run lists no jobs, or one did not conclude success in the attempt it last ran in."
            exit 0
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("mutation-shard-") or startswith("mutation-merged-") or startswith("mutation-coverage-")) | .id' \
          | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
      - if: failure() || cancelled()
        uses: $/.github/actions/failure-summary
        with:
          job: report
          reasons: |
            lay mutation-merge-failed
            save mutation-merge-failed
            jobs mutation-api-failed
          steps: ${{ toJSON(steps) }}
          reproduce: "gh workflow run Mutation -R ${{ github.repository }} --ref ${{ env.DEFAULT_BRANCH }} -f sha=${{ env.MUTATION_SHA }} (cost: the whole lane; the report job only reports the jobs before it)"
          reproduce-label: reproduce through a dispatch on main
      - *wall

  # The lane has no triage, so it writes each scheduled night's record itself and routes a red night
  # (compound-packs/ci-wall-clock/mutation-runs-nightly-on-main.md, Triggers, Routing and Green). A dispatch, a
  # reproduce included, writes no record and routes nothing.
  night:
    name: night · record and route
    needs: [guard, sfs-deps, plan, coverage, shard, merge, batch, report]
    if: ${{ always() && github.event_name == 'schedule' && needs.guard.result == 'success' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - *start
      - id: history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false
      - *tools
      - id: reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-report-*
          path: ${{ runner.temp }}/mutation-reports
      - id: night
        name: Write the night's record, then route a red night or print the green line
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          NEEDS: ${{ toJSON(needs) }}
          PLANNED: ${{ needs.plan.outputs.planned }}
        run: |
          file=${WORKFLOW_REF%@*}
          file=${file##*/}
          mkdir -p "$RUNNER_TEMP/mutation-night" "$RUNNER_TEMP/mutation-reports"
          mutation-night night --repo "$GITHUB_REPOSITORY" --workflow "$file" --branch "$DEFAULT_BRANCH" \
            --run "$GITHUB_RUN_ID" --sha "$MUTATION_SHA" --needs "$NEEDS" --planned "${PLANNED:-[]}" \
            --reports "$RUNNER_TEMP/mutation-reports" --out "$RUNNER_TEMP/mutation-night/night.json"
      - id: upload-night
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-night-${{ github.run_id }}
          path: ${{ runner.temp }}/mutation-night/night.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - if: failure() || cancelled()
        uses: $/.github/actions/failure-summary
        with:
          job: night
          reasons: |
            tools tools-ref-missing
            reports mutation-artifact-missing
            night mutation-night-failed
            upload-night mutation-night-failed
          steps: ${{ toJSON(steps) }}
