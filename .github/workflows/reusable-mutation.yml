name: Mutation (reusable)
on:
  workflow_call:
    inputs:
      tool:
        description: The mutation tool, `stryker` or `cargo-mutants`; only stryker is implemented, cargo-mutants fails at once
        required: true
        type: string
      mode:
        description: >-
          `diff` on a push to main: each package's mutants on lines changed since its base, the newest first-parent
          commit with a green `mutation/<pkg>` check. `full` once a week: every mutant, no incremental cache restored
        required: true
        type: string
      packages:
        description: JSON array of package directories, relative to the repository root, run one after another
        required: true
        type: string
      stryker:
        description: The Nix installable of the Stryker package, pinned to a release commit (`github:systemfsoftware/stryker-js-effect/<sha>#<attr>`)
        required: false
        type: string
        default: ""
      budget-seconds:
        description: A diff whose planned seconds exceed this is deferred to the weekly full run, with a neutral check
        required: false
        type: number
        default: 900
      timeout-minutes:
        description: Timeout of the mutation job
        required: false
        type: number
        default: 180
      runs-on:
        description: JSON label list of the mutation job's runner
        required: false
        type: string
        default: '["self-hosted", "mutation"]'
      upload-artifacts:
        description: Upload the merged mutation report as an artifact; false drops it for a quota incident, visibly by the run's inputs, never by swallowing the upload error
        required: false
        type: boolean
        default: true
    secrets:
      sfs-fetch-token:
        description: GitHub token Nix fetches `github:` flake inputs with in the dev-shell step, for inputs in private repositories; unset keeps the job's GITHUB_TOKEN
        required: false

permissions:
  contents: read

jobs:
  mutation:
    name: mutation · ${{ inputs.mode }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      checks: write
    steps:
      - id: guard
        name: Event, branch and tool are ones mutation runs on
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          TOOL: ${{ inputs.tool }}
          MODE: ${{ inputs.mode }}
          STRYKER: ${{ inputs.stryker }}
        run: |
          case "$EVENT" in
            push | schedule | workflow_dispatch) ;;
            *) echo "::error title=mutation-event::mutation runs on push, schedule or workflow_dispatch, never on $EVENT"; exit 1 ;;
          esac
          if [ "$REF" != "$DEFAULT_REF" ]; then
            echo "::error title=mutation-branch::mutation runs only on $DEFAULT_REF, not $REF"; exit 1
          fi
          case "$MODE" in diff | full) ;; *) echo "::error title=mutation-mode::mode must be diff or full, got '$MODE'"; exit 1 ;; esac
          case "$TOOL" in
            stryker)
              if [ -z "$STRYKER" ]; then echo "::error title=mutation-stryker::tool stryker needs the stryker input"; exit 1; fi ;;
            cargo-mutants)
              echo "::error title=mutation-tool-unimplemented::cargo-mutants is not implemented yet; only stryker runs"; exit 1 ;;
            *) echo "::error title=mutation-tool::tool must be stryker or cargo-mutants, got '$TOOL'"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - id: devshell
        uses: $/.github/actions/consumer-devshell
        with:
          sfs-fetch-token: ${{ secrets.sfs-fetch-token }}
      - id: install
        uses: $/.github/actions/install-deps
      - uses: $/.github/actions/sfs-tools
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - id: tool
        name: Stryker from its Nix package
        env:
          STRYKER: ${{ inputs.stryker }}
        run: |
          out="$(nix build --no-link --print-out-paths "$STRYKER")"
          echo "$out/bin" >> "$GITHUB_PATH"
          "$out/bin/stryker" --version

      # One path per package, never a `**` glob: actions/cache walks a `**` pattern through every followed
      # node_modules symlink, which took over seven minutes on the mutation runner for a run that saved nothing.
      - id: incremental
        name: Incremental report paths, one per package
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          {
            echo 'paths<<PATHS'
            deno eval 'for (const p of JSON.parse(Deno.env.get("PACKAGES"))) console.log(`${p}/reports/stryker-incremental.json`)'
            echo PATHS
          } >> "$GITHUB_OUTPUT"

      - name: Incremental cache (diff mode only)
        if: inputs.mode == 'diff'
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.incremental.outputs.paths }}
          key: mutation-incremental-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: mutation-incremental-

      - id: mutation
        name: Mutation, one package after another
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TOOL: ${{ inputs.tool }}
          MODE: ${{ inputs.mode }}
          PACKAGES: ${{ inputs.packages }}
          BUDGET: ${{ inputs.budget-seconds }}
        run: |
          mutation run --tool "$TOOL" --mode "$MODE" --packages "$PACKAGES" --commit "$GITHUB_SHA" \
            --budget-seconds "$BUDGET" --out "$RUNNER_TEMP/mutation-out"

      - name: git status after a failure
        if: failure()
        run: git status --porcelain --ignored

      - uses: actions/cache/save@v6
        if: success()
        with:
          path: ${{ steps.incremental.outputs.paths }}
          key: mutation-incremental-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && inputs.upload-artifacts
        with:
          name: mutation-report-${{ github.run_id }}
          path: ${{ runner.temp }}/mutation-out/*/merged/mutation.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove .stryker-tmp
        if: always()
        run: find . -name .stryker-tmp -type d -prune -exec rm -rf {} +
