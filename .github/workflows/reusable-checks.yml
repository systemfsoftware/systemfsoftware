name: Checks (reusable)

# The checks shape any pnpm workspace can call: plan -> lint lanes and packed test jobs -> timings record -> gate.
# A calling repository may supply `.github/actions/checks-lane`, a composite action with inputs `lane`, `job` and
# `profile`. Each job checks the repository out and calls it once per phase, with `lane` set to `plan`, a lint
# lane's id, `test`, `test-after`, `timings`, `gate`, or `docs` (a lane's docs command on a docs-only pull request,
# with the lane as `job`); a phase the action has no steps for does nothing. Without
# that action, or under a non-root `working-directory`, every phase runs the built-in lanes instead
# (`$/.github/actions/builtin-lane`). This workflow reaches its own actions through `$/`, never the caller's `./`.
on:
  workflow_call:
    outputs:
      lane-source:
        description: "`hook` when the caller's checks-lane action ran each phase, `built-in` otherwise"
        value: ${{ jobs.plan.outputs.lane-source || jobs.check.outputs.lane-source }}
      test-jobs:
        description: JSON list of the test jobs the plan scheduled, each with its `packages`; `[]` when every package was skipped
        value: ${{ jobs.plan.outputs.jobs }}
    inputs:
      working-directory:
        description: The pnpm workspace root, relative to the repository root. A non-root value checks out only that directory and always runs the built-in lanes
        required: false
        type: string
        default: .
      profile:
        description: Passed to the checks-lane action unchanged; systemfsoftware's conformance profile (`local` or `per-change`)
        required: false
        type: string
        default: per-change
      record:
        description: Name of the timing record artifact the plan reads and the timings job writes
        required: false
        type: string
        default: test-timings
      timings:
        description: Command that runs the test-timings planner (the flake's `test-timings`, or a deno invocation of the script). With the built-in lanes, `test-timings` is this workflow's own planner
        required: false
        type: string
        default: test-timings
      runs-on:
        description: JSON label list for the plan, timings and gate jobs
        required: false
        type: string
        default: '["ubuntu-latest"]'
      test-runs-on:
        description: JSON label list for the test jobs and any lint lane that names none; empty means `runs-on`
        required: false
        type: string
        default: ""
      lanes:
        description: 'JSON list of lint lanes: {"id", "name", "timeout-minutes", "run"?, "docs-run"?, "fetch-depth"?, "runs-on"?}; `run` is a command after the lane''s action. On a docs-only pull request a lane with `docs-run` runs that command after the `docs` phase instead, and a lane without one is skipped'
        required: false
        type: string
        default: "[]"
      target:
        description: Planner --target, seconds of predicted work per job
        required: false
        type: number
        default: 300
      max-jobs:
        description: Planner --max-jobs
        required: false
        type: number
        default: 12
      max-seconds:
        description: Planner --max-seconds; keep it at or under the test job's timeout-minutes in seconds
        required: false
        type: number
        default: 1800
      timeout-minutes:
        description: Each test job's timeout
        required: false
        type: number
        default: 30
      plan-timeout-minutes:
        description: The plan and timings jobs' timeout
        required: false
        type: number
        default: 5
      gate-name:
        description: Name of the job that passes only when every other job passed
        required: false
        type: string
        default: the gate
      gate-lane:
        description: Check out and run the checks-lane action's `gate` phase after the gate's own check
        required: false
        type: boolean
        default: false
      gate-timeout-minutes:
        description: The gate job's timeout
        required: false
        type: number
        default: 2
      node-options:
        description: NODE_OPTIONS for the test jobs (a lint lane sets its own `node-options`); GitHub refuses it from $GITHUB_ENV
        required: false
        type: string
        default: ""
      pnpm:
        description: How the test steps invoke pnpm
        required: false
        type: string
        default: pnpm
      test-flags:
        description: Extra flags on the packed jobs' `turbo run test`
        required: false
        type: string
        default: ""
      shard-flags:
        description: Extra flags on a shard job's vitest run
        required: false
        type: string
        default: ""
      persist-credentials:
        description: actions/checkout persist-credentials
        required: false
        type: boolean
        default: true
      fetch-tags:
        description: actions/checkout fetch-tags
        required: false
        type: boolean
        default: false
      dry-run:
        description: Command printing turbo's `--dry=json` for the test task without `--only` (e.g. `pnpm dlx turbo@2 run test --dry=json`), so each hash covers the task's dependencies as the test jobs' own keys do; the plan skips a package whose task is a remote cache hit, or which last passed whole on the same dry-run hash. Empty plans every package, except that the built-in lanes default it to `<pnpm> exec turbo run test --dry=json` on a pull request
        required: false
        type: string
        default: ""
      docs-globs:
        description: Newline- or comma-separated globs that replace the docs set (`docs/**`, root `*.md`, `**/AGENTS.md`, `**/CLAUDE.md`). A pull request that changes only docs skips the test and timings jobs and runs only lanes with a `docs-run`; the plan still runs
        required: false
        type: string
        default: ""
      turbo-team:
        description: Remote Turbo cache team; empty leaves the remote cache off
        required: false
        type: string
        default: ""
      sfs-deps-installable:
        description: Flake installable, evaluated in `working-directory`, whose output is the `.tgz` files pnpm-lock.yaml names under `file:.sfs-deps/`. Built at most once per call and cached under the recorded integrities; unused when the lockfile names no such tarball
        required: false
        type: string
        default: .#sfs-deps
      sfs-deps-runs-on:
        description: JSON runner labels for the `sfs-deps` producer job; empty uses `runs-on`. A cold producer builds the flake installable, so a caller with small default runners can give it a larger machine without moving plan, classify and the gate
        required: false
        type: string
        default: ""
      single-job:
        description: >-
          One job for a run with one lint lane and no planned tests. The job that carries `gate-name` checks out once and
          runs, as steps, the diff classifier, the `.sfs-deps` restore, the plan phase, the lane and the 'Every lane passed'
          result; classify, plan, lanes, test and timings are skipped, so a pull request boots two runners (the
          producer's and this one) instead of six. `lanes` must name exactly one well-formed lane (a lane's `runs-on`
          sizes the job, its `node-options` apply to it) and `gate-lane` is ignored. The `.sfs-deps` producer stays its
          own job, since it alone holds the private-repo fetch token. The plan phase (the hook's, then the planner) runs
          in the job, and the job fails if it schedules any test job, so tests are never dropped; the timing record is
          not fetched or written. A caller sets it per event (true on a pull request, say) and keeps the full fan-out
          for runs that plan tests
        required: false
        type: boolean
        default: false
    secrets:
      turbo-api:
        description: Remote Turbo cache API URL
        required: false
      turbo-token:
        description: Remote Turbo cache token
        required: false
      sfs-fetch-token:
        description: GitHub token Nix fetches `github:` flake inputs with in the `sfs-deps` job, for inputs in private repositories; unset keeps the job's GITHUB_TOKEN
        required: false

permissions:
  contents: read
  actions: read

env:
  TIMINGS: ${{ inputs.timings }}

jobs:
  classify:
    name: classify · docs-only or full
    # single-job: the `check` job classifies in its own steps. plan, sfs-deps, lanes, test and timings all need
    # classify, so each of them skips with it.
    if: ${{ !inputs.single-job }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.plan-timeout-minutes }}
    outputs:
      scope: ${{ steps.diff.outputs.scope }}
      lanes: ${{ steps.lanes.outputs.lanes }}
      sfs-deps-none: ${{ steps.demand.outcome == 'success' && steps.demand.outputs.key == '' }}
    steps:
      - id: diff
        uses: $/.github/actions/classify-diff
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          docs-globs: ${{ inputs.docs-globs }}
      - id: lanes
        name: Lanes this diff runs
        env:
          SCOPE: ${{ steps.diff.outputs.scope }}
          LANES: ${{ inputs.lanes }}
        run: |
          if [ "$SCOPE" = docs-only ]; then
            filter='[.[] | select(.["docs-run"]) | . + {phase: "docs", run: .["docs-run"]}]'
          else
            filter='[.[] | . + {phase: .id}]'
          fi
          echo "lanes=$(jq -c "$filter" <<< "$LANES")" >> "$GITHUB_OUTPUT"
      # A docs-only diff still runs the sfs-deps producer when the lockfile names .sfs-deps/ tarballs, since the
      # built-in docs phase installs. Any doubt (no tools, no lockfile, a refused lockfile) leaves it running.
      - name: The lockfile alone, on a docs-only diff
        if: steps.diff.outputs.scope == 'docs-only'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .sfs-lockfile
          persist-credentials: false
          sparse-checkout: ${{ inputs.working-directory != '.' && format('/{0}/pnpm-lock.yaml', inputs.working-directory) || '/pnpm-lock.yaml' }}
          sparse-checkout-cone-mode: false
      - id: demand
        name: Tarballs the lockfile names
        if: steps.diff.outputs.scope == 'docs-only'
        continue-on-error: true
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: sfs-deps key --working-directory ".sfs-lockfile/$WORKING_DIRECTORY"
      - if: failure()
        uses: $/.github/actions/failure-summary
        with:
          job: classify
          reasons: |
            diff classify-failed
            lanes classify-failed
          steps: ${{ toJSON(steps) }}
          reproduce: gh run view ${{ github.run_id }} --log-failed

  plan:
    name: plan · test jobs from recorded timings
    needs: [classify, sfs-deps]
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.sfs-deps.result != 'failure' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.plan-timeout-minutes }}
    defaults: &defaults
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      lane-source: ${{ steps.mode.outputs.source }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ inputs.persist-credentials }}
          fetch-tags: ${{ inputs.fetch-tags }}
          sparse-checkout: ${{ inputs.working-directory != '.' && format('/{0}/', inputs.working-directory) || '' }}
          sparse-checkout-cone-mode: false
      - &turbo
        name: Remote Turbo cache
        if: inputs.turbo-team != ''
        env:
          TEAM: ${{ inputs.turbo-team }}
          API: ${{ secrets.turbo-api }}
          TOKEN: ${{ secrets.turbo-token }}
        run: printf 'TURBO_TEAM=%s\nTURBO_API=%s\nTURBO_TOKEN=%s\n' "$TEAM" "$API" "$TOKEN" >> "$GITHUB_ENV"
      # Before the hook-or-built-in routing, so a hook's own install finds the tarballs in place.
      - &sfs-deps
        id: sfs-deps
        uses: $/.github/actions/sfs-deps-restore
        with:
          key: ${{ needs.sfs-deps.outputs.key }}
          working-directory: ${{ inputs.working-directory }}
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - &mode
        id: mode
        name: Lane hook or built-in lanes
        if: always()
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          HOOK: ${{ hashFiles('.github/actions/checks-lane/action.yml') != '' }}
          DRY_RUN: ${{ needs.classify.outputs.scope != 'docs-only' && inputs.dry-run || '' }}
          SCOPE: ${{ needs.classify.outputs.scope }}
          PNPM: ${{ inputs.pnpm }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$WORKING_DIRECTORY" != . ]; then
            source=built-in reason=hook-not-visible-working-directory
          elif [ "$HOOK" = true ]; then
            source=hook reason=
          else
            source=built-in reason=
          fi
          if [ -z "$DRY_RUN" ] && [ "$source" = built-in ] && [ "$EVENT" = pull_request ] && [ "$SCOPE" != docs-only ]; then
            DRY_RUN="$PNPM exec turbo run test --dry=json"
          fi
          printf 'source=%s\nreason=%s\ndry-run=%s\n' "$source" "$reason" "$DRY_RUN" >> "$GITHUB_OUTPUT"
      - if: steps.mode.outputs.source == 'built-in' && inputs.timings == 'test-timings'
        uses: $/.github/actions/sfs-tools
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - id: hook
        uses: ./.github/actions/checks-lane
        if: steps.mode.outputs.source == 'hook'
        with:
          lane: plan
          profile: ${{ inputs.profile }}
      - id: builtin
        uses: $/.github/actions/builtin-lane
        if: steps.mode.outputs.source == 'built-in'
        with:
          lane: plan
          working-directory: ${{ inputs.working-directory }}
          install: ${{ steps.mode.outputs.dry-run != '' }}
      - name: Which lanes ran
        env:
          SOURCE: ${{ steps.mode.outputs.source }}
          REASON: ${{ steps.mode.outputs.reason }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          if [ "$SOURCE" = hook ]; then
            echo '### Lanes: lane hook (`.github/actions/checks-lane`)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Lanes: built-in lanes' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$REASON" = hook-not-visible-working-directory ]; then
            {
              echo "- reason: \`$REASON\`: \`working-directory: $WORKING_DIRECTORY\` checks out only that directory, so no \`.github/actions/checks-lane\` hook is visible and the built-in lanes ran."
              echo "- next action: none if the built-in lanes are what this workspace wants; to run a hook, call with \`working-directory: .\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=$REASON::working-directory $WORKING_DIRECTORY hides the checks-lane hook; the built-in lanes ran"
          fi
      - name: Latest timing record, main's first
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD: ${{ inputs.record }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          mkdir -p .timings/previous
          if ! { gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$RECORD&per_page=100" > .timings/listing.json &&
            id=$($TIMINGS latest --listing .timings/listing.json --branch "$BRANCH"); }; then
            echo "::warning::listing the $RECORD artifacts failed; planning with no previous record"
            id=
          fi
          if [ -n "$id" ] && ! { gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > .timings/previous.zip &&
            unzip -o -q .timings/previous.zip -d .timings/previous; }; then
            echo "::warning::fetching record artifact $id failed; planning with no previous record"
            rm -rf .timings/previous && mkdir -p .timings/previous
          fi
          echo "record artifact: ${id:-none}"
          ls .timings/previous
      - name: Every ref's recent passes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .timings/passes
          [ -f .timings/listing.json ] && ids=$($TIMINGS recent --listing .timings/listing.json --count 30) || ids=
          for id in $ids; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > ".timings/passes/$id.zip" &&
              unzip -o -q ".timings/passes/$id.zip" -d ".timings/passes/$id" || echo "::warning::fetching record artifact $id failed"
            rm -f ".timings/passes/$id.zip"
          done
      - name: Which test tasks the cache already holds
        if: steps.mode.outputs.dry-run != ''
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry-run }}
        run: |
          if ! $DRY_RUN > .timings/dry.json; then
            echo "::warning::the turbo dry run failed; planning every package"
            rm -f .timings/dry.json
          fi
      - id: plan
        run: |
          mkdir -p "$RUNNER_TEMP/sfs-logs"
          set -o pipefail
          $TIMINGS plan $( [ -f .timings/dry.json ] && echo --dry .timings/dry.json ) --target ${{ inputs.target }} --max-jobs ${{ inputs.max-jobs }} --max-seconds ${{ inputs.max-seconds }} --record .timings/previous/test-timings.json --passes .timings/passes 2>&1 | tee "$RUNNER_TEMP/sfs-logs/plan.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: test-timings-previous
          path: ${{ inputs.working-directory }}/.timings/previous/
          if-no-files-found: ignore
          retention-days: 1
      - if: failure()
        uses: $/.github/actions/failure-summary
        with:
          job: plan
          reasons: |
            hook hook-failed
            sfs-deps sfs-deps-missing
            builtin plan-failed
            plan plan-failed
          steps: ${{ toJSON(steps) }}
          reproduce: ${{ steps.mode.outputs.source == 'built-in' && inputs.timings == 'test-timings' && format('nix run github:{0}/{1}#test-timings -- plan', job.workflow_repository, job.workflow_sha) || format('{0} plan', inputs.timings) }}
          working-directory: ${{ inputs.working-directory }}

  sfs-deps:
    name: sfs-deps · tarballs the lockfile names
    needs: classify
    # single-job: classify is skipped, so the job runs on its own and the lane job only restores what it produced.
    if: ${{ !cancelled() && (inputs.single-job || (needs.classify.result == 'success' && (needs.classify.outputs.scope != 'docs-only' || needs.classify.outputs.sfs-deps-none != 'true'))) }}
    runs-on: ${{ fromJSON(inputs.sfs-deps-runs-on || inputs.runs-on) }}
    timeout-minutes: 60
    defaults: *defaults
    outputs:
      key: ${{ steps.produce.outputs.key }}
    steps:
      - *checkout
      - uses: $/.github/actions/sfs-fetch-auth
        with:
          sfs-fetch-token: ${{ secrets.sfs-fetch-token }}
      - id: produce
        uses: $/.github/actions/sfs-deps
        with:
          working-directory: ${{ inputs.working-directory }}
          installable: ${{ inputs.sfs-deps-installable }}
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - if: failure()
        uses: $/.github/actions/failure-summary
        with:
          job: sfs-deps
          reasons: ""
          steps: ${{ toJSON(steps) }}
          reproduce: nix build -L ${{ inputs.sfs-deps-installable }}
          working-directory: ${{ inputs.working-directory }}
      - if: always()
        uses: $/.github/actions/sfs-fetch-auth
        with:
          sfs-fetch-token: ${{ secrets.sfs-fetch-token }}
          remove: true

  lanes:
    name: ${{ matrix.lane.name }}
    needs: [classify, sfs-deps]
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.sfs-deps.result != 'failure' && needs.classify.outputs.lanes != '[]' }}
    runs-on: ${{ matrix.lane.runs-on || fromJSON(inputs.test-runs-on || inputs.runs-on) }}
    timeout-minutes: ${{ matrix.lane.timeout-minutes }}
    defaults: *defaults
    env:
      NODE_OPTIONS: ${{ matrix.lane.node-options }}
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.classify.outputs.lanes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.lane.fetch-depth || 1 }}
          persist-credentials: ${{ inputs.persist-credentials }}
          fetch-tags: ${{ inputs.fetch-tags }}
          sparse-checkout: ${{ inputs.working-directory != '.' && format('/{0}/', inputs.working-directory) || '' }}
          sparse-checkout-cone-mode: false
      - *turbo
      - *sfs-deps
      - *mode
      - id: hook
        uses: ./.github/actions/checks-lane
        if: steps.mode.outputs.source == 'hook'
        with:
          lane: ${{ matrix.lane.phase }}
          job: ${{ toJSON(matrix.lane) }}
          profile: ${{ inputs.profile }}
      - id: builtin
        uses: $/.github/actions/builtin-lane
        if: steps.mode.outputs.source == 'built-in'
        with:
          lane: ${{ matrix.lane.phase }}
          working-directory: ${{ inputs.working-directory }}
      - id: run
        name: ${{ matrix.lane.name }}
        if: matrix.lane.run
        env:
          RUN: ${{ matrix.lane.run }}
          LOG: ${{ matrix.lane.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/sfs-logs"
          set +e
          bash -e -c "$RUN" 2>&1 | tee "$RUNNER_TEMP/sfs-logs/$LOG.log"
          exit "${PIPESTATUS[0]}"
      - if: failure()
        uses: $/.github/actions/failure-summary
        with:
          job: lane-${{ matrix.lane.id }}
          reasons: |
            hook hook-failed
            sfs-deps sfs-deps-missing
            builtin lane-failed
            run lane-failed
          steps: ${{ toJSON(steps) }}
          reproduce: ${{ matrix.lane.run || format('the {0} phase of .github/actions/checks-lane', matrix.lane.phase) }}
          working-directory: ${{ inputs.working-directory }}

  test:
    name: test · ${{ matrix.job.name }}
    needs: [classify, plan, sfs-deps]
    if: needs.classify.outputs.scope != 'docs-only' && needs.plan.outputs.jobs != '[]'
    runs-on: ${{ fromJSON(inputs.test-runs-on || inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults: *defaults
    env:
      NODE_OPTIONS: ${{ inputs.node-options }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - *checkout
      - *turbo
      - *sfs-deps
      - *mode
      - id: hook
        uses: ./.github/actions/checks-lane
        if: steps.mode.outputs.source == 'hook'
        with:
          lane: test
          job: ${{ toJSON(matrix.job) }}
          profile: ${{ inputs.profile }}
      - id: builtin
        uses: $/.github/actions/builtin-lane
        if: steps.mode.outputs.source == 'built-in'
        with:
          lane: test
          job: ${{ toJSON(matrix.job) }}
          working-directory: ${{ inputs.working-directory }}
      - id: test
        name: Test
        if: matrix.job.shard == null
        env:
          PNPM: ${{ inputs.pnpm }}
          TEST_FLAGS: ${{ inputs.test-flags }}
          FILTERS: ${{ matrix.job.filters }}
        run: |
          mkdir -p "$RUNNER_TEMP/sfs-logs"
          set -o pipefail
          $PNPM exec turbo run test --concurrency=1 --continue --summarize $TEST_FLAGS $FILTERS 2>&1 | tee "$RUNNER_TEMP/sfs-logs/test.log"
      - name: Test shard
        id: shard
        if: matrix.job.shard != null
        env:
          PNPM: ${{ inputs.pnpm }}
          SHARD_FLAGS: ${{ inputs.shard-flags }}
          PACKAGE: ${{ matrix.job.shard.package }}
          SHARD: ${{ matrix.job.shard.index }}/${{ matrix.job.shard.count }}
        run: |
          mkdir -p "$RUNNER_TEMP/sfs-logs"
          set -o pipefail
          start=$SECONDS
          code=0
          $PNPM --filter "$PACKAGE" test --shard="$SHARD" --passWithNoTests $SHARD_FLAGS 2>&1 | tee "$RUNNER_TEMP/sfs-logs/test.log" || code=$?
          echo "seconds=$((SECONDS - start))" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Record timings
        if: always()
        env:
          JOB_ID: ${{ matrix.job.id }}
          PACKAGE: ${{ matrix.job.shard.package }}
          SHARD: ${{ matrix.job.shard.index }}/${{ matrix.job.shard.count }}
          SECONDS_TAKEN: ${{ steps.shard.outputs.seconds }}
          EXIT_CODE: ${{ steps.shard.outputs.code }}
        run: |
          mkdir -p .timings
          if [ -n "$SECONDS_TAKEN" ]; then
            printf '{"package":"%s","shard":"%s","seconds":"%s","exit":"%s"}' \
              "$PACKAGE" "$SHARD" "$SECONDS_TAKEN" "$EXIT_CODE" > ".timings/$JOB_ID.json"
          else
            summary=$(ls -t .turbo/runs/*.json 2>/dev/null | head -n 1)
            if [ -n "$summary" ]; then cp "$summary" ".timings/$JOB_ID.json"; fi
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        if: always()
        with:
          name: test-timings-part-${{ matrix.job.id }}
          path: ${{ inputs.working-directory }}/.timings/${{ matrix.job.id }}.json
          if-no-files-found: ignore
          retention-days: 1
      - id: hook-after
        uses: ./.github/actions/checks-lane
        if: ${{ !cancelled() && steps.mode.outputs.source == 'hook' }}
        with:
          lane: test-after
          job: ${{ toJSON(matrix.job) }}
          profile: ${{ inputs.profile }}
      - uses: $/.github/actions/builtin-lane
        if: ${{ !cancelled() && steps.mode.outputs.source == 'built-in' }}
        with:
          lane: test-after
          job: ${{ toJSON(matrix.job) }}
          working-directory: ${{ inputs.working-directory }}
      - if: failure()
        uses: $/.github/actions/failure-summary
        with:
          job: test-${{ matrix.job.id }}
          reasons: |
            hook hook-failed
            sfs-deps sfs-deps-missing
            builtin build-failed
            test test-failed
            shard test-failed
            hook-after hook-failed
          steps: ${{ toJSON(steps) }}
          reproduce: ${{ matrix.job.shard == null && format('{0} {1} test', inputs.pnpm, matrix.job.filters) || format('{0} --filter {1} test --shard={2}/{3}', inputs.pnpm, matrix.job.shard.package, matrix.job.shard.index, matrix.job.shard.count) }}
          working-directory: ${{ inputs.working-directory }}

  timings:
    name: record test timings
    needs: [classify, plan, test]
    if: ${{ always() && needs.plan.result == 'success' && needs.classify.outputs.scope != 'docs-only' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.plan-timeout-minutes }}
    defaults: *defaults
    steps:
      # Every step runs under always(): a run cancelled by a newer push still records the passes its test jobs made.
      - if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ inputs.persist-credentials }}
          fetch-tags: ${{ inputs.fetch-tags }}
          sparse-checkout: ${{ inputs.working-directory != '.' && format('/{0}/', inputs.working-directory) || '' }}
          sparse-checkout-cone-mode: false
      - *mode
      - if: always() && steps.mode.outputs.source == 'built-in' && inputs.timings == 'test-timings'
        uses: $/.github/actions/sfs-tools
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - uses: ./.github/actions/checks-lane
        if: always() && steps.mode.outputs.source == 'hook'
        with:
          lane: timings
          profile: ${{ inputs.profile }}
      - uses: $/.github/actions/builtin-lane
        if: always() && steps.mode.outputs.source == 'built-in'
        with:
          lane: timings
          working-directory: ${{ inputs.working-directory }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 3
        if: always() && needs.test.result != 'skipped'
        with:
          pattern: test-timings-part-*
          path: ${{ inputs.working-directory }}/.timings/raw
          merge-multiple: true
      - id: part
        name: Each job's measurements as a part
        if: always()
        run: |
          mkdir -p .timings/raw .timings/parts
          for raw in .timings/raw/*.json; do
            [ -e "$raw" ] || continue
            job=$(basename "$raw" .json)
            $TIMINGS part --job "$job" --raw "$raw" --out ".timings/parts/$job.json"
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 3
        if: always()
        continue-on-error: true
        with:
          name: test-timings-previous
          path: ${{ inputs.working-directory }}/.timings/previous
      - id: merge
        name: Merge this run into the record
        if: always()
        env:
          PLAN: ${{ needs.plan.outputs.jobs }}
        run: |
          printf '%s' "$PLAN" > .timings/plan.json
          $TIMINGS merge --target ${{ inputs.target }} --previous .timings/previous/test-timings.json --parts .timings/parts \
            --plan .timings/plan.json --out .timings/test-timings.json --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        if: always()
        with:
          name: ${{ inputs.record }}
          path: ${{ inputs.working-directory }}/.timings/test-timings.json
          retention-days: 30
      - if: failure()
        uses: $/.github/actions/failure-summary
        with:
          job: timings
          reasons: |
            part timings-failed
            merge timings-failed
          steps: ${{ toJSON(steps) }}
          reproduce: ${{ format('{0} merge --previous test-timings.json --parts parts/ --out test-timings.json', inputs.timings) }}
          working-directory: ${{ inputs.working-directory }}

  check:
    name: ${{ inputs.gate-name }}
    needs: [classify, sfs-deps, plan, lanes, test]
    if: ${{ always() }}
    # single-job: this job is the lane's box (its `runs-on`, else the test jobs' labels) and gets its timeout.
    runs-on: ${{ inputs.single-job && (fromJSON(inputs.lanes)[0].runs-on || fromJSON(inputs.test-runs-on || inputs.runs-on)) || fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.single-job && fromJSON(inputs.lanes)[0].timeout-minutes || inputs.gate-timeout-minutes }}
    outputs:
      lane-source: ${{ steps.single-mode.outputs.source }}
    steps:
      # Single-job mode. The steps run in the order the jobs ran, on one checkout. They stay in this job so there is one
      # job id and one check run named `gate-name`, which a ruleset or Mergify may require. The sfs-deps producer is
      # not among them: it holds the private-repo fetch token, so it stays its own job, and this job only restores.
      - name: One lane
        if: inputs.single-job
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ fromJSON(inputs.lanes)[0].fetch-depth || 1 }}
          persist-credentials: ${{ inputs.persist-credentials }}
          fetch-tags: ${{ inputs.fetch-tags }}
          sparse-checkout: ${{ inputs.working-directory != '.' && format('/{0}/', inputs.working-directory) || '' }}
          sparse-checkout-cone-mode: false
      - id: single-diff
        if: inputs.single-job
        uses: $/.github/actions/classify-diff
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          docs-globs: ${{ inputs.docs-globs }}
      - id: single-lane
        name: The lane this diff runs
        if: inputs.single-job
        env:
          SCOPE: ${{ steps.single-diff.outputs.scope }}
          LANES: ${{ inputs.lanes }}
        run: |
          valid='type == "array" and length == 1 and (.[0] | type == "object"
            and (.id | type == "string" and length > 0) and (.name | type == "string" and length > 0)
            and (.["timeout-minutes"] | type == "number" and . > 0)
            and ((.run // "") | type == "string") and ((.["docs-run"] // "") | type == "string"))'
          if ! jq -e "$valid" <<< "$LANES" > /dev/null; then
            mkdir -p "$RUNNER_TEMP/sfs-logs"
            echo classify-failed > "$RUNNER_TEMP/sfs-reason"
            echo "::error title=single-job-needs-one-lane::single-job runs exactly one well-formed lane (id, name, timeout-minutes; run and docs-run strings); lanes is not that"
            exit 1
          fi
          if [ "$SCOPE" = docs-only ]; then
            filter='[.[] | select(.["docs-run"]) | . + {phase: "docs", run: .["docs-run"]}]'
          else
            filter='[.[] | . + {phase: .id}]'
          fi
          echo "lane=$(jq -c "$filter | .[0] // empty" <<< "$LANES")" >> "$GITHUB_OUTPUT"
      - name: Remote Turbo cache
        if: inputs.single-job && inputs.turbo-team != ''
        env:
          TEAM: ${{ inputs.turbo-team }}
          API: ${{ secrets.turbo-api }}
          TOKEN: ${{ secrets.turbo-token }}
        run: printf 'TURBO_TEAM=%s\nTURBO_API=%s\nTURBO_TOKEN=%s\n' "$TEAM" "$API" "$TOKEN" >> "$GITHUB_ENV"
      # The sfs-deps job produced the tarballs under the fetch token; this job never holds it.
      - id: single-producer
        name: The producer job passed
        if: inputs.single-job
        env:
          PRODUCER: ${{ needs.sfs-deps.result }}
        run: |
          if [ "$PRODUCER" != success ]; then
            mkdir -p "$RUNNER_TEMP/sfs-logs"
            echo sfs-deps-missing > "$RUNNER_TEMP/sfs-reason"
            echo "::error title=sfs-deps-missing::the sfs-deps job finished $PRODUCER, so the tarballs the lockfile names are not in the cache"
            exit 1
          fi
      - id: single-restore
        if: inputs.single-job
        uses: $/.github/actions/sfs-deps-restore
        with:
          key: ${{ needs.sfs-deps.outputs.key }}
          working-directory: ${{ inputs.working-directory }}
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - id: single-mode
        name: Lane hook or built-in lanes
        if: inputs.single-job
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          HOOK: ${{ hashFiles('.github/actions/checks-lane/action.yml') != '' }}
          DRY_RUN: ${{ steps.single-diff.outputs.scope != 'docs-only' && inputs.dry-run || '' }}
          SCOPE: ${{ steps.single-diff.outputs.scope }}
          PNPM: ${{ inputs.pnpm }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$WORKING_DIRECTORY" != . ]; then source=built-in
          elif [ "$HOOK" = true ]; then source=hook
          else source=built-in; fi
          if [ -z "$DRY_RUN" ] && [ "$source" = built-in ] && [ "$EVENT" = pull_request ] && [ "$SCOPE" != docs-only ]; then
            DRY_RUN="$PNPM exec turbo run test --dry=json"
          fi
          printf 'source=%s\ndry-run=%s\n' "$source" "$DRY_RUN" >> "$GITHUB_OUTPUT"
      # The plan phase, as the plan job runs it (the hook's plan steps, the built-in plan, then the planner), so checks a
      # hook places in the plan phase still run. No timing record is fetched: whether any test job is planned depends
      # on the packages with a test script and the dry run's cache hits, not on the record.
      - if: inputs.single-job && steps.single-mode.outputs.source == 'built-in' && inputs.timings == 'test-timings'
        uses: $/.github/actions/sfs-tools
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - id: single-hook-plan
        if: inputs.single-job && steps.single-mode.outputs.source == 'hook'
        uses: ./.github/actions/checks-lane
        with:
          lane: plan
          profile: ${{ inputs.profile }}
      - id: single-builtin-plan
        if: inputs.single-job && steps.single-mode.outputs.source == 'built-in'
        uses: $/.github/actions/builtin-lane
        with:
          lane: plan
          working-directory: ${{ inputs.working-directory }}
          install: ${{ steps.single-mode.outputs.dry-run != '' }}
      - name: Which test tasks the cache already holds
        if: inputs.single-job && steps.single-mode.outputs.dry-run != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          DRY_RUN: ${{ steps.single-mode.outputs.dry-run }}
        run: |
          mkdir -p .timings
          if ! $DRY_RUN > .timings/dry.json; then
            echo "::warning::the turbo dry run failed; planning every package"
            rm -f .timings/dry.json
          fi
      - id: single-plan
        name: Plan the test jobs
        if: inputs.single-job
        working-directory: ${{ inputs.working-directory }}
        run: |
          mkdir -p .timings/previous .timings/passes "$RUNNER_TEMP/sfs-logs"
          set -o pipefail
          dry=()
          if [ -f .timings/dry.json ]; then dry=(--dry .timings/dry.json); fi
          $TIMINGS plan "${dry[@]}" --target ${{ inputs.target }} --max-jobs ${{ inputs.max-jobs }} --max-seconds ${{ inputs.max-seconds }} --record .timings/previous/test-timings.json --passes .timings/passes 2>&1 | tee "$RUNNER_TEMP/sfs-logs/plan.log"
      # The test and timings jobs are skipped in this mode, so a plan that schedules any test job must fail here.
      - id: single-planned
        name: No test jobs are planned
        if: inputs.single-job
        env:
          PLANNED: ${{ steps.single-plan.outputs.jobs }}
        run: |
          if ! jq -e 'type == "array" and length == 0' <<< "$PLANNED" > /dev/null; then
            mkdir -p "$RUNNER_TEMP/sfs-logs"
            echo plan-failed > "$RUNNER_TEMP/sfs-reason"
            echo "::error title=single-job-plans-tests::single-job skips the test jobs, but the plan is '${PLANNED:-missing}', not []; call without single-job for a run that plans tests"
            exit 1
          fi
      - id: single-hook
        if: inputs.single-job && steps.single-lane.outputs.lane != '' && steps.single-mode.outputs.source == 'hook'
        uses: ./.github/actions/checks-lane
        env:
          NODE_OPTIONS: ${{ fromJSON(inputs.lanes)[0].node-options }}
        with:
          lane: ${{ fromJSON(steps.single-lane.outputs.lane).phase }}
          job: ${{ steps.single-lane.outputs.lane }}
          profile: ${{ inputs.profile }}
      - id: single-builtin
        if: inputs.single-job && steps.single-lane.outputs.lane != '' && steps.single-mode.outputs.source == 'built-in'
        uses: $/.github/actions/builtin-lane
        env:
          NODE_OPTIONS: ${{ fromJSON(inputs.lanes)[0].node-options }}
        with:
          lane: ${{ fromJSON(steps.single-lane.outputs.lane).phase }}
          working-directory: ${{ inputs.working-directory }}
      - id: single-run
        name: ${{ fromJSON(inputs.lanes)[0].name }}
        if: inputs.single-job && fromJSON(steps.single-lane.outputs.lane || '{}').run
        working-directory: ${{ inputs.working-directory }}
        env:
          RUN: ${{ fromJSON(steps.single-lane.outputs.lane || '{}').run }}
          LOG: ${{ fromJSON(inputs.lanes)[0].id }}
          NODE_OPTIONS: ${{ fromJSON(inputs.lanes)[0].node-options }}
        run: |
          mkdir -p "$RUNNER_TEMP/sfs-logs"
          set +e
          bash -e -c "$RUN" 2>&1 | tee "$RUNNER_TEMP/sfs-logs/$LOG.log"
          exit "${PIPESTATUS[0]}"
      # Reached only when every step above passed, so the job's own result is the verdict. A lane the classifier
      # dropped (a docs-only diff with no `docs-run`) has nothing to run and passes; any other empty lane is a failure.
      - name: Every lane passed
        if: inputs.single-job
        env:
          SCOPE: ${{ steps.single-diff.outputs.scope }}
          LANE: ${{ steps.single-lane.outputs.lane }}
        run: |
          if [ -z "$SCOPE" ] || { [ -z "$LANE" ] && [ "$SCOPE" != docs-only ]; }; then
            echo "::error title=single-job-ran-nothing::scope='$SCOPE' lane='$LANE': no lane ran, which only a docs-only diff may do"
            exit 1
          fi
          echo "scope=$SCOPE lane-ran=$([ -n "$LANE" ] && echo true || echo false)"
      - if: failure() && inputs.single-job
        uses: $/.github/actions/failure-summary
        with:
          job: lane-${{ fromJSON(inputs.lanes)[0].id }}
          reasons: |
            single-diff classify-failed
            single-lane classify-failed
            single-producer sfs-deps-missing
            single-restore sfs-deps-missing
            single-hook-plan hook-failed
            single-builtin-plan plan-failed
            single-plan plan-failed
            single-planned plan-failed
            single-hook hook-failed
            single-builtin lane-failed
            single-run lane-failed
          steps: ${{ toJSON(steps) }}
          reproduce: ${{ fromJSON(steps.single-lane.outputs.lane || '{}').run || format('the {0} phase of .github/actions/checks-lane', fromJSON(inputs.lanes)[0].id) }}
          working-directory: ${{ inputs.working-directory }}
      # A skipped job passes only when the classifier or the plan said there was nothing for it to run.
      - id: every
        name: Every lane passed
        if: inputs.single-job != true
        env:
          CLASSIFY: ${{ needs.classify.result }}
          SCOPE: ${{ needs.classify.outputs.scope }}
          SFS_DEPS: ${{ needs.sfs-deps.result }}
          PLAN: ${{ needs.plan.result }}
          LANES: ${{ needs.lanes.result }}
          TEST: ${{ needs.test.result }}
          NO_LANES: ${{ needs.classify.outputs.lanes == '[]' }}
          NO_SFS_DEPS: ${{ needs.classify.outputs.sfs-deps-none }}
          NO_JOBS: ${{ needs.plan.outputs.jobs == '[]' }}
        run: |
          echo "classify=$CLASSIFY scope=$SCOPE sfs-deps=$SFS_DEPS (none named: $NO_SFS_DEPS) plan=$PLAN lanes=$LANES test=$TEST"
          docs=false
          [ "$SCOPE" = docs-only ] && docs=true
          [ "$CLASSIFY" = success ] &&
            { [ "$SFS_DEPS" = success ] || { [ "$docs" = true ] && [ "$NO_SFS_DEPS" = true ] && [ "$SFS_DEPS" = skipped ]; }; } &&
            [ "$PLAN" = success ] &&
            { [ "$LANES" = success ] || { [ "$NO_LANES" = true ] && [ "$LANES" = skipped ]; }; } &&
            { [ "$TEST" = success ] || { { [ "$NO_JOBS" = true ] || [ "$docs" = true ]; } && [ "$TEST" = skipped ]; }; }
      # With no test job planned there is nothing for the gate lane to merge: the results above are the whole gate.
      - if: inputs.single-job != true && inputs.gate-lane && needs.plan.outputs.jobs != '[]' && needs.plan.outputs.lane-source == 'hook' && needs.classify.outputs.scope != 'docs-only'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ inputs.persist-credentials }}
          fetch-tags: ${{ inputs.fetch-tags }}
          sparse-checkout: ${{ inputs.working-directory != '.' && format('/{0}/', inputs.working-directory) || '' }}
          sparse-checkout-cone-mode: false
      - id: hook
        uses: ./.github/actions/checks-lane
        if: inputs.single-job != true && inputs.gate-lane && needs.plan.outputs.jobs != '[]' && needs.plan.outputs.lane-source == 'hook' && needs.classify.outputs.scope != 'docs-only'
        with:
          lane: gate
          job: ${{ needs.plan.outputs.jobs }}
          profile: ${{ inputs.profile }}
      - if: failure() && inputs.single-job != true
        uses: $/.github/actions/failure-summary
        with:
          job: gate
          reasons: |
            every gate-failed
            hook hook-failed
          steps: ${{ toJSON(steps) }}
          reproduce: gh run view ${{ github.run_id }} --log-failed
