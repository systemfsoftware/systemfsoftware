name: Checks (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: the gate (pnpm check:ci)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CI: "true"
      OXLINT_FORMAT: github
      TSGO_FORMAT: github-actions
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/install-deps
      # `check:turbo-graph` runs a deno-shebang script; the gate job has no deno otherwise.
      - uses: denoland/setup-deno@v2
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      # Root package.json `check:ci` is the one definition. Never re-enumerate its steps here.
      - name: Gate
        run: corepack pnpm check:ci
