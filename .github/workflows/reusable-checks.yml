name: Checks (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: the gate (pnpm check:ci)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/install-deps
      # Annotations only (`--format=github`); turbo cannot pass that from a multi-task run.
      # Never fail-fast here: continue-on-error keeps a lint failure from skipping the Gate,
      # which re-runs the same checks under check:ci --continue and reports every failure.
      - name: Lint (GitHub annotations)
        run: corepack pnpm lint:ci
        continue-on-error: true
      # Root package.json `check:ci` is the one definition. Never re-enumerate its steps here.
      - name: Gate
        run: corepack pnpm check:ci
