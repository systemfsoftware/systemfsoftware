name: Checks (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: the gate (pnpm check:ci)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CI: "true"
      OXLINT_FORMAT: github
      TSGO_FORMAT: github-actions
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/install-deps
      - uses: cachix/install-nix-action@v31
      - name: dprint from the flake
        run: echo "$(nix build --no-link --print-out-paths .#dprint)/bin" >> "$GITHUB_PATH"
      - uses: denoland/setup-deno@v2
      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-checks-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-checks-
            turbo-${{ runner.os }}-
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright chromium
        run: |
          corepack pnpm --filter @systemfsoftware/effect-atom-react exec playwright install chromium
          corepack pnpm --filter @systemfsoftware/effect-playwright exec playwright-core install chromium
      - name: Gate
        run: corepack pnpm check:ci
