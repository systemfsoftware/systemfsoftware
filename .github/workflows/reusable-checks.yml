name: Checks (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: build · typecheck · test · lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/install-deps
      - name: Validate publish config
        run: node scripts/validate-publish-config.mjs
      - run: corepack pnpm build
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
        env:
          CI: "true"
      - run: corepack pnpm lint:ci
      - run: corepack pnpm api:check
