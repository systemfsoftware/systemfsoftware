name: Checks (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: the gate (pnpm check:ci)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CI: "true"
      OXLINT_FORMAT: github
      TSGO_FORMAT: github-actions
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/install-deps
      # Root package.json `check:ci` is the one definition. Never re-enumerate its steps here.
      - name: Gate
        run: corepack pnpm check:ci
