name: Consumer template mutation

# Cost: about 2-6 runner-min/day: one scheduled run a night plus each manual dispatch, at 2-6 job-min per
# run measured on consumer-fixture.yml's push runs 38303711810, 38114462675, 38096214772, 38084890763 and
# 38082583289 (a one-package workspace on the same reusable) until this workflow records its own.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: consumer-template-mutation-${{ github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  mutation:
    name: mutation
    permissions:
      contents: read
      actions: write
    uses: systemfsoftware/systemfsoftware/.github/workflows/reusable-mutation.yml@02bf9653b1ca2b0a2951baf2743bb3f70d19fc77 # main
    with:
      working-directory: templates/consumer
      record: template-mutation-timings
