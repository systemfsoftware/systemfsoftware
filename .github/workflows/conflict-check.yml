name: Conflict check (reusable)

on:
  workflow_call:
    inputs:
      base_ref:
        description: Name of the base branch the PR targets (e.g. main)
        required: true
        type: string
      head_sha:
        description: SHA of the PR head commit (never the merge ref)
        required: true
        type: string

permissions:
  contents: read

jobs:
  conflicts:
    name: no merge conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Non-PR triggers (push/workflow_dispatch) pass an empty head_sha, so both
      # steps skip and the job succeeds; `needs:` downstream jobs still run.
      - name: Checkout PR head
        if: inputs.head_sha != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
      - id: detect
        name: Detect merge conflicts with base
        if: inputs.head_sha != ''
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          mkdir -p "$RUNNER_TEMP/sfs-logs"
          status=0
          git merge-tree --write-tree HEAD FETCH_HEAD > "$RUNNER_TEMP/sfs-logs/merge-tree.log" 2>&1 || status=$?
          case "$status" in
            0) echo "no merge conflicts with $BASE_REF" ;;
            1) echo merge-conflict > "$RUNNER_TEMP/sfs-reason"
               printf '::error title=merge conflicts::This branch conflicts with %s. Resolve the conflicts before CI can proceed.\n' "$BASE_REF" ;;
            *) printf '::error title=conflict detection failed::git merge-tree exited %s (unrelated histories or a git error).\n' "$status" ;;
          esac
          cat "$RUNNER_TEMP/sfs-logs/merge-tree.log"
          exit "$status"
      - if: failure()
        uses: $/.github/actions/failure-summary
        with:
          job: conflicts
          reasons: ""
          steps: ${{ toJSON(steps) }}
          reproduce: git fetch --no-tags origin ${{ inputs.base_ref }} && git merge-tree --write-tree HEAD FETCH_HEAD
