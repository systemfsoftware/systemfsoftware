name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  require-changeset:
    if: github.head_ref != 'changeset-release/main'
    name: a publishable-package change needs a changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
      # The gate's own fixtures first, so a broken gate fails as itself rather
      # than as a verdict about the PR. No permissions: the selftest is pure.
      - name: Changeset gate selftest
        run: deno run scripts/guards/check-changeset.ts --selftest
      - name: Require a changeset for publishable-package changes
        run: deno run --allow-run=git --allow-read scripts/guards/check-changeset.ts ${{ github.base_ref }}
