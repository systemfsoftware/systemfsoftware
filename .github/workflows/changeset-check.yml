name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  conflicts:
    name: no merge conflicts
    uses: ./.github/workflows/conflict-check.yml
    with:
      base_ref: ${{ github.event.pull_request.base.ref }}
      head_sha: ${{ github.event.pull_request.head.sha }}
  require-changeset:
    needs: conflicts
    name: a publishable-package change needs a changeset
    uses: systemfsoftware/pnpm-release-management/.github/workflows/changeset-check.yml@54629f2889039eb2e53ccf0179aaf8c7ef0c46a3
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}
    permissions:
      contents: read
      pull-requests: read
