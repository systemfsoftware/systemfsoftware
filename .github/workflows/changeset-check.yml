name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: changeset · shared tooling
    uses: systemfsoftware/pnpm-release-management/.github/workflows/changeset-check.yml@8cd6e83009531de040cd9c03e1370b4966fd2a12
    permissions:
      contents: read
      pull-requests: read
  packed-manifest:
    name: changeset · a packed-manifest change needs an intent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
      - name: Every package whose packed package.json moved is released by a pending intent
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          deno run --config=scripts/deno.jsonc --lock=scripts/deno.lock --frozen --allow-read --allow-env --allow-run=git
          scripts/tools/repo-checks/cli.ts packed-manifest --base "$BASE_SHA"
