name: Nix (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: The flake's directory, relative to the repository root
        required: false
        type: string
        default: .
      systems:
        description: 'JSON list of {"system", "runner"}: one build job per entry'
        required: false
        type: string
        default: '[{"system": "x86_64-linux", "runner": "ubuntu-latest"}, {"system": "aarch64-linux", "runner": "ubuntu-24.04-arm"}]'
      extra-steps:
        description: >-
          JSON list of {"name", "installable"?, "run"} run after the sweep, from the flake's directory; `{system}` in
          either string is the job's system. An entry with an `installable` (`.#<attr path>`) runs only when that
          derivation changed; one without always runs
        required: false
        type: string
        default: "[]"
      compare-across-systems:
        description: An installable (`.#<attr path>`, `{system}` substituted) whose output every system must build byte-identical to the first system's
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: Timeout of each build job
        required: false
        type: number
        default: 60
      docs-globs:
        description: Newline- or comma-separated globs that replace the default docs set; a pull request inside the set builds nothing
        required: false
        type: string
        default: ""
      runs-on:
        description: JSON label list for the classify and compare jobs
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  classify:
    name: classify · docs-only or full
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.diff.outputs.scope }}
    steps:
      - id: diff
        uses: $/.github/actions/classify-diff
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          docs-globs: ${{ inputs.docs-globs }}
      - if: failure()
        uses: $/.github/actions/failure-summary
        with:
          job: classify
          reasons: diff classify-failed
          steps: ${{ toJSON(steps) }}
          reproduce: gh run view ${{ github.run_id }} --log-failed

  build:
    name: flake outputs · ${{ matrix.system }}
    needs: classify
    if: needs.classify.outputs.scope != 'docs-only'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.systems) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@v31
      - id: eval
        name: Outputs this diff changed
        env:
          SYSTEM: ${{ matrix.system }}
          BASE: ${{ github.event.pull_request.base.sha }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          EXTRA_STEPS: ${{ inputs.extra-steps }}
        run: |
          mkdir -p "$RUNNER_TEMP/sfs-logs" "$RUNNER_TEMP/sfs-nix"
          out="$RUNNER_TEMP/sfs-nix"
          dir=$([ "$WORKING_DIRECTORY" = . ] && echo || echo "&dir=$WORKING_DIRECTORY")
          jq -c --arg s "$SYSTEM" \
            '[.[] | .installable // empty | gsub("\\{system\\}"; $s) | ltrimstr(".#") | split(".")]' \
            <<< "$EXTRA_STEPS" > "$out/paths.json"
          drvs() {
            FLAKE="$1" PATHS="$(cat "$out/paths.json")" nix eval --json --impure --expr '
              let
                f = builtins.getFlake (builtins.getEnv "FLAKE");
                s = builtins.getEnv "SYSTEM";
                drv = v: let r = builtins.tryEval (v.drvPath or null); in if r.success then r.value else null;
                at = p: builtins.foldl'"'"' (a: k: if builtins.isAttrs a then a.${k} or null else null) f p;
              in {
                packages = builtins.mapAttrs (n: drv) (f.packages.${s} or {});
                checks = builtins.mapAttrs (n: drv) (f.checks.${s} or {});
                extra = map (p: drv (at p)) (builtins.fromJSON (builtins.getEnv "PATHS"));
              }'
          }
          start=$SECONDS
          drvs "git+file://$GITHUB_WORKSPACE?shallow=1&rev=$(git rev-parse HEAD)$dir" > "$out/head.json" 2> >(tee "$RUNNER_TEMP/sfs-logs/eval-head.log" >&2)
          head_seconds=$((SECONDS - start))
          echo '{}' > "$out/base.json"
          base_seconds=-
          if [ -n "$BASE" ]; then
            start=$SECONDS
            if git fetch -q --no-tags --depth=1 origin "$BASE" &&
              drvs "git+file://$GITHUB_WORKSPACE?shallow=1&rev=$BASE$dir" > "$out/base.json" 2> "$RUNNER_TEMP/sfs-logs/eval-base.log"; then
              base_seconds=$((SECONDS - start))
            else
              echo '{}' > "$out/base.json"
              base_seconds="failed after $((SECONDS - start))"
              echo "::warning::the base commit $BASE did not evaluate; every output builds"
            fi
          fi
          # An output builds unless the base commit evaluated it to the same derivation.
          jq -c --slurpfile b "$out/base.json" '
            def changed($base; $kind):
              [(.[$kind] // {}) | to_entries[] | select(.value == null or .value != (($base[$kind] // {})[.key])) | .key];
            ($b[0]) as $base
            | changed($base; "packages") as $packages
            | changed($base; "checks") as $checks
            | {
                packages: $packages,
                checks: $checks,
                unchanged: ((((.packages // {}) | length) + ((.checks // {}) | length)) - ($packages + $checks | length)),
                extra: [.extra | to_entries[] | (.value == null or .value != (($base.extra // [])[.key]))]
              }' "$out/head.json" > "$out/plan.json"
          unevaluated=$(jq -r '[(.packages, .checks) | to_entries[] | select(.value == null) | .key] | join(", ")' "$out/head.json")
          {
            echo "### Nix ($SYSTEM)"
            echo "- evaluation: head ${head_seconds}s, base commit ${base_seconds}s"
            echo "- build: $(jq -r '(.packages | map("packages." + .)) + (.checks | map("checks." + .)) | join(", ") | if . == "" then "nothing" else . end' "$out/plan.json")"
            echo "- unchanged, not built: $(jq -r .unchanged "$out/plan.json")"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$unevaluated" ]; then
            echo "::error title=nix-eval-failed::$SYSTEM outputs that did not evaluate: $unevaluated"
            exit 1
          fi
      - id: sweep
        name: Changed packages and checks build
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          plan="$RUNNER_TEMP/sfs-nix/plan.json"
          mapfile -t installables < <(jq -r --arg s "$SYSTEM" '(.packages[] | ".#packages.\($s).\(.)"), (.checks[] | ".#checks.\($s).\(.)")' "$plan")
          [ "${#installables[@]}" -gt 0 ] || { echo "no output changed"; exit 0; }
          set -o pipefail
          nix build --no-link --keep-going -L "${installables[@]}" 2>&1 | tee "$RUNNER_TEMP/sfs-logs/build.log"
      - id: extra
        name: Extra steps
        env:
          SYSTEM: ${{ matrix.system }}
          EXTRA_STEPS: ${{ inputs.extra-steps }}
        run: |
          changed="$RUNNER_TEMP/sfs-nix/plan.json"
          count=$(jq length <<< "$EXTRA_STEPS")
          path=0
          for i in $(seq 0 $((count - 1))); do
            entry=$(jq -c --argjson i "$i" '.[$i]' <<< "$EXTRA_STEPS")
            name=$(jq -r .name <<< "$entry")
            if jq -e 'has("installable")' <<< "$entry" > /dev/null; then
              built=$(jq -r --argjson p "$path" '.extra[$p]' "$changed")
              path=$((path + 1))
              if [ "$built" != true ]; then
                echo "$name: unchanged, skipped"
                echo "- $name: unchanged, skipped" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
            fi
            run=$(jq -r --arg s "$SYSTEM" '.run | gsub("\\{system\\}"; $s)' <<< "$entry")
            echo "::group::$name"
            set +e
            bash -e -o pipefail -c "$run" 2>&1 | tee "$RUNNER_TEMP/sfs-logs/extra-$i.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$code" != 0 ]; then
              echo "::error title=nix-build-failed::extra step '$name' exited $code"
              exit "$code"
            fi
            echo "- $name: passed" >> "$GITHUB_STEP_SUMMARY"
          done
      - id: compare
        name: Output to compare across systems
        if: inputs.compare-across-systems != ''
        env:
          SYSTEM: ${{ matrix.system }}
          COMPARE: ${{ inputs.compare-across-systems }}
        run: |
          installable=${COMPARE//\{system\}/$SYSTEM}
          set -o pipefail
          cp -rL "$(nix build --no-link --print-out-paths "$installable" 2> >(tee "$RUNNER_TEMP/sfs-logs/compare.log" >&2))" "$RUNNER_TEMP/sfs-compare"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.compare-across-systems != ''
        with:
          name: nix-compare-${{ matrix.system }}
          path: ${{ runner.temp }}/sfs-compare/
          if-no-files-found: error
          retention-days: 1
      - if: failure()
        uses: $/.github/actions/failure-summary
        with:
          job: nix-${{ matrix.system }}
          reasons: |
            eval nix-eval-failed
            sweep nix-build-failed
            extra nix-build-failed
            compare nix-build-failed
          steps: ${{ toJSON(steps) }}
          reproduce: nix build -L .#checks.${{ matrix.system }}
          working-directory: ${{ inputs.working-directory }}

  compare:
    name: outputs match across systems
    needs: build
    if: inputs.compare-across-systems != '' && needs.build.result == 'success'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nix-compare-*
          path: compare
      - id: compare
        name: Every system builds every file byte-identical to the first system
        env:
          FIRST: ${{ fromJSON(inputs.systems)[0].system }}
          SYSTEMS: ${{ inputs.systems }}
        run: |
          set -euo pipefail
          ref=compare/nix-compare-$FIRST
          missing=$(jq -r '.[].system' <<< "$SYSTEMS" | while read -r system; do
            [ -d "compare/nix-compare-$system" ] || printf '%s ' "$system"
          done)
          if [ -n "$missing" ]; then
            echo compare-artifact-missing > "$RUNNER_TEMP/sfs-reason"
            echo "::error title=compare-artifact-missing::no compare output from: $missing"
            exit 1
          fi
          status=0
          for dir in compare/nix-compare-*; do
            [ "$dir" = "$ref" ] && continue
            for file in $(cd "$ref" && ls); do
              if cmp -s "$ref/$file" "$dir/$file"; then continue; fi
              status=1
              echo "::error::${dir#compare/nix-compare-} builds $file differently from $FIRST"
              case "$file" in *.tgz) ;; *) continue ;; esac
              a="$(mktemp -d)" b="$(mktemp -d)"
              tar -xzf "$ref/$file" -C "$a"
              tar -xzf "$dir/$file" -C "$b"
              diff <(tar -tvzf "$ref/$file") <(tar -tvzf "$dir/$file") || true
              diff -ru "$a" "$b" | head -200 || true
            done
          done
          [ "$status" = 0 ] || echo outputs-differ-across-systems > "$RUNNER_TEMP/sfs-reason"
          exit "$status"
      - if: failure()
        uses: $/.github/actions/failure-summary
        with:
          job: compare
          reasons: compare outputs-differ-across-systems
          steps: ${{ toJSON(steps) }}
          reproduce: nix build --rebuild ${{ inputs.compare-across-systems }}
