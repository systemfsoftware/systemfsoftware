name: Artifact cleanup

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  closed-pull-request-artifacts:
    name: closed and merged pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint the cleanup App's installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ARTIFACT_CLEANUP_APP_ID }}
          private-key: ${{ secrets.ARTIFACT_CLEANUP_APP_PRIVATE_KEY }}
          owner: systemfsoftware
          permission-actions: write
          permission-contents: read
          permission-pull-requests: read
      - name: Delete artifacts of closed and merged pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: systemfsoftware
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?the cleanup App token was not minted}"

          deleted=0
          reclaimed=0
          kept=0
          summary="$GITHUB_STEP_SUMMARY"
          echo '**Artifacts deleted (runs of closed or merged pull requests)**' >> "$summary"

          repos="$(gh api "orgs/$ORG/repos" --paginate --jq '.[] | select(.private == true) | .full_name')"
          for repo in $repos; do
            declare -A pr_state_of_branch=()
            while IFS=$'\t' read -r id branch bytes; do
              [ -n "$id" ] || continue
              # Tab is IFS whitespace, so an empty branch would shift the columns; jq writes "-" for it instead.
              if [ "$branch" = "-" ]; then kept=$((kept + 1)); continue; fi
              if [ -z "${pr_state_of_branch[$branch]:-}" ]; then
                pr_state_of_branch[$branch]="$(gh api "repos/$repo/pulls?head=$ORG:$branch&state=closed" --jq 'if length > 0 then "closed" else "kept" end')"
              fi
              if [ "${pr_state_of_branch[$branch]}" = "closed" ]; then
                gh api -X DELETE "repos/$repo/actions/artifacts/$id"
                deleted=$((deleted + 1))
                reclaimed=$((reclaimed + bytes))
                echo "- \`$repo\` artifact \`$id\` from \`$branch\`: $bytes bytes" >> "$summary"
              else
                kept=$((kept + 1))
              fi
            done < <(gh api "repos/$repo/actions/artifacts" --paginate --jq '.artifacts[] | [.id, ((.workflow_run.head_branch // "") | if . == "" then "-" else . end), (.size_in_bytes // 0)] | @tsv')
          done

          echo "Deleted $deleted artifacts ($reclaimed bytes reclaimed); kept $kept artifacts of runs with no closed or merged pull request." >> "$summary"
          echo "::notice title=artifact-cleanup::Deleted $deleted closed-pull-request artifacts, reclaimed $reclaimed bytes, kept $kept"
