name: Mutation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    name: mutation
    uses: ./.github/workflows/reusable-mutation.yml
    permissions:
      contents: read
      actions: write
