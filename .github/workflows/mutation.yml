name: Mutation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TIMINGS: deno run --config=scripts/deno.jsonc --lock=scripts/deno.lock --allow-read --allow-write --allow-env scripts/tools/test-timings.ts
  TARGET_SECONDS: 900

jobs:
  plan:
    name: plan · mutation jobs from recorded timings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - name: Latest timing record from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .timings/previous
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=mutation-timings&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0].id // empty') || id=
          if [ -n "$id" ] && gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > .timings/previous.zip; then
            unzip -o -q .timings/previous.zip -d .timings/previous || true
          fi
          ls .timings/previous
      - id: plan
        run: $TIMINGS plan --task mutation --target "$TARGET_SECONDS" --max-jobs 20 --unknown-seconds "$TARGET_SECONDS" --record .timings/previous/mutation-timings.json
      - uses: actions/upload-artifact@v7
        with:
          name: mutation-timings-previous
          path: .timings/previous/
          if-no-files-found: ignore
          retention-days: 1

  mutation:
    name: mutation · ${{ matrix.job.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps
      - uses: denoland/setup-deno@v2
      - name: Build
        run: corepack pnpm exec turbo run build --output-logs=errors-only --log-order=stream ${{ matrix.job.filters }}

      - uses: actions/cache/restore@v6
        with:
          path: .stryker-incremental
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-
      - name: Place incremental files
        run: if [ -d .stryker-incremental ]; then cp -a .stryker-incremental/. .; fi

      - name: Mutation
        env:
          JOB: ${{ toJSON(matrix.job) }}
          JOB_ID: ${{ matrix.job.id }}
        run: |
          status=0
          shard=$(jq -r 'if .shard then "\(.shard.index)/\(.shard.count)" else "" end' <<<"$JOB")
          incremental="reports/stryker-incremental${shard:+-${shard/\//of}}.json"
          mkdir -p .timings mutation-parts incremental
          while IFS=$'\t' read -r name dir; do
            label="$dir${shard:+ ($shard)}"
            start=$SECONDS
            code=0
            STRYKER_SHARD="$shard" timeout --kill-after=1m $((TARGET_SECONDS * 2)) \
              corepack pnpm --filter "$name" mutation --incrementalFile "$incremental" || code=$?
            $TIMINGS part --task mutation --job "$JOB_ID" --out ".timings/$JOB_ID.json" \
              --package "$name" ${shard:+--shard "$shard"} --seconds "$((SECONDS - start))" --exit "$code"

            outcome=$([ "$code" = 0 ] && echo success || echo failure)
            ./scripts/tools/build-mutation-summary.ts --package "$label" --outcome "$outcome" --reports-dir "$dir/reports"
            ./scripts/tools/build-mutation-summary.ts --require --package "$label" --outcome "$outcome" --reports-dir "$dir/reports" || status=1

            report="$dir/reports/mutation/mutation.json"
            if ! { [ -f "$report" ] && jq -e '.files | length == 0' "$report" > /dev/null; }; then
              part="mutation-parts/$(tr '/' '-' <<<"$dir")"
              mkdir -p "$part"
              jq -n --arg package "$label" --arg outcome "$outcome" '{$package, $outcome}' > "$part/mutation-part.json"
              if [ -f "$report" ]; then cp "$report" "$part/mutation-report.json"; fi
              if [ -f "$dir/reports/mutation-stream.jsonl" ]; then cp "$dir/reports/mutation-stream.jsonl" "$part/"; fi
            fi
            if [ -f "$dir/$incremental" ]; then
              mkdir -p "incremental/$dir/reports"
              cp "$dir/$incremental" "incremental/$dir/$incremental"
            fi
          done < <(jq -r '[.packages, .dirs] | transpose[] | @tsv' <<<"$JOB")
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-timings-part-${{ matrix.job.id }}
          path: .timings/${{ matrix.job.id }}.json
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-incremental-${{ matrix.job.id }}
          path: incremental/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-part-${{ matrix.job.id }}
          path: mutation-parts/
          if-no-files-found: ignore
          retention-days: 1

  timings:
    name: record mutation timings
    needs: [plan, mutation]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: mutation-timings-part-*
          path: .timings/parts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: mutation-timings-previous
          path: .timings/previous
      - name: Merge this run into the record
        run: $TIMINGS merge --task mutation --target "$TARGET_SECONDS" --previous .timings/previous/mutation-timings.json --parts .timings/parts --out .timings/mutation-timings.json --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: mutation-timings
          path: .timings/mutation-timings.json
          retention-days: 30

  report:
    name: Mutation report
    needs: mutation
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps

      - uses: actions/cache/restore@v6
        with:
          path: .stryker-incremental
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: mutation-incremental-*
          path: .stryker-incremental
          merge-multiple: true
      - uses: actions/cache/save@v6
        if: ${{ hashFiles('.stryker-incremental/**') != '' }}
        with:
          path: .stryker-incremental
          key: stryker-incremental-${{ github.run_id }}

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: mutation-parts
          pattern: mutation-part-*
      - name: Merge
        run: |
          pnpm exec stryker merge-reports \
            --parts "$GITHUB_WORKSPACE/mutation-parts" \
            --out "$GITHUB_WORKSPACE/mutation-merged"
      - uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.run_number }}
          path: mutation-merged/*
          retention-days: 14

      - name: Delete per-job artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("mutation-part-") or startswith("mutation-incremental-")) | .id' \
          | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
