# Cost: at most about 180 runner-min/day for the one scheduled run, plus about as much again for each
# manual dispatch (7 from 2026-09-28 to 2026-10-11). Mutation never runs on a push or a pull request.
# A full run mutates the 54 workflow files of 14 packages; #747 modelled it at about 179 job-min from
# the per-package mutant counts of run 37962737026, where the 26-package corpus took 422 job-min. It is
# not yet measured at the 600 s shard target. The nightly run plans only the projects turbo marks
# affected since the last green run; on 5 of the 7 nights 2026-10-06..13 a global input changed, so
# turbo marked every project and the night was a full run. Main's 76 first-parent commits in that week
# (10.9 a day) start no run: the price is per night, not per commit.
name: Mutation
run-name: Mutation ${{ inputs.sha || github.sha }}${{ inputs.night && format(' for {0}', inputs.night) || '' }}

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: A commit on main to test instead of main's tip
        required: false
        type: string
      packages:
        description: JSON array of package names to plan instead of every package
        required: false
        type: string
      night:
        description: The night's run id a re-test belongs to; it only titles the run
        required: false
        type: string

concurrency:
  group: mutation-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutation:
    name: mutation
    uses: ./.github/workflows/reusable-mutation.yml
    with:
      sha: ${{ inputs.sha }}
      packages: ${{ inputs.packages }}
    permissions:
      contents: read
      actions: write
      pull-requests: write
