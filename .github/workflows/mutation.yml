name: Mutation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
      package_count: ${{ steps.discover.outputs.package_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Changed paths
        id: changed
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            echo 'changed=[]' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$base" HEAD \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.stringify(s.split("\n").filter(Boolean))))' \
              | sed 's/^/changed=/' >> "$GITHUB_OUTPUT"
          fi
      - id: discover
        env:
          MUTATION_CHANGED_PATHS: ${{ steps.changed.outputs.changed }}
        run: node scripts/tools/discover-mutation-targets.mjs --github --changed

  mutation:
    needs: discover
    if: needs.discover.outputs.package_count > 0
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    name: Mutation (${{ matrix.package }})
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps
      - uses: denoland/setup-deno@v2
      - run: corepack pnpm build

      - uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.package }}/reports/stryker-incremental.json
          key: ${{ runner.os }}-stryker-js-9-${{ matrix.package }}-main
          restore-keys: |
            ${{ runner.os }}-stryker-js-9-${{ matrix.package }}-

      # Advisory: a mutation score below threshold never fails this job — the
      # merged report in the `report` job carries that verdict. A run that never
      # produced a report is not a score outcome, so the step below fails red:
      # a missing binary, a crashed run or a timeout must never read green.
      - name: Mutation
        id: mutation
        continue-on-error: true
        timeout-minutes: 30
        run: corepack pnpm turbo mutation --filter=./${{ matrix.package }} --log-order=stream --output-logs=errors-only

      - name: Require a mutation report
        if: ${{ !cancelled() }}
        env:
          PACKAGE: ${{ matrix.package }}
          OUTCOME: ${{ steps.mutation.outcome }}
        run: ./scripts/tools/build-mutation-summary.ts --require --package "$PACKAGE" --outcome "$OUTCOME" --reports-dir "$PACKAGE/reports"

      - name: Write mutation summary
        if: always()
        env:
          PACKAGE: ${{ matrix.package }}
          OUTCOME: ${{ steps.mutation.outcome }}
        run: ./scripts/tools/build-mutation-summary.ts --package "$PACKAGE" --outcome "$OUTCOME" --reports-dir "$PACKAGE/reports"

      - uses: actions/cache/save@v6
        if: ${{ always() && hashFiles(format('{0}/reports/stryker-incremental.json', matrix.package)) != '' }}
        with:
          path: ${{ matrix.package }}/reports/stryker-incremental.json
          key: ${{ runner.os }}-stryker-js-9-${{ matrix.package }}-${{ github.run_id }}

      - name: Record part metadata
        if: always()
        run: |
          mkdir -p '${{ matrix.package }}/reports'
          printf '{"package":"%s","outcome":"%s"}\n' \
            '${{ matrix.package }}' '${{ steps.mutation.outcome }}' \
            > '${{ matrix.package }}/reports/mutation-part.json'

      - name: Sanitize artifact name
        id: sanitize
        if: always()
        run: echo "name=$(echo '${{ matrix.package }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: mutation-part-${{ steps.sanitize.outputs.name }}
          path: |
            ${{ matrix.package }}/reports/mutation-part.json
            ${{ matrix.package }}/reports/mutation/mutation.json
            ${{ matrix.package }}/reports/mutation-stream.jsonl
          if-no-files-found: ignore
          retention-days: 1

  report:
    name: Mutation report
    needs: [discover, mutation]
    if: ${{ !cancelled() && needs.discover.outputs.package_count > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: mutation-parts
          pattern: mutation-part-*

      - name: Merge
        env:
          PACKAGES: ${{ needs.discover.outputs.packages }}
        run: |
          pnpm exec stryker merge-reports \
            --parts "$GITHUB_WORKSPACE/mutation-parts" \
            --out "$GITHUB_WORKSPACE/mutation-merged" \
            --packages "$PACKAGES"

      - uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.run_number }}
          path: mutation-merged/*
          retention-days: 14

      - name: Delete part artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("mutation-part-")) | .id' \
          | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
