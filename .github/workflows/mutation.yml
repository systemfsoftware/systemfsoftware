name: Mutation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      buckets: ${{ steps.discover.outputs.buckets }}
      packages: ${{ steps.discover.outputs.packages }}
      package_count: ${{ steps.discover.outputs.package_count }}
    steps:
      - uses: actions/checkout@v7
      - id: discover
        run: |
          # A mutation target is a workspace package. A stryker.config.json under
          # __tests__ belongs to a CLI fixture the contract lane drives on purpose
          # (broken-config-project is meant to fail), and repos/ is a vendored tree.
          PACKAGES=$(find . -name "stryker.config.json" -not -path "./node_modules/*" -not -path "*/node_modules/*" -not -path "./repos/*" -not -path "*/__tests__/*" -exec dirname {} \; | sed 's|^\./||' | jq -R -s -c 'split("\n") | map(select(length > 0)) | sort')
          if [ -z "$PACKAGES" ] || [ "$PACKAGES" = "[]" ]; then
            PACKAGES="[]"
          fi
          # Bucket the sorted package list into groups of 5 so the matrix runs a
          # handful of runners instead of one per package.
          BUCKETS=$(echo "$PACKAGES" | jq -c 'def chunks($n): if length <= $n then [.] else [.[0:$n]] + (.[$n:] | chunks($n)) end; if length == 0 then [] else [chunks(5)[] | join(" ")] end')
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "buckets=$BUCKETS" >> "$GITHUB_OUTPUT"
          echo "package_count=$(echo "$PACKAGES" | jq 'length')" >> "$GITHUB_OUTPUT"

  mutation:
    needs: discover
    if: needs.discover.outputs.package_count > 0
    strategy:
      fail-fast: false
      matrix:
        bucket: ${{ fromJson(needs.discover.outputs.buckets) }}
    name: Mutation bucket ${{ strategy.job-index }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps

      # Restore the turbo cache under a mutation-specific, per-bucket key so it
      # never collides with the check job's `turbo-...` key on the same commit.
      - name: Restore turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-mutation-${{ runner.os }}-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: |
            turbo-mutation-${{ runner.os }}-${{ strategy.job-index }}-

      - run: corepack pnpm build

      # Per-package incremental reports, staged into a per-bucket directory so a
      # bucket only persists its own packages' reports (no cross-bucket collision).
      - name: Restore incremental reports
        id: restore-incremental
        uses: actions/cache/restore@v6
        with:
          path: bucket-incremental
          key: stryker-incremental-${{ strategy.job-index }}-main
          restore-keys: |
            stryker-incremental-${{ strategy.job-index }}-

      - name: Unstage incremental reports
        if: steps.restore-incremental.outputs.cache-hit == 'true'
        run: |
          find bucket-incremental -name stryker-incremental.json | while read -r f; do
            pkg=${f#bucket-incremental/}
            pkg=${pkg%/stryker-incremental.json}
            mkdir -p "$pkg/reports"
            cp "$f" "$pkg/reports/stryker-incremental.json"
          done

      # A mutation score below threshold fails this job — stryker exits non-zero
      # on break. A run that never produced a report is a distinct infra failure
      # (missing binary, crash, or timeout), caught by the step below.
      - name: Mutation
        id: mutation
        timeout-minutes: 210
        run: |
          filters=""
          for pkg in ${{ matrix.bucket }}; do
            filters="$filters --filter=./$pkg"
          done
          corepack pnpm turbo mutation $filters --concurrency=2 --continue=dependencies-successful

      - name: Require a mutation report
        if: ${{ !cancelled() }}
        run: |
          for pkg in ${{ matrix.bucket }}; do
            report="$pkg/reports/mutation-report.json"
            if [ ! -f "$report" ]; then
              echo "::error title=Mutation produced no report::$pkg: stryker exited '${{ steps.mutation.outcome }}' without writing $report — infrastructure failure (missing binary, crashed run or timeout), not a score outcome."
              exit 1
            fi
          done

      - name: Stage incremental reports
        if: steps.mutation.outcome == 'success'
        run: |
          mkdir -p bucket-incremental
          for pkg in ${{ matrix.bucket }}; do
            if [ -f "$pkg/reports/stryker-incremental.json" ]; then
              mkdir -p "bucket-incremental/$pkg"
              cp "$pkg/reports/stryker-incremental.json" "bucket-incremental/$pkg/stryker-incremental.json"
            fi
          done

      - name: Save incremental reports
        uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.mutation.outcome == 'success'
        with:
          path: bucket-incremental
          key: stryker-incremental-${{ strategy.job-index }}-main-${{ github.run_id }}

      - name: Save turbo cache
        uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.mutation.outcome == 'success'
        with:
          path: .turbo/cache
          key: turbo-mutation-${{ runner.os }}-${{ strategy.job-index }}-${{ github.sha }}-${{ github.run_id }}

      - name: Stage part artifacts
        if: always()
        run: |
          mkdir -p bucket-parts
          for pkg in ${{ matrix.bucket }}; do
            d="bucket-parts/$(echo "$pkg" | tr '/' '-')"
            mkdir -p "$d"
            printf '{"package":"%s","outcome":"%s"}\n' "$pkg" '${{ steps.mutation.outcome }}' > "$d/mutation-part.json"
            cp "$pkg/reports/mutation-report.json" "$d/mutation-report.json" 2>/dev/null || true
          done

      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: mutation-part-${{ strategy.job-index }}
          path: bucket-parts/**
          if-no-files-found: ignore
          retention-days: 1

  report:
    name: Mutation report
    needs: [discover, mutation]
    if: ${{ !cancelled() && needs.discover.outputs.package_count > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps
      - run: node scripts/tools/merge-mutation-reports.mjs --selftest

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: mutation-parts
          pattern: mutation-part-*

      - name: Merge
        env:
          PACKAGES: ${{ needs.discover.outputs.packages }}
        run: node scripts/tools/merge-mutation-reports.mjs --parts mutation-parts --out mutation-merged

      - uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.run_number }}
          path: mutation-merged/*
          retention-days: 14

      - name: Delete part artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("mutation-part-")) | .id' \
          | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
