name: Release — bump all minor

on:
  workflow_dispatch:

concurrency: release-bump-minor-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  bump-all:
    name: build · bump · publish · push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm bump:minor
      - name: Commit version bumps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): bump all packages to minor"
          git tag "bump-minor-$(date +%Y%m%d-%H%M%S)"
      - name: Publish all packages
        run: |
          pnpm -r --filter='!@systemfsoftware/oxlint-config' --filter='!@systemfsoftware/vitest-config' publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: Push commit and tag
        run: git push --follow-tags
