name: Microsandbox smoke (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke · effect-microsandbox journeys (real microVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/install-deps
      - name: Grant KVM access via udev rule
        run: |
          echo 'KERNEL=="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
      - name: Smoke journeys
        run: corepack pnpm --filter @systemfsoftware/effect-microsandbox smoke
